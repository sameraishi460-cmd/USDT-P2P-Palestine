<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<title>USDT P2P فلسطين</title>


<style>

}


.box{

    max-width:450px;
    margin:50px auto;
    background:#1e293b;

    border-radius:20px;
    text-align:center;

}


button{

    width:100%;
    padding:15px;
    background:#229ED9;

    border:0;
    border-radius:10px;
    font-size:18px;

}


</style>


</head>


<body>


<div class="box">

🇵🇸 USDT P2P فلسطين
</h2>


<p>
تسجيل الدخول عبر Telegram
</p>

</html>
