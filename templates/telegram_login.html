<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USDT P2P فلسطين — Telegram</title>
  <link rel="stylesheet" href="/static/design-system.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-deep);
      background-image: radial-gradient(ellipse at 50% 30%, rgba(34,158,217,0.08) 0%, transparent 50%);
      padding: var(--sp-4);
    }
    .auth-wrapper {
      width: 100%;
      max-width: 400px;
      text-align: center;
      animation: slideUp 0.5s ease;
    }
    .auth-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-2xl);
      padding: var(--sp-6);
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div style="margin-bottom:var(--sp-6);">
      <div style="width:64px;height:64px;border-radius:var(--radius-xl);background:linear-gradient(135deg,#229ED9,#1a8bc4);display:flex;align-items:center;justify-content:center;font-size:1.75rem;margin:0 auto var(--sp-3);box-shadow:0 4px 16px rgba(34,158,217,0.3);">📲</div>
      <h1 style="font-size:1.4rem;font-weight:800;">🇵🇸 USDT P2P فلسطين</h1>
      <p style="color:var(--text-muted);font-size:0.85rem;">تسجيل الدخول عبر Telegram</p>
    </div>
    <div class="auth-card">
      <form method="POST" action="/telegram_auth">
        <input type="hidden" name="telegram_id" value="{{ request.args.get('id') }}">
        <input type="hidden" name="username" value="{{ request.args.get('username') }}">
        <input type="hidden" name="first_name" value="{{ request.args.get('first_name') }}">
        <button type="submit" class="btn btn-telegram btn-block btn-lg">🚀 دخول المنصة</button>
      </form>
    </div>
    <a href="/" style="display:block;margin-top:var(--sp-4);color:var(--text-secondary);font-size:0.9rem;">العودة للرئيسية</a>
  </div>
</body>
</html>
