<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <title>USDT P2P Palestine — Telegram</title>
  <link rel="stylesheet" href="/static/design-system.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
  <div style="text-align:center;padding:var(--sp-6);max-width:360px;">
    <div style="font-size:4rem;margin-bottom:var(--sp-4);">🇵🇸</div>
    <h1 style="font-size:1.5rem;margin-bottom:var(--sp-3);">USDT P2P Palestine</h1>
    <p style="color:var(--text-muted);margin-bottom:var(--sp-6);">جاري تسجيل الدخول عبر Telegram...</p>
    <div class="spinner"></div>
    <p style="color:var(--text-muted);font-size:0.8rem;margin-top:var(--sp-4);" id="status">يرجى الانتظار...</p>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
  (function() {
    var tg = window.Telegram && Telegram.WebApp;
    if (!tg) {
      document.getElementById('status').textContent = 'يرجى فتح هذا الرابط من داخل Telegram';
      return;
    }

    tg.ready();
    tg.expand();

    var initData = tg.initDataUnsafe;
    if (!initData || !initData.user) {
      document.getElementById('status').textContent = 'خطأ في بيانات Telegram';
      return;
    }

    var form = document.createElement('form');
    form.method = 'POST';
    form.action = '/telegram_auth';

    var fields = {
      'telegram_id': initData.user.id,
      'username': initData.user.username || '',
      'first_name': initData.user.first_name || '',
      'initData': tg.initData || ''
    };

    for (var key in fields) {
      var input = document.createElement('input');
      input.type = 'hidden';
      input.name = key;
      input.value = fields[key];
      form.appendChild(input);
    }

    document.body.appendChild(form);
    form.submit();
  })();
  </script>
</body>
</html>
