{% extends "base.html" %}
{% block title %}التنبيهات - USDT P2P Palestine{% endblock %}
{% block content %}
<div class="container">
  <div class="page-header"><h2>🔔 التنبيهات</h2></div>
  {% if notifications %}
    {% for n in notifications %}
    <div class="card" style="border-right:3px solid {% if n.seen %}var(--border){% else %}var(--primary){% endif %};">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-1);">
        <span style="font-weight:700;font-size:0.9rem;">{{ n.title }}</span>
        <span style="font-size:0.7rem;color:var(--text-muted);">{{ n.created }}</span>
      </div>
      <p style="font-size:0.85rem;color:var(--text-secondary);margin:0;">{{ n.message }}</p>
    </div>
    {% endfor %}
  {% else %}
    <div class="empty-state">
      <div class="empty-state-icon">🔔</div>
      <div class="empty-state-text">لا توجد تنبيهات</div>
    </div>
  {% endif %}
</div>
{% endblock %}
