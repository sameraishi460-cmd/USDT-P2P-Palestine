<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول - USDT Exchange Palestine</title>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    font-family:Tajawal, Arial, sans-serif;

    background:linear-gradient(135deg,#0f172a,#1e40af);

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

}



.box{

    background:white;

    width:92%;

    max-width:420px;

    padding:30px;

    border-radius:25px;

    box-shadow:0 15px 40px rgba(0,0,0,0.25);

}



.logo{

    text-align:center;

    font-size:30px;

    font-weight:bold;

    color:#16a34a;

    margin-bottom:5px;

}



.subtitle{

    text-align:center;

    color:#666;

    margin-bottom:25px;

    font-size:14px;

}



h2{

    text-align:center;

    color:#111;

    margin-bottom:20px;

}



.input-group{

    margin-bottom:15px;

}



label{

    display:block;

    margin-bottom:5px;

    color:#444;

    font-size:14px;

}



input{

    width:100%;

    padding:14px;

    border-radius:12px;

    border:1px solid #ddd;

    font-size:15px;

    outline:none;

    transition:.3s;

}



input:focus{

    border-color:#2563eb;

    box-shadow:0 0 5px #93c5fd;

}



.remember{

    display:flex;

    align-items:center;

    gap:8px;

    margin:15px 0;

    font-size:14px;

}



.remember input{

    width:auto;

}



button{

    width:100%;

    padding:14px;

    background:#16a34a;

    color:white;

    border:none;

    border-radius:12px;

    font-size:17px;

    cursor:pointer;

    transition:.3s;

}



button:hover{

    background:#15803d;

}



.telegram{

    margin-top:15px;

    display:block;

    text-align:center;

    padding:14px;

    background:#229ED9;

    color:white;

    border-radius:12px;

    text-decoration:none;

    font-size:16px;

}



.register{

    margin-top:20px;

    text-align:center;

    color:#2563eb;

    text-decoration:none;

}



.home{

    margin-top:12px;

    text-align:center;

    color:#666;

    text-decoration:none;

}



.footer{

    text-align:center;

    margin-top:25px;

    font-size:12px;

    color:#999;

}


</style>


</head>


<body>


<div class="box">


<div class="logo">

💎 USDT Exchange Palestine

</div>


<div class="subtitle">

منصتك الآمنة لشراء وبيع USDT

</div>



<h2>

🔐 تسجيل الدخول

</h2>



<form method="POST">


<div class="input-group">

<label>
اسم المستخدم
</label>

<input

name="username"

placeholder="أدخل اسم المستخدم"

required

>

</div>



<div class="input-group">

<label>
كلمة المرور
</label>

<input

type="password"

name="password"

placeholder="أدخل كلمة المرور"

required

>

</div>



<div class="remember">

<input type="checkbox" name="remember">

<label>
تذكرني لمدة 30 يوم
</label>

</div>



<button type="submit">

دخول

</button>


</form>



<a class="telegram" href="/telegram_login">

📲 دخول عبر Telegram

</a>



<a class="register" href="/register">

إنشاء حساب جديد

</a>



<a class="home" href="/">

العودة للرئيسية

</a>



<div class="footer">

© USDT Exchange Palestine

</div>



</div>


</body>

</html>
