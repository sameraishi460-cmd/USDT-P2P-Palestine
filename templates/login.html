{% extends "base.html" %}
{% block title %}دخول - USDT P2P Palestine{% endblock %}
{% block content %}
<div class="container container-narrow" style="padding-top:var(--sp-8);">

  <div style="text-align:center;margin-bottom:var(--sp-8);">
    <div style="font-size:3rem;margin-bottom:var(--sp-3);">🇵🇸</div>
    <h1 style="font-size:1.8rem;">مرحباً بك</h1>
    <p style="color:var(--text-muted);font-size:0.9rem;margin-top:var(--sp-2);">ادخل إلى حسابك في USDT P2P Palestine</p>
  </div>

  <form method="POST" action="/login" class="card">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
      <label class="form-label">👤 اسم المستخدم</label>
      <input class="form-input" type="text" name="username" placeholder="أدخل اسم المستخدم" required autocomplete="username" autofocus>
    </div>

    <div class="form-group">
      <label class="form-label">🔒 كلمة المرور</label>
      <input class="form-input" type="password" name="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
    </div>

    <button type="submit" class="btn btn-success btn-block btn-lg" onclick="haptic('success')">
      🚀 دخول
    </button>
  </form>

  <div style="text-align:center;margin-top:var(--sp-6);">
    <p style="color:var(--text-muted);font-size:0.85rem;">
      ليس لديك حساب؟ <a href="/register" style="color:var(--accent-light);font-weight:600;">سجل الآن</a>
    </p>
  </div>

</div>
{% endblock %}
