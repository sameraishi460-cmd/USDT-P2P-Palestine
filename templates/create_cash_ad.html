{% extends "base.html" %}
{% block title %}إنشاء إعلان مقابلة - USDT P2P Palestine{% endblock %}
{% block content %}
<div class="container container-narrow">
  <a href="/cash_market" class="back-link">⬅️ سوق المقابلات</a>
  <div class="page-header"><h2>🤝 إنشاء إعلان مقابلة شخصية</h2></div>

  <div class="card" style="text-align:center;background:linear-gradient(135deg,rgba(34,197,94,0.08),var(--bg-surface));">
    <div style="font-size:0.8rem;color:var(--text-muted);">💰 رصيدك المتاح</div>
    <div class="price-display" style="font-size:1.5rem;">{{ wallet_balance|default(0) }} <span class="price-currency">USDT</span></div>
  </div>

  <form method="POST" action="/create_cash_ad">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <div class="card">
      <div class="card-title">📝 تفاصيل المقابلة</div>
      <div class="form-group mt-4">
        <label class="form-label">🏙️ المدينة</label>
        <input class="form-input" type="text" name="city" placeholder="مثال: رام الله" required>
      </div>
      <div class="form-group">
        <label class="form-label">📍 نقطة اللقاء</label>
        <input class="form-input" type="text" name="location" placeholder="مثال: وسط البلد" required>
      </div>
      <div class="form-group">
        <label class="form-label">💰 الكمية (USDT)</label>
        <input class="form-input" type="number" step="0.01" min="1" name="amount" placeholder="أدخل الكمية" required>
      </div>
      <div class="form-group">
        <label class="form-label">💲 السعر (₪ لكل USDT)</label>
        <input class="form-input" type="number" step="0.01" min="0.01" name="price" placeholder="السعر" required>
      </div>
      <div class="form-group">
        <label class="form-label">📝 ملاحظات إضافية</label>
        <textarea class="form-input" name="notes" placeholder="تفاصيل إضافية عن المقابلة..." rows="3"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">📅 مدة الإعلان</label>
        <select class="form-input" name="plan">
          <option value="day">يوم واحد</option>
          <option value="week" selected>أسبوع</option>
          <option value="month">شهر</option>
        </select>
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block btn-lg mt-4" onclick="haptic('success')">🚀 نشر الإعلان</button>
  </form>
</div>
{% endblock %}
