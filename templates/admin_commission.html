{% extends "base.html" %}
{% block title %}تعديل العمولة - USDT P2P Palestine{% endblock %}

{% block content %}
<div class="container container-narrow">

  <a href="/admin" class="back-link mb-4">⬅️ الرجوع للوحة الأدمن</a>

  <div class="page-header">
    <h2>⚙️ تعديل العمولة</h2>
  </div>

  <form method="POST" action="/admin_commission" class="card">

    <div class="form-group">
      <label class="form-label">💰 عمولة صفقات USDT (%)</label>
      <input class="form-input" type="number" step="0.1" name="trade_fee" value="{{ commission.trade_fee }}">
      <div class="form-help">النسبة المئوية المحصلة من كل صفقة</div>
    </div>

    <div class="form-group">
      <label class="form-label">🤝 عمولة إعلان المقابلة الشخصية (USDT)</label>
      <input class="form-input" type="number" step="0.1" name="cash_fee" value="{{ commission.cash_fee }}">
      <div class="form-help">المبلغ المحصل لكل إعلان مقابلة</div>
    </div>

    <button type="submit" class="btn btn-success btn-block btn-lg mt-4">💾 حفظ التعديل</button>

  </form>

</div>
{% endblock %}
