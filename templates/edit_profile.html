{% extends "base.html" %}
{% block title %}تعديل الملف الشخصي{% endblock %}

{% block content %}
<div class="container container-narrow">

  <a href="/profile" class="back-link mb-4">⬅️ رجوع للملف الشخصي</a>

  <div class="page-header">
    <h2>💳 بيانات الدفع</h2>
    <p>حدّث معلوماتك الشخصية وبيانات الدفع</p>
  </div>

  <form method="POST" class="card">

    <div class="form-group">
      <label class="form-label">📱 رقم الجوال</label>
      <input class="form-input" type="text" name="phone" value="{{ user.phone or '' }}" placeholder="مثال: 059xxxxxxx" required>
    </div>

    <div class="form-group">
      <label class="form-label">🏦 اسم البنك</label>
      <input class="form-input" type="text" name="bank" value="{{ user.bank or '' }}" placeholder="مثال: بنك فلسطين" required>
    </div>

    <div class="form-group">
      <label class="form-label">💳 رقم الحساب / IBAN</label>
      <input class="form-input" type="text" name="iban" value="{{ user.iban or '' }}" placeholder="رقم الحساب أو IBAN" required>
    </div>

    <div class="form-group">
      <label class="form-label">💵 طريقة الدفع</label>
      <select class="form-select" name="payment_method">
        <option value="تحويل بنكي" {% if user.payment_method == 'تحويل بنكي' %}selected{% endif %}>تحويل بنكي</option>
        <option value="محفظة إلكترونية" {% if user.payment_method == 'محفظة إلكترونية' %}selected{% endif %}>محفظة إلكترونية</option>
        <option value="نقدي" {% if user.payment_method == 'نقدي' %}selected{% endif %}>نقدي</option>
      </select>
    </div>

    <button type="submit" class="btn btn-success btn-block btn-lg mt-4">
      💾 حفظ البيانات
    </button>

  </form>

</div>
{% endblock %}
