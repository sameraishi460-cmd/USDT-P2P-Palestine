{% extends "base.html" %}
{% block title %}دخول الإدارة - USDT P2P Palestine{% endblock %}
{% block content %}
<div class="container container-narrow" style="padding-top:var(--sp-8);">
  <div style="text-align:center;margin-bottom:var(--sp-8);">
    <div style="font-size:3rem;margin-bottom:var(--sp-3);">🔐</div>
    <h1 style="font-size:1.8rem;">دخول الإدارة</h1>
  </div>
  <form method="POST" class="card">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label class="form-label">👤 اسم المستخدم</label>
      <input class="form-input" type="text" name="username" placeholder="Admin" required autofocus>
    </div>
    <div class="form-group">
      <label class="form-label">🔒 كلمة المرور</label>
      <input class="form-input" type="password" name="password" placeholder="كلمة المرور" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block btn-lg">🔐 دخول</button>
  </form>
</div>
{% endblock %}
