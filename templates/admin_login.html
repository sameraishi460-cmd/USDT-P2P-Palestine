<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول الأدمن - USDT P2P Palestine</title>
  <link rel="stylesheet" href="/static/design-system.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-deep);
      background-image: radial-gradient(ellipse at 50% 30%, rgba(59,130,246,0.08) 0%, transparent 50%);
      padding: var(--sp-4);
    }
    .auth-wrapper {
      width: 100%;
      max-width: 400px;
      animation: slideUp 0.5s ease;
    }
    .auth-brand {
      text-align: center;
      margin-bottom: var(--sp-6);
    }
    .auth-brand-icon {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      margin: 0 auto var(--sp-3);
      box-shadow: var(--shadow-glow-blue);
    }
    .auth-brand h1 { font-size: 1.4rem; font-weight: 800; }
    .auth-brand p { color: var(--text-muted); font-size: 0.85rem; }
    .auth-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-2xl);
      padding: var(--sp-6);
    }
    .auth-title {
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: var(--sp-5);
    }
    .auth-links {
      text-align: center;
      margin-top: var(--sp-4);
    }
    .auth-links a {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-brand">
      <div class="auth-brand-icon">🛡️</div>
      <h1>لوحة تحكم الأدمن</h1>
      <p>USDT P2P Palestine</p>
    </div>
    <div class="auth-card">
      <div class="auth-title">🔐 تسجيل الدخول</div>
      <form method="POST">
        <div class="form-group">
          <label class="form-label">اسم المستخدم</label>
          <input class="form-input" name="username" placeholder="اسم المستخدم" required autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <input class="form-input" type="password" name="password" placeholder="كلمة المرور" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">دخول</button>
      </form>
    </div>
    <div class="auth-links">
      <a href="/">العودة للرئيسية</a>
    </div>
  </div>
</body>
</html>
