{% extends "base.html" %}
{% block title %}حساب جديد - USDT P2P Palestine{% endblock %}
{% block content %}
<div class="container container-narrow" style="padding-top:var(--sp-8);">

  <div style="text-align:center;margin-bottom:var(--sp-8);">
    <div style="font-size:3rem;margin-bottom:var(--sp-3);">🇵🇸</div>
    <h1 style="font-size:1.8rem;">إنشاء حساب جديد</h1>
    <p style="color:var(--text-muted);font-size:0.9rem;margin-top:var(--sp-2);">ابدأ التداول في منصة USDT P2P فلسطين</p>
  </div>

  <form method="POST" action="/register" class="card">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
      <label class="form-label">👤 اسم المستخدم</label>
      <input class="form-input" type="text" name="username" placeholder="اختر اسم مستخدم" required minlength="3" maxlength="30" autocomplete="username" autofocus>
      <div class="form-help">3-30 حرف، بدون مسافات</div>
    </div>

    <div class="form-group">
      <label class="form-label">🔒 كلمة المرور</label>
      <input class="form-input" type="password" name="password" placeholder="اختر كلمة مرور قوية" required minlength="6" autocomplete="new-password">
      <div class="form-help">6 أحرف على الأقل</div>
    </div>

    <button type="submit" class="btn btn-success btn-block btn-lg" onclick="haptic('success')">
      🚀 إنشاء الحساب
    </button>
  </form>

  <div style="text-align:center;margin-top:var(--sp-6);">
    <p style="color:var(--text-muted);font-size:0.85rem;">
      لديك حساب بالفعل؟ <a href="/login" style="color:var(--accent-light);font-weight:600;">ادخل هنا</a>
    </p>
  </div>

</div>
{% endblock %}
