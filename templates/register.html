<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب - USDT P2P Palestine</title>
  <link rel="stylesheet" href="/static/design-system.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-deep);
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(34,197,94,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(59,130,246,0.06) 0%, transparent 50%);
      padding: var(--sp-4);
    }

    .auth-wrapper {
      width: 100%;
      max-width: 420px;
      animation: slideUp 0.5s ease;
    }

    .auth-brand {
      text-align: center;
      margin-bottom: var(--sp-6);
    }

    .auth-brand-icon {
      width: 64px;
      height: 64px;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, var(--accent-hover), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      margin: 0 auto var(--sp-3);
      box-shadow: var(--shadow-glow-green);
    }

    .auth-brand h1 {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .auth-brand p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .auth-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-2xl);
      padding: var(--sp-6);
    }

    .auth-title {
      font-size: 1.2rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: var(--sp-5);
    }

    .auth-links {
      text-align: center;
      margin-top: var(--sp-4);
    }

    .auth-links a {
      display: block;
      padding: var(--sp-2);
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .auth-links a.primary-link {
      color: var(--primary-light);
      font-weight: 600;
    }

    .auth-footer {
      text-align: center;
      margin-top: var(--sp-5);
      color: var(--text-muted);
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

<div class="auth-wrapper">

  <div class="auth-brand">
    <div class="auth-brand-icon">🇵🇸</div>
    <h1>USDT P2P Palestine</h1>
    <p>إنشاء حساب جديد</p>
  </div>

  <div class="auth-card">

    <div class="auth-title">👤 إنشاء حساب جديد</div>

    <form method="POST" autocomplete="on">

      <div class="form-group">
        <label class="form-label">اسم المستخدم</label>
        <input
          class="form-input"
          type="text"
          name="username"
          placeholder="اختر اسم مستخدم"
          autocomplete="username"
          required
          autofocus
        >
      </div>

      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <input
          class="form-input"
          type="password"
          name="password"
          placeholder="اختر كلمة مرور قوية"
          autocomplete="new-password"
          required
          minlength="6"
        >
      </div>

      <div class="form-group">
        <label class="form-label">رقم الهاتف</label>
        <input
          class="form-input"
          type="tel"
          name="phone"
          placeholder="059xxxxxxx"
        >
      </div>

      <div class="form-group">
        <label class="form-label">البنك أو طريقة الدفع</label>
        <input
          class="form-input"
          type="text"
          name="bank"
          placeholder="مثال: بنك فلسطين"
        >
      </div>

      <div class="form-group">
        <label class="form-label">عنوان محفظة USDT (BSC)</label>
        <input
          class="form-input ltr"
          type="text"
          name="wallet"
          placeholder="0x..."
          dir="ltr"
          style="text-align:left;"
        >
      </div>

      <button type="submit" class="btn btn-success btn-block btn-lg">
        إنشاء الحساب
      </button>

    </form>

  </div>

  <div class="auth-links">
    <a href="/login" class="primary-link">لدي حساب - تسجيل دخول</a>
    <a href="/">العودة للرئيسية</a>
  </div>

  <div class="auth-footer">
    © 2026 USDT P2P Palestine
  </div>

</div>

</body>
</html>
