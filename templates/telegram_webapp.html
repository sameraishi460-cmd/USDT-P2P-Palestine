<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USDT P2P Telegram</title>
  <link rel="stylesheet" href="/static/design-system.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .loading-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-2xl);
      padding: var(--sp-8);
      max-width: 360px;
    }
  </style>
</head>
<body>
  <div class="loading-card">
    <div style="font-size:2rem;margin-bottom:var(--sp-3);">🚀</div>
    <h2 style="margin-bottom:var(--sp-2);">جاري تسجيل الدخول...</h2>
    <p style="color:var(--text-muted);">منصة USDT P2P Palestine</p>
    <div class="spinner mx-auto mt-4"></div>
  </div>

  <script>
    var tg = window.Telegram.WebApp;
    tg.ready();
    var user = tg.initDataUnsafe.user;
    if (user) {
      window.location.href = "/telegram_auth?id=" + user.id + "&username=" + (user.username || "") + "&first_name=" + (user.first_name || "");
    } else {
      document.querySelector('.loading-card').innerHTML = '<div style="font-size:2rem;margin-bottom:var(--sp-3);">❌</div><h2 style="color:var(--danger);">لا توجد بيانات تلجرام</h2><a href="/" class="btn btn-ghost mt-4">العودة للرئيسية</a>';
    }
  </script>
</body>
</html>
