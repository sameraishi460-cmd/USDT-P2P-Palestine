{% extends "base.html" %}

  <a href="/admin" class="back-link mb-4">⬅️ الرجوع للوحة الأدمن</a>

  <div class="page-header">
    <h2>💲 تعديل أسعار السوق</h2>
  </div>

  <form method="POST" class="card">

    <div class="form-group">
      <label class="form-label">💵 سعر الدولار مقابل الشيكل</label>
      <input class="form-input" type="number" step="0.01" name="usd_ils" value="{{ price.usd_ils }}">
    </div>

    <div class="form-group">
      <label class="form-label">🟢 سعر USDT مقابل الشيكل</label>
      <input class="form-input" type="number" step="0.01" name="usdt_ils" value="{{ price.usdt_ils }}">

  </form>

</div>
{% endblock %}
