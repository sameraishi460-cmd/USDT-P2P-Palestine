{% extends "base.html" %}
{% block title %}سعر السوق - USDT P2P Palestine{% endblock %}
{% block content %}
<div class="container container-narrow">
  <a href="/admin" class="back-link">⬅️ لوحة الأدمن</a>
  <div class="page-header"><h2>💲 التحكم بسعر السوق</h2></div>
  <form method="POST" class="card">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label class="form-label">💵 سعر USD/ILS</label>
      <input class="form-input ltr" type="number" step="0.001" name="usd_ils" value="{{ price['usd_ils'] if price else '3.70' }}" dir="ltr" style="text-align:left;">
    </div>
    <div class="form-group">
      <label class="form-label">🟢 سعر USDT/ILS</label>
      <input class="form-input ltr" type="number" step="0.001" name="usdt_ils" value="{{ price['usdt_ils'] if price else '3.70' }}" dir="ltr" style="text-align:left;">
    </div>
    <button type="submit" class="btn btn-primary btn-block">💾 حفظ</button>
  </form>
  {% if price %}
  <div class="card" style="text-align:center;">
    <div style="color:var(--text-muted);font-size:0.85rem;">آخر تحديث</div>
    <div style="font-weight:600;">{{ price['updated'] }}</div>
  </div>
  {% endif %}
</div>
{% endblock %}
