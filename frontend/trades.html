<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>صفقاتي — USDT P2P Palestine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="navbar">
  <span class="logo">📄 صفقاتي</span>
  <div class="actions"><a href="/" style="font-size:22px;">🏠</a></div>
</div>
<div class="container">
  <div id="tradesList" class="empty"><div class="skeleton"></div><div class="skeleton"></div></div>
</div>
<div class="bottom-nav">
  <a href="/"><span class="icon">🏠</span>الرئيسية</a>
  <a href="/market.html"><span class="icon">🛒</span>السوق</a>
  <a href="/trades.html" class="active"><span class="icon">📄</span>الصفقات</a>
  <a href="/wallet.html"><span class="icon">💰</span>المحفظة</a>
  <a href="/profile.html"><span class="icon">👤</span>حسابي</a>
</div>
<div id="toast"></div>
<script src="assets/app.js"></script>
<script>
  if (!requireAuth('/trades.html')) throw new Error('auth');
  highlightNav('nav-trades');
  (async function() {
    const me = getUser()?.username;
    const r = await get('/trades/');
    if (r?.ok && r.trades?.length) {
      $('#tradesList').innerHTML = r.trades.map(t => {
        const other = t.buyer === me ? t.seller : t.buyer;
        return `<a href="/trade.html?id=${t.id}" class="row-item" style="text-decoration:none;">
          ${profileAvatar(other)}
          <div class="row-main">
            <div class="row-title">#${t.id} — ${escHtml(other)}</div>
            <div class="row-sub">${escHtml(t.ad_title || 'صفقة USDT')} · ${new Date(t.created).toLocaleString('ar')}</div>
          </div>
          <div style="text-align:left;">
            <div style="font-weight:700;">${Number(t.amount).toFixed(2)}</div>
            ${statusBadge(t.status)}
          </div>
        </a>`;
      }).join('');
    } else {
      $('#tradesList').innerHTML = '<div class="empty"><div class="icon">📄</div>لا توجد صفقات بعد<br><a href="/market.html" style="color:var(--primary);">ابدأ بالسوق →</a></div>';
    }
  })();
</script>
</body>
</html>
