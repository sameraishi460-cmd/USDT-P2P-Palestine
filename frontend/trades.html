<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفقات — USDT P2P Palestine</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<nav class="nav" id="nav"></nav>
<main class="main">
<div class="container" id="app">
<div class="loading-skeleton">
<div class="sk sk-card"></div>
<div class="sk sk-card"></div>
</div>
</div>
</main>
<div class="bottom-nav" id="bottomNav"></div>
</div>
<script src="/assets/app.js"></script>
<script>
(function(){
  const app=document.getElementById('app');
  async function load(){
    if(!Auth.isLoggedIn()){location.href='/login';return;}
    let trades=[];
    try{const r=await API.get('/api/trades');trades=r.trades||r||[];}catch(e){}

    app.innerHTML=`
      <div class="page-header">
        <h1 class="page-title">الصفقات</h1>
        <div class="page-subtitle">${trades.length} صفقة</div>
      </div>

      ${trades.length===0?`
        <div class="card">
          <div class="empty-state">
            <div class="empty-icon">🤝</div>
            <div class="empty-title">لا توجد صفقات</div>
            <div class="empty-desc">ابدأ بالبحث في السوق لإنشاء صفقة جديدة</div>
            <a href="/market" class="btn btn-primary" style="margin-top:var(--space-md)">فتح السوق</a>
          </div>
        </div>
      `:trades.map(t=>tradeCard(t)).join('')}
    `;
  }

  function tradeCard(t){
    const statusMap={
      'OPEN':{text:'مفتوحة',cls:'badge-info'},
      'PAYMENT_PENDING':{text:'بانتظار الدفع',cls:'badge-warning'},
      'PAYMENT_SENT':{text:'تم الدفع',cls:'badge-info'},
      'PAYMENT_CONFIRMED':{text:'تم التأكيد',cls:'badge-success'},
      'ESCROW_LOCKED':{text:'في الضمان',cls:'badge-warning'},
      'RELEASED':{text:'تم التحرير',cls:'badge-success'},
      'COMPLETED':{text:'مكتملة',cls:'badge-success'},
      'CANCELLED':{text:'ملغاة',cls:'badge-error'},
      'DISPUTED':{text:'نزاع',cls:'badge-error'},
      'EXPIRED':{text:'منتهية',cls:'badge-error'}
    };
    const s=statusMap[t.status]||{text:t.status,cls:'badge-info'};
    const user=Auth.user();
    const isBuyer=t.buyer_id===user?.id;
    const role=isBuyer?'مشتري':'بائع';
    const counterparty=isBuyer?(t.seller_name||'البائع'):(t.buyer_name||'المشتري');

    return `
      <div class="card trade-card" onclick="location.href='/trades/${t.id}'" style="cursor:pointer">
        <div class="trade-header">
          <div>
            <div style="font-weight:600">#${String(t.id).slice(-8)}</div>
            <div class="text-muted text-sm">${role} ↔ ${counterparty}</div>
          </div>
          <span class="badge ${s.cls}">${s.text}</span>
        </div>
        <div class="trade-body">
          <div class="trade-info">
            <div class="trade-info-item">
              <div class="trade-info-label">المبلغ</div>
              <div class="trade-info-value">${fmtNum(t.usdt_amount)} USDT</div>
            </div>
            <div class="trade-info-item">
              <div class="trade-info-label">السعر</div>
              <div class="trade-info-value">${fmtNum(t.price_per_usdt)} ₪</div>
            </div>
            <div class="trade-info-item">
              <div class="trade-info-label">الإجمالي</div>
              <div class="trade-info-value">${fmtNum(t.total_amount)} ₪</div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  load();
})();
</script>
</body>
</html>
