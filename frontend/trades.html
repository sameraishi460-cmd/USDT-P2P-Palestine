<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07090D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>الصفقات — USDT P2P Palestine</title>
  <link rel="stylesheet" href="/assets/design-system.css">
  <link rel="manifest" href="/manifest.json">
  <script>(function(){var t=localStorage.getItem("usp_theme")||"dark";if(t==="auto")t=window.matchMedia("(prefers-color-scheme:light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t);})();</script>
  <style>
    .trade-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--sp-4);margin-bottom:var(--sp-3);transition:background 0.15s;text-decoration:none;display:block;color:inherit;}
    .trade-card:hover{background:var(--bg-card-hover);}
    .trade-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-2);}
    .trade-id{font-size:0.75rem;color:var(--text-muted);font-weight:600;}
    .trade-amount{font-size:1.1rem;font-weight:800;color:var(--text-primary);}
    .trade-amount small{font-size:0.7rem;font-weight:500;color:var(--text-muted);}
    .trade-meta{display:flex;gap:var(--sp-3);margin-top:var(--sp-2);font-size:0.75rem;color:var(--text-secondary);}
    .trade-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:var(--sp-3);padding-top:var(--sp-2);border-top:1px solid var(--border-light);}
    .trade-status{font-size:0.7rem;padding:3px 10px;border-radius:8px;font-weight:600;}
    .trade-status.pending{background:var(--warning-dim);color:var(--warning);}
    .trade-status.paid{background:rgba(91,141,239,0.10);color:#5B8DEF;}
    .trade-status.completed{background:var(--success-dim);color:var(--success);}
    .trade-status.cancelled{background:var(--danger-dim);color:var(--danger);}
    .trade-status.disputed{background:var(--danger-dim);color:var(--danger);}
    .trade-arrow{font-size:1rem;color:var(--text-muted);}
  </style>
</head>
<body>
  <nav class="navbar" id="nav"></nav>
  <main>
    <div class="container page-pad">
      <!-- Tabs -->
      <div class="tab-bar" id="tradeTabs">
        <button class="tab-item active" data-filter="all" onclick="filterTrades('all', this)">الكل</button>
        <button class="tab-item" data-filter="active" onclick="filterTrades('active', this)">نشطة</button>
        <button class="tab-item" data-filter="completed" onclick="filterTrades('completed', this)">مكتملة</button>
        <button class="tab-item" data-filter="disputed" onclick="filterTrades('disputed', this)">نزاع</button>
      </div>

      <!-- Trades List -->
      <div id="tradesList">
        <div class="card-section"><div class="spinner"></div></div>
      </div>

      <!-- Empty state -->
      <div id="emptyState" style="display:none;">
        <div class="empty-state">
          <div class="empty-state-icon">🤝</div>
          <div class="empty-state-text">لا توجد صفقات بعد</div>
          <a href="/market" class="btn btn-primary" style="margin-top:var(--sp-3);">تصفح السوق</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/assets/app.js"></script>
  <script>
  (async function() {
    const user = await requireAuth();
    if (!user) return;

    let allTrades = [];
    try {
      const res = await api('/trades');
      allTrades = res?.trades || [];
    } catch {}

    function getStatusText(status) {
      const map = {
        'PENDING': 'بانتظار الدفع',
        'PAYMENT_SENT': 'تم الإبلاغ عن الدفع',
        'PAYMENT_CONFIRMED': 'تم تأكيد الدفع',
        'COMPLETED': 'مكتملة',
        'CANCELLED': 'ملغاة',
        'DISPUTED': 'نزاع'
      };
      return map[status] || status;
    }

    function getStatusClass(status) {
      if (status === 'COMPLETED') return 'completed';
      if (status === 'CANCELLED') return 'cancelled';
      if (status === 'DISPUTED') return 'disputed';
      if (status === 'PAYMENT_SENT' || status === 'PAYMENT_CONFIRMED') return 'paid';
      return 'pending';
    }

    function renderTrades(filter) {
      const list = document.getElementById('tradesList');
      const empty = document.getElementById('emptyState');
      let filtered = allTrades;
      if (filter === 'active') filtered = allTrades.filter(t => ['PENDING','PAYMENT_SENT','PAYMENT_CONFIRMED'].includes(t.status));
      else if (filter === 'completed') filtered = allTrades.filter(t => t.status === 'COMPLETED');
      else if (filter === 'disputed') filtered = allTrades.filter(t => t.status === 'DISPUTED');

      if (!filtered.length) {
        list.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      list.innerHTML = filtered.map(t => {
        const buyer = t.buyer || '';
        const seller = t.seller || '';
        const counterparty = buyer === user.username ? seller : buyer;
        const direction = buyer === user.username ? 'شراء' : 'بيع';
        return `
        <a href="/trade?id=${t.id}" class="trade-card">
          <div class="trade-card-top">
            <span class="trade-id">#${t.id}</span>
            <span class="trade-status ${getStatusClass(t.status)}">${getStatusText(t.status)}</span>
          </div>
          <div class="flex-between">
            <div>
              <div class="trade-amount">${fmtNum(t.amount)} <small>USDT</small></div>
              <div class="trade-meta">
                <span>${fmtNum(t.price)} ₪/USDT</span>
                <span>إجمالي: ${fmtNum((t.amount * t.price).toFixed(2))} ₪</span>
              </div>
            </div>
            <div class="text-right">
              <div class="text-sm font-bold">${esc(counterparty)}</div>
              <div class="text-xs text-muted">${direction}</div>
            </div>
          </div>
          <div class="trade-bottom">
            <span class="text-xs text-muted">${t.created || ''}</span>
            <span class="trade-arrow">←</span>
          </div>
        </a>`;
      }).join('');
    }

    window.filterTrades = function(filter, btn) {
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderTrades(filter);
    };

    renderTrades('all');
  })();
  </script>
</body>
</html>
