<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <title>الصفقات — USDT P2P Palestine</title>
  <link rel="stylesheet" href="/assets/design-system.css">
</head>
<body>
<nav class="navbar" id="nav"><div class="navbar-inner"><a href="/" class="navbar-brand">🇵🇸 <span>USDT</span> P2P</a><div class="navbar-links"></div></div></nav>
<main><div class="container">
  <div class="page-header"><h2>📄 صفقاتي</h2></div>
  <div id="app"><div class="skeleton" style="height:80px;"></div></div>
</div></main>
<div class="bottom-nav" id="bottomNav"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/assets/app.js"></script>
<script>
async function load() {
  if (!requireAuth()) return;
  const resp = await api('/trades');
  const trades = resp?.trades || [];
  const list = document.getElementById('app');
  if (!trades.length) { list.innerHTML = '<div class="card" style="text-align:center;padding:var(--sp-8);"><div style="font-size:2rem;margin-bottom:var(--sp-2);">📄</div><div style="color:var(--text-muted);">لا توجد صفقات بعد</div><a href="/market" class="btn btn-success btn-sm" style="margin-top:var(--sp-3);">تصفح السوق</a></div>'; return; }
  list.innerHTML = trades.map(t => {
    const u = currentUser();
    const other = t.buyer === u.username ? t.seller : t.buyer;
    return `<a href="/trade?id=${t.id}" class="trade-card" style="display:block;text-decoration:none;">
      <div class="trade-card-header"><span style="font-weight:700;">الصفقة #${t.id}</span>${statusBadge(t.status)}</div>
      <div class="trade-card-body"><span>المتداول: ${esc(other)}</span><span>${fmtNum(t.amount)} USDT</span></div>
      <div class="trade-card-footer"><span>${fmtDate(t.created)}</span><span style="font-weight:700;color:var(--accent);">${fmtNum(t.price)} ₪</span></div>
    </a>`;
  }).join('');
}
load();
</script>
</body>
</html>
