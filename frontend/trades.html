<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفقات — USDT P2P Palestine</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<nav class="nav" id="nav"></nav>
<main class="main"><div class="container" style="max-width:640px">
  <h1 style="font-size:1.3rem;font-weight:700;margin-bottom:16px">الصفقات</h1>
  <div id="tradesList"><div class="card"><div class="spinner"></div></div></div>
</div></main>
<div class="bottom-nav" id="bottomNav"></div>
</div>
<script src="/assets/app.js"></script>
<script>
async function load() {
  if (!requireAuth()) return;
  const r = await api('/trades');
  const el = document.getElementById('tradesList');
  if (!r || !r.ok) { el.innerHTML = '<div class="card text-center" style="padding:32px;color:var(--text-muted)">خطأ في تحميل الصفقات</div>'; return; }
  const trades = r.trades || [];
  if (!trades.length) { el.innerHTML = '<div class="card text-center" style="padding:32px"><div style="font-size:2rem;margin-bottom:8px">🤝</div><div style="font-weight:600;margin-bottom:4px">لا توجد صفقات</div><div style="color:var(--text-muted);font-size:.85rem"><a href="/market" style="color:var(--accent)">تصفح السوق</a></div></div>'; return; }
  const u = currentUser();
  el.innerHTML = trades.map(t => {
    const isBuyer = t.buyer === u.username;
    const role = isBuyer ? 'مشتري' : 'بائع';
    const other = isBuyer ? t.seller : t.buyer;
    return `<a href="/trade.html?id=${t.id}" style="text-decoration:none;color:inherit;display:block;margin-bottom:10px">
      <div class="card" style="padding:14px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-weight:600;font-size:.9rem">#${t.id} · ${role}</div>
            <div style="font-size:.8rem;color:var(--text-muted)">${esc(other)}</div>
          </div>
          ${statusBadge(t.status)}
        </div>
        <div style="display:flex;gap:16px;margin-top:8px;font-size:.8rem;color:var(--text-secondary)">
          <span>${fmtNum(t.amount)} USDT</span><span>${fmtNum(t.price)} ₪</span><span>${fmtDate(t.created)}</span>
        </div>
      </div></a>`;
  }).join('');
}
load();
</script>
</body>
</html>
