<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <title>المحفظة — USDT P2P Palestine</title>
  <link rel="stylesheet" href="/assets/design-system.css">
</head>
<body>
<nav class="navbar" id="nav"><div class="navbar-inner"><a href="/" class="navbar-brand">🇵🇸 <span>USDT</span> P2P</a><div class="navbar-links"></div></div></nav>
<main><div class="container">
  <div class="page-header"><h2>💰 المحفظة</h2></div>
  <div id="app"><div class="skeleton" style="height:120px;"></div></div>
</div></main>
<div class="bottom-nav" id="bottomNav"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/assets/app.js"></script>
<script>
async function load() {
  if (!requireAuth()) return;
  const w = await api('/wallet');
  const hist = await api('/wallet/history');
  const txns = hist?.transactions || hist?.history || [];
  document.getElementById('app').innerHTML = `
    <div class="card" style="text-align:center;padding:var(--sp-6);background:var(--bg-card);margin-bottom:var(--sp-4);">
      <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:var(--sp-2);">الرصيد المتاح</div>
      <div style="font-size:2rem;font-weight:900;color:var(--accent);">${fmtNum(w?.balance)} USDT</div>
      ${w?.locked > 0 ? `<div style="font-size:0.8rem;color:var(--warning);margin-top:var(--sp-2);">🔒 ${fmtNum(w.locked)} USDT مقفلة</div>` : ''}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-bottom:var(--sp-4);">
      <button class="btn btn-success" onclick="showDeposit()">📥 إيداع</button>
      <button class="btn btn-ghost" onclick="showWithdraw()">📤 سحب</button>
    </div>
    <div class="section-title">📊 سجل المعاملات</div>
    ${txns.length ? txns.map(t => `<div class="card" style="padding:var(--sp-3);display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-2);">
      <div><div style="font-weight:600;font-size:0.85rem;">${esc(t.action || t.type || 'معاملة')}</div><div style="font-size:0.7rem;color:var(--text-muted);">${fmtDate(t.created || t.date)}</div></div>
      <div style="text-align:left;"><div style="font-weight:700;color:${(t.amount||0)>=0?'var(--accent)':'var(--danger)'};">${(t.amount||0)>=0?'+':''} ${fmtNum(t.amount)} USDT</div></div>
    </div>`).join('') : '<div class="card" style="text-align:center;padding:var(--sp-6);color:var(--text-muted);">لا توجد معاملات بعد</div>'}`;
}
function showDeposit() { document.getElementById('app').innerHTML = `<div class="card" style="padding:var(--sp-4);"><h3 style="margin-bottom:var(--sp-3);">📥 إيداع USDT</h3><div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:var(--sp-3);">الشبكة: BSC (BEP-20)</div><div style="background:var(--bg-input);padding:var(--sp-3);border-radius:var(--radius-sm);text-align:center;margin-bottom:var(--sp-3);word-break:break-all;font-size:0.85rem;font-weight:700;color:var(--accent);">0x659dd7cba24363c903abe3fddfc89eb30ffbf58a</div><button class="btn btn-ghost btn-block btn-sm" onclick="navigator.clipboard?.writeText('0x659dd7cba24363c903abe3fddfc89eb30ffbf58a');showToast('تم النسخ')">📋 نسخ</button><div class="form-group" style="margin-top:var(--sp-4);"><label class="form-label">رقم المعاملة</label><input class="form-input" id="txHash" placeholder="0x..."></div><button class="btn btn-success btn-block" onclick="submitDeposit()">إرسال</button><button class="btn btn-ghost btn-block" style="margin-top:var(--sp-2);" onclick="load()">رجوع</button></div>`; }
async function submitDeposit() { const tx = document.getElementById('txHash').value.trim(); if (!tx) { showToast('أدخل رقم المعاملة'); return; } const r = await api('/wallet/deposit', { method: 'POST', body: { tx_hash: tx } }); if (r?.ok) { showToast('✅ تم إرسال طلب الإيداع'); load(); } else { showToast(r?.error || 'خطأ', 4000); } }
function showWithdraw() { document.getElementById('app').innerHTML = `<div class="card" style="padding:var(--sp-4);"><h3 style="margin-bottom:var(--sp-3);">📤 سحب USDT</h3><div class="form-group"><label class="form-label">عنوان المحفظة (BSC)</label><input class="form-input" id="withdrawAddr" placeholder="0x..."></div><div class="form-group"><label class="form-label">المبلغ (USDT)</label><input class="form-input" type="number" id="withdrawAmount" placeholder="0.00" step="0.01" min="0"></div><button class="btn btn-success btn-block" onclick="submitWithdraw()">إرسال طلب السحب</button><button class="btn btn-ghost btn-block" style="margin-top:var(--sp-2);" onclick="load()">رجوع</button></div>`; }
async function submitWithdraw() { const addr = document.getElementById('withdrawAddr').value.trim(); const amount = parseFloat(document.getElementById('withdrawAmount').value); if (!addr || !amount || amount <= 0) { showToast('أدخل البيانات بشكل صحيح'); return; } const r = await api('/wallet/withdraw', { method: 'POST', body: { wallet: addr, amount } }); if (r?.ok) { showToast('✅ تم إرسال طلب السحب'); load(); } else { showToast(r?.error || 'خطأ', 4000); } }
load();
</script>
</body>
</html>
