<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المحفظة — USDT P2P Palestine</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<nav class="nav" id="nav"></nav>
<main class="main"><div class="container" style="max-width:640px" id="app">
  <div class="card" style="text-align:center;padding:32px;margin-bottom:16px;background:var(--accent);color:#fff">
    <div style="font-size:.85rem;opacity:.8">الرصيد المتاح</div>
    <div style="font-size:2.5rem;font-weight:800;margin:8px 0" id="bal">—</div>
    <div style="font-size:.85rem;opacity:.7">USDT</div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
    <button class="btn btn-accent btn-block" onclick="showTab('deposit')">💰 إيداع</button>
    <button class="btn btn-outline btn-block" onclick="showTab('withdraw')">📤 سحب</button>
  </div>
  <div class="card" style="padding:16px">
    <div style="display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:16px">
      <button class="tab active" data-tab="deposit" onclick="showTab('deposit')" style="flex:1;padding:10px;border:none;background:none;cursor:pointer;font-weight:600;font-size:.9rem;border-bottom:2px solid var(--accent);margin-bottom:-2px">إيداع</button>
      <button class="tab" data-tab="withdraw" onclick="showTab('withdraw')" style="flex:1;padding:10px;border:none;background:none;cursor:pointer;font-weight:500;font-size:.9rem;color:var(--text-muted)">سحب</button>
      <button class="tab" data-tab="history" onclick="showTab('history')" style="flex:1;padding:10px;border:none;background:none;cursor:pointer;font-weight:500;font-size:.9rem;color:var(--text-muted)">السجل</button>
    </div>
    <div id="tabDeposit">
      <p style="font-size:.85rem;color:var(--text-muted);margin-bottom:12px">أرسل USDT إلى العنوان التالي عبر <strong>BSC (BEP-20)</strong></p>
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <input type="text" class="form-input" id="depAddr" readonly style="font-size:.8rem;direction:ltr;text-align:left">
        <button class="btn btn-outline btn-sm" onclick="copyText(document.getElementById('depAddr').value)">نسخ</button>
      </div>
      <div class="divider"></div>
      <h4 style="margin-bottom:12px;font-size:.9rem">تأكيد الإيداع</h4>
      <div class="form-group"><label>Transaction Hash</label><input type="text" class="form-input" id="txHash" placeholder="0x..."></div>
      <div class="form-group"><label>المبلغ (USDT)</label><input type="number" class="form-input" id="depAmount" step="0.01" min="1"></div>
      <button class="btn btn-accent btn-block" onclick="submitDeposit()">تأكيد الإيداع</button>
    </div>
    <div id="tabWithdraw" style="display:none">
      <div class="form-group"><label>عنوان المحفظة (BEP-20)</label><input type="text" class="form-input" id="wdAddr" placeholder="0x..." style="direction:ltr;text-align:left"></div>
      <div class="form-group"><label>المبلغ (USDT)</label><input type="number" class="form-input" id="wdAmount" step="0.01" min="1"></div>
      <button class="btn btn-accent btn-block" onclick="submitWithdraw()">طلب سحب</button>
    </div>
    <div id="tabHistory" style="display:none">
      <div id="historyList"><div class="spinner"></div></div>
    </div>
  </div>
</div></main>
<div class="bottom-nav" id="bottomNav"></div>
</div>
<script src="/assets/app.js"></script>
<script>
let walletData = null;
async function load() {
  if (!requireAuth()) return;
  const r = await api('/wallet');
  if (!r || !r.ok) { toast('خطأ في تحميل المحفظة'); return; }
  walletData = r;
  document.getElementById('bal').textContent = fmtNum(r.balance);
  document.getElementById('depAddr').value = r.deposit_address || '';
  loadHistory();
}
async function loadHistory() {
  const r = await api('/wallet/history');
  const el = document.getElementById('historyList');
  if (!r || !r.ok || !r.history?.length) { el.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:16px">لا توجد معاملات</div>'; return; }
  el.innerHTML = r.history.map(h => `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:.85rem">
    <div><strong>${esc(h.action)}</strong><br><span style="color:var(--text-muted);font-size:.75rem">${fmtDate(h.created)}</span></div>
    <div style="text-align:left"><strong style="color:${h.amount>0?'var(--accent)':'var(--error)'}">${h.amount>0?'+':''}${fmtNum(h.amount)}</strong><br><span style="color:var(--text-muted);font-size:.75rem">الم公认: ${fmtNum(h.balance_after)}</span></div>
  </div>`).join('');
}
function showTab(name) {
  ['deposit','withdraw','history'].forEach(t => {
    const el = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
    if (el) el.style.display = t === name ? '' : 'none';
  });
  document.querySelectorAll('.tab').forEach(b => b.style.borderBottomColor = b.dataset.tab === name ? 'var(--accent)' : 'transparent');
}
async function submitDeposit() {
  const hash = document.getElementById('txHash').value.trim();
  const amt = parseFloat(document.getElementById('depAmount').value);
  if (!hash || !amt) { toast('أدخل جميع البيانات'); return; }
  const r = await api('/wallet/deposit', { method: 'POST', body: { tx_hash: hash, amount: amt } });
  if (r && r.ok) { toast('✅ تم تأكيد الإيداع: ' + fmtNum(r.credited) + ' USDT'); load(); }
  else if (r && r.error) toast(r.error);
}
async function submitWithdraw() {
  const addr = document.getElementById('wdAddr').value.trim();
  const amt = parseFloat(document.getElementById('wdAmount').value);
  if (!addr || !amt) { toast('أدخل جميع البيانات'); return; }
  const r = await api('/wallet/withdraw', { method: 'POST', body: { wallet: addr, amount: amt } });
  if (r && r.ok) { toast('✅ تم إرسال طلب السحب'); load(); }
  else if (r && r.error) toast(r.error);
}
load();
</script>
</body>
</html>
