<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07090D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>المحفظة — USDT P2P Palestine</title>
  <link rel="stylesheet" href="/assets/design-system.css">
  <link rel="manifest" href="/manifest.json">
  <script>(function(){var t=localStorage.getItem("usp_theme")||"dark";if(t==="auto")t=window.matchMedia("(prefers-color-scheme:light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t);})();</script>
  <style>
    .wallet-balance{background:linear-gradient(135deg,var(--bg-surface),rgba(0,214,160,0.06));border:1px solid var(--border);border-radius:var(--radius-lg);padding:var(--sp-5) var(--sp-4);text-align:center;position:relative;overflow:hidden;margin-bottom:var(--sp-3);}
    .wallet-balance::before{content:'';position:absolute;top:-60px;right:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(0,214,160,0.06),transparent 70%);pointer-events:none;}
    .wallet-balance-label{font-size:0.75rem;color:var(--text-muted);margin-bottom:var(--sp-1);}
    .wallet-balance-value{font-size:2rem;font-weight:900;color:var(--primary);margin-bottom:var(--sp-3);}
    .wallet-balance-value span{font-size:0.85rem;font-weight:600;color:var(--text-muted);}
    .wallet-split{display:flex;gap:var(--sp-4);justify-content:center;}
    .wallet-split-item{text-align:center;}
    .wallet-split-label{font-size:0.65rem;color:var(--text-muted);margin-bottom:2px;}
    .wallet-split-value{font-size:1rem;font-weight:700;}
    .wallet-split-value.available{color:var(--primary);}
    .wallet-split-value.locked{color:var(--warning);}
    .wallet-actions{display:flex;gap:var(--sp-2);margin-bottom:var(--sp-4);}
    .wallet-action-btn{flex:1;padding:12px;border-radius:var(--radius);font-size:0.85rem;font-weight:700;text-align:center;text-decoration:none;border:none;cursor:pointer;transition:all 0.15s;}
    .wallet-action-deposit{background:var(--primary);color:#07090D;}
    .wallet-action-deposit:hover{background:var(--primary-hover);}
    .wallet-action-withdraw{background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border);}
    .wallet-action-withdraw:hover{background:var(--bg-card-hover);}
    .tx-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:var(--sp-3);margin-bottom:var(--sp-2);display:flex;align-items:center;gap:var(--sp-3);}
    .tx-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
    .tx-icon.deposit{background:rgba(0,214,160,0.10);color:var(--primary);}
    .tx-icon.withdraw{background:rgba(255,92,108,0.10);color:var(--danger);}
    .tx-icon.trade{background:rgba(108,99,255,0.10);color:var(--purple);}
    .tx-info{flex:1;min-width:0;}
    .tx-title{font-size:0.85rem;font-weight:600;color:var(--text-primary);}
    .tx-date{font-size:0.7rem;color:var(--text-muted);margin-top:2px;}
    .tx-amount{font-size:0.9rem;font-weight:700;white-space:nowrap;}
    .tx-amount.positive{color:var(--primary);}
    .tx-amount.negative{color:var(--danger);}
    .tx-status{font-size:0.65rem;padding:2px 8px;border-radius:6px;font-weight:600;}
    .tx-status.completed{background:var(--success-dim);color:var(--success);}
    .tx-status.pending{background:var(--warning-dim);color:var(--warning);}
    @media(max-width:380px){.wallet-balance-value{font-size:1.6rem;}.wallet-split{gap:var(--sp-3);}}
  </style>
</head>
<body>
  <nav class="navbar" id="nav"></nav>
  <main>
    <div class="container page-pad">
      <div id="loading" class="text-center py-3">
        <div class="spinner"></div>
        <p class="text-muted mt-2">جاري تحميل المحفظة...</p>
      </div>
      <div id="wallet-content" style="display:none"></div>
    </div>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/assets/app.js"></script>
  <script>
  (async function() {
    const user = await requireAuth();
    if (!user) return;

    let wallet = {};
    try { wallet = await api('/wallet') || {}; } catch {}

    const balance = wallet.balance || 0;
    const locked = wallet.locked || 0;
    const total = wallet.total || (balance + locked);

    let history = [];
    try { const hRes = await api('/wallet/history'); history = hRes.history || []; } catch {}

    document.getElementById('wallet-content').innerHTML = `
      <!-- Balance Card -->
      <div class="wallet-balance">
        <div class="wallet-balance-label">إجمالي الرصيد</div>
        <div class="wallet-balance-value">${fmtNum(total)} <span>USDT</span></div>
        <div class="wallet-split">
          <div class="wallet-split-item">
            <div class="wallet-split-label">المتاح</div>
            <div class="wallet-split-value available">${fmtNum(balance)}</div>
          </div>
          <div class="wallet-split-item">
            <div class="wallet-split-label">المقفل</div>
            <div class="wallet-split-value locked">${fmtNum(locked)}</div>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="wallet-actions">
        <a href="/wallet?action=deposit" class="wallet-action-btn wallet-action-deposit">💵 إيداع</a>
        <a href="/wallet?action=withdraw" class="wallet-action-btn wallet-action-withdraw">💸 سحب</a>
      </div>

      <!-- Quick Stats -->
      <div class="grid grid-2 gap-2 mb-4">
        <div class="stat-card">
          <div class="stat-label">العملة</div>
          <div class="stat-value">USDT</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">الشبكة</div>
          <div class="stat-value">BEP-20</div>
        </div>
      </div>

      <!-- Transaction History -->
      <div class="card-section">
        <div class="card-section-header">
          <div class="card-section-title">سجل المعاملات</div>
        </div>
        <div id="txList">
          ${history.length ? history.slice(0, 20).map(tx => {
            const action = tx.action || 'UNKNOWN';
            const isDeposit = action.includes('DEPOSIT') || action.includes('CREDIT');
            const isWithdraw = action.includes('WITHDRAW') || action.includes('DEBIT');
            const isTrade = action.includes('TRADE') || action.includes('ESCROW');
            const isPositive = isDeposit || action.includes('RELEASE') || action.includes('REFUND');
            const iconClass = isDeposit ? 'deposit' : isWithdraw ? 'withdraw' : 'trade';
            const icon = isDeposit ? '↓' : isWithdraw ? '↑' : '⇄';
            const amountClass = isPositive ? 'positive' : 'negative';
            const amountPrefix = isPositive ? '+' : '-';
            return `
            <div class="tx-card">
              <div class="tx-icon ${iconClass}">${icon}</div>
              <div class="tx-info">
                <div class="tx-title">${esc(action.replace(/_/g, ' '))}</div>
                <div class="tx-date">${tx.created || ''}</div>
              </div>
              <div>
                <div class="tx-amount ${amountClass}">${amountPrefix}${fmtNum(tx.amount)} USDT</div>
              </div>
            </div>`;
          }).join('') : '<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">لا توجد معاملات بعد</div></div>'}
        </div>
      </div>

      <!-- Deposit Info -->
      <div class="card-section" id="depositInfo" style="display:none;">
        <div class="card-section-header">
          <div class="card-section-title">معلومات الإيداع</div>
        </div>
        <div class="mb-3">
          <div class="text-sm text-muted mb-1">عنوان المحفظة</div>
          <div class="text-sm font-bold" style="word-break:break-all;" id="depositAddr"></div>
        </div>
        <div class="mb-3">
          <div class="text-sm text-muted mb-1">الشبكة</div>
          <div class="text-sm font-bold">BNB Smart Chain (BEP-20)</div>
        </div>
        <div class="text-xs text-danger">⚠️ أرسل USDT فقط على شبكة BEP-20. إرسال أي عملة أخرى سينتج عن فقدان أموالك.</div>
      </div>
    `;

    // Handle deposit/withdraw actions
    const params = new URLSearchParams(window.location.search);
    const action = params.get('action');
    if (action === 'deposit') {
      document.getElementById('depositInfo').style.display = 'block';
      try {
        const info = await api('/wallet/deposit-info');
        if (info?.address) document.getElementById('depositAddr').textContent = info.address;
      } catch {}
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('wallet-content').style.display = 'block';
  })();
  </script>
</body>
</html>
