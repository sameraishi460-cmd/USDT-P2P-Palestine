<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المحفظة — USDT P2P Palestine</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<nav class="nav" id="nav"></nav>
<main class="main">
<div class="container" id="app">
<div class="loading-skeleton">
<div class="sk sk-card"></div>
<div class="sk sk-card"></div>
</div>
</div>
</main>
<div class="bottom-nav" id="bottomNav"></div>
</div>
<script src="/assets/app.js"></script>
<script>
(function(){
  const app=document.getElementById('app');
  async function load(){
    if(!Auth.isLoggedIn()){location.href='/login';return;}
    const user=Auth.user();
    let wallet=null,deposits=[],withdrawals=[];
    try{wallet=await API.get('/api/wallet');}catch(e){}
    try{deposits=(await API.get('/api/wallet/deposits')).deposits||[];}catch(e){}
    try{withdrawals=(await API.get('/api/wallet/withdrawals')).withdrawals||[];}catch(e){}

    const bal=wallet?.balance||0;
    const pending=wallet?.pending_balance||0;
    const addr=wallet?.deposit_address||'—';

    app.innerHTML=`
      <div class="page-header">
        <h1 class="page-title">المحفظة</h1>
        <div class="page-subtitle">إدارة أموالك الرقمية</div>
      </div>

      <div class="card" style="background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;margin-bottom:var(--space-lg)">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-size:.875rem;opacity:.8;margin-bottom:4px">الرصيد المتاح</div>
            <div class="stat-value" style="font-size:2rem;color:#fff">${fmtNum(bal)} <span style="font-size:1rem">USDT</span></div>
            ${pending>0?`<div style="font-size:.75rem;opacity:.7;margin-top:4px">معلق: ${fmtNum(pending)} USDT</div>`:''}
          </div>
          <div style="font-size:3rem;opacity:.3">💰</div>
        </div>
        <div style="margin-top:var(--space-md);display:flex;gap:var(--space-sm);flex-wrap:wrap">
          <button class="btn btn-white" onclick="showTab('deposit')">إيداع</button>
          <button class="btn btn-white-outline" onclick="showTab('withdraw')">سحب</button>
        </div>
      </div>

      <div class="tabs" id="walletTabs">
        <button class="tab active" data-tab="deposit" onclick="showTab('deposit')">إيداع</button>
        <button class="tab" data-tab="withdraw" onclick="showTab('withdraw')">سحب</button>
        <button class="tab" data-tab="history" onclick="showTab('history')">السجل</button>
      </div>

      <div id="tabDeposit" class="tab-content active">
        <div class="card">
          <h3 style="margin-bottom:var(--space-sm)">إيداع USDT</h3>
          <p class="text-muted" style="margin-bottom:var(--space-md)">أرسل USDT إلى العنوان التالي عبر شبكة BSC (BEP-20)</p>
          <div class="form-group">
            <label>عنوان الإيداع</label>
            <div style="display:flex;gap:var(--space-sm)">
              <input type="text" class="form-input" value="${addr}" readonly id="depositAddr">
              <button class="btn btn-primary" onclick="navigator.clipboard.writeText('${addr}');toast.show('تم النسخ','success')">نسخ</button>
            </div>
          </div>
          <div class="alert alert-info" style="margin-top:var(--space-md)">
            <strong>مهم:</strong> أرسل فقط USDT عبر شبكة BSC (BEP-20). الإيداع عبر أي شبكة أخرى قد يؤدي لفقدان الأموال.
          </div>
          <div class="divider"></div>
          <h4 style="margin-bottom:var(--space-sm)">تأكيد الإيداع</h4>
          <div class="form-group">
            <label>رابط المعاملة (TX Hash)</label>
            <input type="text" class="form-input" placeholder="0x..." id="txHash">
          </div>
          <div class="form-group">
            <label>المبلغ (USDT)</label>
            <input type="number" class="form-input" placeholder="0.00" id="depositAmount" step="0.01" min="1">
          </div>
          <button class="btn btn-primary btn-block" onclick="submitDeposit()">تأكيد الإيداع</button>
        </div>
      </div>

      <div id="tabWithdraw" class="tab-content">
        <div class="card">
          <h3 style="margin-bottom:var(--space-sm)">سحب USDT</h3>
          <p class="text-muted" style="margin-bottom:var(--space-md)">الرصيد المتاح: <strong>${fmtNum(bal)} USDT</strong></p>
          <div class="form-group">
            <label>عنوان المحفظة (BSC BEP-20)</label>
            <input type="text" class="form-input" placeholder="0x..." id="withdrawAddr">
          </div>
          <div class="form-group">
            <label>المبلغ (USDT)</label>
            <input type="number" class="form-input" placeholder="0.00" id="withdrawAmount" step="0.01" min="1" max="${bal}">
          </div>
          <div class="form-group">
            <label>شبكة السحب</label>
            <div class="badge badge-success">BSC (BEP-20)</div>
          </div>
          <button class="btn btn-primary btn-block" onclick="submitWithdraw()">طلب سحب</button>
        </div>
      </div>

      <div id="tabHistory" class="tab-content">
        <div class="card">
          <h3 style="margin-bottom:var(--space-md)">سجل المعاملات</h3>
          ${deposits.length===0&&withdrawals.length===0?`
            <div class="empty-state">
              <div class="empty-icon">📋</div>
              <div class="empty-title">لا توجد معاملات</div>
              <div class="empty-desc">ستظهر هنا جميع إيداعاتك وسحوباتك</div>
            </div>
          `:`
            <div class="table-responsive">
              <table class="table">
                <thead><tr><th>التاريخ</th><th>النوع</th><th>المبلغ</th><th>الحالة</th></tr></thead>
                <tbody>
                  ${deposits.map(d=>`<tr>
                    <td>${fmtDate(d.created_at)}</td>
                    <td><span class="badge badge-success">إيداع</span></td>
                    <td>+${fmtNum(d.amount)} USDT</td>
                    <td>${statusBadge(d.status)}</td>
                  </tr>`).join('')}
                  ${withdrawals.map(w=>`<tr>
                    <td>${fmtDate(w.created_at)}</td>
                    <td><span class="badge badge-warning">سحب</span></td>
                    <td>-${fmtNum(w.amount)} USDT</td>
                    <td>${statusBadge(w.status)}</td>
                  </tr>`).join('')}
                </tbody>
              </table>
            </div>
          `}
        </div>
      </div>
    `;
  }

  window.showTab=function(name){
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    const el=document.getElementById('tab'+name.charAt(0).toUpperCase()+name.slice(1));
    if(el)el.classList.add('active');
  };

  window.submitDeposit=async function(){
    const hash=document.getElementById('txHash').value.trim();
    const amount=parseFloat(document.getElementById('depositAmount').value);
    if(!hash){toast.show('أدخل رابط المعاملة','error');return;}
    if(!amount||amount<1){toast.show('أدخل مبلغ صحيح','error');return;}
    try{
      const r=await API.post('/api/wallet/deposit',{tx_hash:hash,amount});
      toast.show('تم إيداع المبلغ بنجاح','success');
      load();
    }catch(e){toast.show(e.message||'خطأ في الإيداع','error');}
  };

  window.submitWithdraw=async function(){
    const addr=document.getElementById('withdrawAddr').value.trim();
    const amount=parseFloat(document.getElementById('withdrawAmount').value);
    if(!addr){toast.show('أدخل عنوان المحفظة','error');return;}
    if(!amount||amount<1){toast.show('أدخل مبلغ صحيح','error');return;}
    try{
      const r=await API.post('/api/wallet/withdraw',{address:addr,amount});
      toast.show('تم إرسال طلب السحب','success');
      load();
    }catch(e){toast.show(e.message||'خطأ في السحب','error');}
  };

  load();
})();
</script>
</body>
</html>
