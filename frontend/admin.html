<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e18">
<title>لوحة التحكم — USDT P2P Palestine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="navbar">
  <span class="logo text-gold">⚙️ لوحة التحكم</span>
  <div class="actions"><a href="/" style="font-size:20px;">🏠</a></div>
</div>
<div class="container">

  <!-- System Status -->
  <div class="card" id="statusCard" style="display:none;">
    <div class="card-title">🖥️ حالة النظام</div>
    <div class="grid-3" id="statusGrid"></div>
  </div>

  <!-- KPIs -->
  <div class="grid-2" style="margin-bottom:12px;">
    <div class="card kpi"><div class="kpi-label">المستخدمون</div><div class="kpi-value" id="kUsers">—</div></div>
    <div class="card kpi"><div class="kpi-label">صفقات نشطة</div><div class="kpi-value text-info" id="kActive">—</div></div>
  </div>
  <div class="grid-3">
    <div class="card kpi"><div class="kpi-label">حجم التداول</div><div class="kpi-value text-primary" id="kVolume" style="font-size:16px;">—</div></div>
    <div class="card kpi"><div class="kpi-label">عمولات</div><div class="kpi-value text-gold" id="kFees" style="font-size:16px;">—</div></div>
    <div class="card kpi"><div class="kpi-label">نزاعات</div><div class="kpi-value text-danger" id="kDisputes" style="font-size:16px;">—</div></div>
  </div>

  <!-- Pending Alerts -->
  <div class="grid-2" style="margin-bottom:14px;">
    <div class="card" style="border-color:var(--warning);"><div class="kpi"><div class="kpi-label">📥 إيداعات بانتظار</div><div class="kpi-value text-warning" id="kDep">0</div></div></div>
    <div class="card" style="border-color:var(--warning);"><div class="kpi"><div class="kpi-label">📤 سحوبات بانتظار</div><div class="kpi-value text-warning" id="kWd">0</div></div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="showSection('users')" data-s="users">👥 المستخدمون</button>
    <button class="tab-btn" onclick="showSection('withdrawals')" data-s="withdrawals">📤 السحوبات</button>
    <button class="tab-btn" onclick="showSection('deposits')" data-s="deposits">📥 الإيداعات</button>
    <button class="tab-btn" onclick="showSection('price')" data-s="price">💲 الأسعار</button>
    <button class="tab-btn" onclick="showSection('search')" data-s="search">🔍 بحث</button>
  </div>

  <div id="sec-users"></div>
  <div id="sec-withdrawals" style="display:none;"></div>
  <div id="sec-deposits" style="display:none;"></div>
  <div id="sec-search" style="display:none;" class="card">
    <form id="searchForm" class="flex-row gap-8">
      <input id="searchQ" type="text" placeholder="اسم / tx hash / محفظة" style="flex:1;">
      <button type="submit" class="btn btn-primary btn-sm">🔍</button>
    </form>
    <div id="searchResults" style="margin-top:10px;"></div>
  </div>
  <div id="sec-price" style="display:none;" class="card">
    <div class="card-title">💲 تحديث السعر</div>
    <div class="muted text-sm">السعر يتحدث تلقائياً عبر Cron. للتحديث اليدوي:</div>
    <form id="priceForm">
      <div class="grid-2">
        <div class="form-group"><label>USD/ILS</label><input id="pUsd" type="number" step="0.01"></div>
        <div class="form-group"><label>USDT/ILS</label><input id="pUsdt" type="number" step="0.01"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-sm">💾 تحديث</button>
    </form>
  </div>
</div>
<div id="toast"></div>
<script src="assets/app.js"></script>
<script>
if (!requireAuth('/admin.html')) throw new Error('auth');
if (!getUser()?.isAdmin) { document.body.innerHTML = '<div class="container" style="text-align:center;padding:60px;"><div class="empty"><div class="icon">🔒</div>غير مصرح لك بالوصول</div></div>'; throw new Error('auth'); }

function showSection(s) {
  ['users','withdrawals','deposits','price','search'].forEach(sec => {
    document.getElementById('sec-' + sec).style.display = sec === s ? 'block' : 'none';
  });
  $$('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.s === s));
}

(async function() {
  // System status
  const health = await get('/health');
  if (health?.checks) {
    $('#statusCard').style.display = 'block';
    const items = [
      { name: 'ال网站', status: health.ok ? 'green' : 'red', label: health.ok ? 'ONLINE' : 'ERROR' },
      { name: 'قاعدة البيانات', status: health.checks.database === 'up' ? 'green' : 'red', label: health.checks.database },
      { name: 'Telegram', status: health.checks.telegram === 'configured' ? 'green' : 'yellow', label: health.checks.telegram },
      { name: 'BSC RPC', status: health.checks.bsc_rpc === 'up' ? 'green' : 'yellow', label: health.checks.bsc_rpc },
      { name: 'الإعدادات', status: health.checks.config === 'loaded' ? 'green' : 'yellow', label: health.checks.config },
    ];
    $('#statusGrid').innerHTML = items.map(i => `
      <div class="kpi" style="padding:8px;">
        <span class="status-dot ${i.status}"></span>
        <div class="text-xs text-dim" style="margin-top:4px;">${i.name}</div>
        <div class="text-xs font-bold">${i.label}</div>
      </div>
    `).join('');
  }

  // KPIs
  const d = await get('/admin/');
  if (d?.ok) {
    const k = d.kpis;
    $('#kUsers').textContent = k.total_users;
    $('#kActive').textContent = k.active_trades;
    $('#kVolume').textContent = formatNum(k.total_volume) + ' USDT';
    $('#kFees').textContent = formatNum(k.platform_fees) + ' USDT';
    $('#kDisputes').textContent = k.open_disputes;
    $('#kDep').textContent = k.pending_deposits;
    $('#kWd').textContent = k.pending_withdrawals;
  }

  // Users
  const users = await get('/admin/users');
  if (users?.ok && users.users?.length) {
    $('#sec-users').innerHTML = '<div class="card"><div class="card-title">👥 المستخدمون</div>' +
      users.users.slice(0, 30).map(u => `
        <div class="list-item" style="cursor:default;">
          ${profileAvatar(u.username)}
          <div class="list-main">
            <div class="list-title">${escHtml(u.username)} ${u.status === 'ADMIN' ? '<span class="badge badge-admin">ADMIN</span>' : ''} ${u.verified ? verifiedBadge(true) : ''} ${statusBadge(u.status)}</div>
            <div class="list-sub">${u.phone || ''} · رصيد: ${formatNum(u.balance)} USDT · ${u.trades_count || 0} صفقة</div>
          </div>
          <div style="display:flex;gap:4px;flex-direction:column;">
            ${u.status !== 'BANNED' ? `<button onclick="banUser('${escHtml(u.username)}')" class="btn btn-danger btn-xs">🚫</button>` : `<button onclick="unbanUser('${escHtml(u.username)}')" class="btn btn-ghost btn-xs">✅</button>`}
            ${!u.verified ? `<button onclick="verifyUser('${escHtml(u.username)}')" class="btn btn-ghost btn-xs" style="border-color:var(--gold);color:var(--gold);">✓</button>` : ''}
          </div>
        </div>
      `).join('') + '</div>';
  }

  // Withdrawals pending
  const wds = await get('/admin/withdrawals');
  if (wds?.ok && wds.withdrawals?.length) {
    const pending = wds.withdrawals.filter(w => w.status === 'PENDING');
    if (pending.length) {
      $('#sec-withdrawals').innerHTML = '<div class="card"><div class="card-title">📤 سحوبات بانتظار (' + pending.length + ')</div>' +
        pending.map(w => `
          <div class="list-item" style="cursor:default;">
            <div class="list-main">
              <div class="list-title">${escHtml(w.username)} — <span class="text-warning">${formatNum(w.amount)} USDT</span></div>
              <div class="list-sub" style="direction:ltr;text-align:left;font-family:monospace;">${escHtml(w.address)}</div>
              <div class="text-xs text-dim">${formatDate(w.created)}</div>
            </div>
            <div style="display:flex;gap:6px;">
              <button onclick="approveWd(${w.id})" class="btn btn-primary btn-xs">✅ اعتماد</button>
              <button onclick="rejectWd(${w.id})" class="btn btn-danger btn-xs">❌ رفض</button>
            </div>
          </div>
        `).join('') + '</div>';
    }
  }

  // Deposits
  const deps = await get('/admin/deposits');
  if (deps?.ok && deps.deposits?.length) {
    const pending = deps.deposits.filter(d => d.status === 'PENDING');
    if (pending.length) {
      $('#sec-deposits').innerHTML = '<div class="card"><div class="card-title">📥 إيداعات بانتظار (' + pending.length + ')</div>' +
        pending.map(d => `
          <div class="list-item" style="cursor:default;">
            <div class="list-main">
              <div class="list-title">${escHtml(d.username)} — <span class="text-primary">${formatNum(d.amount)} USDT</span></div>
              <div class="list-sub" style="direction:ltr;text-align:left;font-family:monospace;">TX: ${escHtml((d.tx_hash||'').slice(0,18))}…</div>
            </div>
            <div style="display:flex;gap:6px;">
              <button onclick="confirmDep(${d.id})" class="btn btn-primary btn-xs">✅ تأكيد</button>
              <button onclick="rejectDep(${d.id})" class="btn btn-danger btn-xs">❌ رفض</button>
            </div>
          </div>
        `).join('') + '</div>';
    }
  }

  // Price form
  const price = await get('/market/price');
  if (price?.ok && price.price) { $('#pUsd').value = price.price.usd_ils; $('#pUsdt').value = price.price.usdt_ils; }
})();

async function banUser(u) { if (!confirm('حظر ' + u + '?')) return; await post('/admin/users/' + u + '/ban'); location.reload(); }
async function unbanUser(u) { await post('/admin/users/' + u + '/unban'); location.reload(); }
async function verifyUser(u) { await post('/admin/users/' + u + '/verify'); location.reload(); }
async function approveWd(id) { if (!confirm('اعتماد السحب؟')) return; const r = await post('/admin/withdrawals/' + id + '/approve', {}); if (r?.ok) { toast('✅'); location.reload(); } }
async function rejectWd(id) { if (!confirm('رفض السحب؟')) return; const r = await post('/admin/withdrawals/' + id + '/reject', {}); if (r?.ok) { toast('❌'); location.reload(); } }
async function confirmDep(id) { if (!confirm('تأكيد الإيداع؟')) return; const r = await post('/admin/deposits/' + id + '/confirm', {}); if (r?.ok) { toast('✅'); location.reload(); } }
async function rejectDep(id) { if (!confirm('رفض الإيداع؟')) return; const r = await post('/admin/deposits/' + id + '/reject', {}); if (r?.ok) { toast('❌'); location.reload(); } }

$('#searchForm').onsubmit = async (e) => {
  e.preventDefault();
  const r = await post('/admin/search', { q: $('#searchQ').value.trim() });
  if (r?.ok) { $('#searchResults').innerHTML = '<pre class="text-sm" style="overflow-x:auto;direction:ltr;text-align:left;">' + JSON.stringify(r.results, null, 2) + '</pre>'; }
};
$('#priceForm').onsubmit = async (e) => {
  e.preventDefault();
  const r = await post('/admin/price', { usd_ils: Number($('#pUsd').value), usdt_ils: Number($('#pUsdt').value) });
  if (r?.ok) toast('✅ تم تحديث السعر');
};
</script>
</body>
</html>
