<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>لوحة الإدارة — USDT P2P Palestine</title>
  <link rel="stylesheet" href="/assets/design-system.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<!-- ===== Navbar ===== -->
<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-brand">🇵🇸 <span>USDT</span> P2P</a>
    <div class="navbar-links">
      <span style="color:var(--accent);font-weight:700;font-size:0.85rem;">⚙️ الإدارة</span>
    </div>
  </div>
</nav>

<main>
<div class="container" style="padding-top:var(--sp-4);padding-bottom:var(--sp-8);">

  <div id="loading" style="text-align:center;padding:var(--sp-8);">
    <div class="spinner" style="margin:0 auto var(--sp-3);"></div>
    <p style="color:var(--text-muted);">جاري تحميل لوحة الإدارة...</p>
  </div>

  <div id="admin-content" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--sp-4);">
      <h1 style="font-size:1.3rem;font-weight:800;">⚙️ لوحة الإدارة</h1>
      <a href="/" class="btn btn-ghost btn-sm">🏠 الرئيسية</a>
    </div>

    <!-- KPI Grid -->
    <div id="kpi-grid" class="kpi-grid"></div>

    <!-- Admin Tabs -->
    <div class="admin-tabs" id="admin-tabs">
      <button class="tab-btn active" onclick="showTab('overview',this)">📊 نظرة عامة</button>
      <button class="tab-btn" onclick="showTab('users',this)">👥 المستخدمون</button>
      <button class="tab-btn" onclick="showTab('trades',this)">📋 الصفقات</button>
      <button class="tab-btn" onclick="showTab('deposits',this)">💵 الإيداعات</button>
      <button class="tab-btn" onclick="showTab('withdrawals',this)">🏦 السحوبات</button>
      <button class="tab-btn" onclick="showTab('disputes',this)">⚠️ النزاعات</button>
      <button class="tab-btn" onclick="showTab('audit',this)">📝 سجل النشاط</button>
    </div>

    <!-- Overview Tab -->
    <div id="tab-overview" class="admin-tab">
      <div class="card" style="margin-bottom:var(--sp-3);">
        <div style="padding:var(--sp-3);font-weight:700;font-size:0.9rem;border-bottom:1px solid var(--border);">📈 إحصائيات التداول</div>
        <div id="stats-detail" style="padding:var(--sp-3);"></div>
      </div>
      <div class="card">
        <div style="padding:var(--sp-3);font-weight:700;font-size:0.9rem;border-bottom:1px solid var(--border);">🔄 آخر النشاطات</div>
        <div id="timeline-list"></div>
      </div>
    </div>

    <!-- Users Tab -->
    <div id="tab-users" class="admin-tab" style="display:none">
      <div style="margin-bottom:var(--sp-3);">
        <input class="form-input" type="text" id="user-search" placeholder="🔍 بحث عن مستخدم..." oninput="filterUsers()" style="width:100%">
      </div>
      <div id="users-list"></div>
    </div>

    <!-- Trades Tab -->
    <div id="tab-trades" class="admin-tab" style="display:none"></div>

    <!-- Deposits Tab -->
    <div id="tab-deposits" class="admin-tab" style="display:none"></div>

    <!-- Withdrawals Tab -->
    <div id="tab-withdrawals" class="admin-tab" style="display:none"></div>

    <!-- Disputes Tab -->
    <div id="tab-disputes" class="admin-tab" style="display:none"></div>

    <!-- Audit Log Tab -->
    <div id="tab-audit" class="admin-tab" style="display:none"></div>
  </div>
</div>
</main>

<div class="bottom-nav" id="bottomNav"></div>

<script src="/assets/app.js"></script>
<script>
let _allUsers = [];

(async function() {
  const user = await requireAuth();
  if (!user) return;
  if (user.role !== 'admin') {
    document.getElementById('loading').innerHTML = '<div style="text-align:center;padding:var(--sp-8);"><p style="font-size:1.2rem;margin-bottom:var(--sp-3);">🔒</p><p style="color:var(--error);font-weight:600;">غير مصرح — هذه الصفحة للمشرفين فقط</p></div>';
    return;
  }

  // Fetch all data in parallel
  const [analytics, timeline, users, trades, deposits, withdrawals, disputes, auditLog] = await Promise.all([
    api('/v2/admin/analytics').catch(() => ({})),
    api('/v2/admin/timeline').catch(() => ({ timeline: [] })),
    api('/admin/users').catch(() => ({ users: [] })),
    api('/admin/trades').catch(() => ({ trades: [] })),
    api('/admin/deposits').catch(() => ({ deposits: [] })),
    api('/admin/withdrawals').catch(() => ({ withdrawals: [] })),
    api('/admin/disputes').catch(() => ({ disputes: [] })),
    api('/admin/audit-log').catch(() => ({ logs: [] })),
  ]);

  const a = analytics || {};
  const usersList = users.users || [];
  const tradesList = trades.trades || [];
  const depList = deposits.deposits || [];
  const wdList = withdrawals.withdrawals || [];
  const disList = disputes.disputes || [];
  const logsList = auditLog.logs || [];

  _allUsers = usersList;

  const completedTrades = tradesList.filter(t => t.status === 'COMPLETED').length;
  const cancelledTrades = tradesList.filter(t => t.status === 'CANCELLED').length;
  const activeTrades = tradesList.filter(t => !['COMPLETED','CANCELLED'].includes(t.status)).length;
  const totalVolume = a.total_volume || tradesList.reduce((s, t) => s + (parseFloat(t.amount) || 0) * (parseFloat(t.price) || 0), 0);
  const activeDisputes = disList.filter(d => d.status === 'OPEN').length;
  const pendingWithdrawals = wdList.filter(w => w.status === 'PENDING').length;
  const pendingDeposits = depList.filter(d => d.status === 'PENDING').length;

  // KPI Cards
  document.getElementById('kpi-grid').innerHTML = `
    <div class="kpi-card"><div class="kpi-value">${usersList.length}</div><div class="kpi-label">👥 المستخدمون</div></div>
    <div class="kpi-card"><div class="kpi-value">${tradesList.length}</div><div class="kpi-label">📋 إجمالي الصفقات</div></div>
    <div class="kpi-card"><div class="kpi-value" style="color:var(--success)">${completedTrades}</div><div class="kpi-label">✅ صفقات مكتملة</div></div>
    <div class="kpi-card"><div class="kpi-value" style="color:var(--warning)">${activeTrades}</div><div class="kpi-label">⏳ صفقات جارية</div></div>
    <div class="kpi-card"><div class="kpi-value" style="color:var(--text-primary)">${fmtNum(totalVolume)} ₪</div><div class="kpi-label">💰 حجم التداول</div></div>
    <div class="kpi-card"><div class="kpi-value" style="color:var(--error)">${activeDisputes}</div><div class="kpi-label">⚠️ نزاعات نشطة</div></div>
    <div class="kpi-card"><div class="kpi-value" style="color:var(--warning)">${pendingDeposits}</div><div class="kpi-label">💵 إيداعات معلقة</div></div>
    <div class="kpi-card"><div class="kpi-value" style="color:var(--warning)">${pendingWithdrawals}</div><div class="kpi-label">🏦 سحوبات معلقة</div></div>
  `;

  // Overview: Stats detail
  document.getElementById('stats-detail').innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);">
      <div><span style="color:var(--text-muted);font-size:0.8rem;">الصفقات الملغاة</span><div style="font-weight:700;">${cancelledTrades}</div></div>
      <div><span style="color:var(--text-muted);font-size:0.8rem;">إجمالي الإيداعات</span><div style="font-weight:700;">${depList.length}</div></div>
      <div><span style="color:var(--text-muted);font-size:0.8rem;">إجمالي السحوبات</span><div style="font-weight:700;">${wdList.length}</div></div>
      <div><span style="color:var(--text-muted);font-size:0.8rem;">الإشعارات</span><div style="font-weight:700;">${a.total_notifications || '—'}</div></div>
    </div>
  `;

  // Timeline
  renderTimeline(logsList.length ? logsList : (timeline.timeline || []));

  // Users
  renderUsers(usersList);

  // Trades
  renderTrades(tradesList);

  // Deposits
  renderDeposits(depList);

  // Withdrawals
  renderWithdrawals(wdList);

  // Disputes
  renderDisputes(disList);

  // Audit
  renderAudit(logsList);

  document.getElementById('loading').style.display = 'none';
  document.getElementById('admin-content').style.display = 'block';
})();

function renderTimeline(items) {
  document.getElementById('timeline-list').innerHTML = items.length ?
    items.slice(0, 30).map(e => `
      <div class="timeline-item">
        <div class="timeline-dot"></div>
        <div class="timeline-body">
          <div class="timeline-text">${esc(e.description || e.action || e.type || '')}</div>
          <div class="timeline-meta">${esc(e.username || e.admin || 'نظام')} · ${fmtDate(e.created_at)}</div>
        </div>
      </div>
    `).join('') : '<p style="text-align:center;color:var(--text-muted);padding:var(--sp-4);">لا توجد أحداث</p>';
}

function renderUsers(users) {
  document.getElementById('users-list').innerHTML = users.length ?
    `<div class="card">${users.map(u => `
      <div style="display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);border-bottom:1px solid var(--border);">
        <div class="avatar avatar-sm">${(u.username||'?')[0].toUpperCase()}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;font-size:0.85rem;">${esc(u.username)}</div>
          <div style="font-size:0.7rem;color:var(--text-muted);">${esc(u.email || '—')} · ${u.trust_score || 0} ⭐</div>
        </div>
        <span class="badge ${u.status === 'ADMIN' ? 'badge-warning' : u.status === 'BANNED' ? 'badge-error' : 'badge-success'}">${u.status || 'ACTIVE'}</span>
      </div>
    `).join('')}</div>` : '<p style="text-align:center;color:var(--text-muted);padding:var(--sp-4);">لا يوجد مستخدمون</p>';
}

function renderTrades(trades) {
  document.getElementById('tab-trades').innerHTML = trades.length ?
    `<div class="card"><table class="table"><thead><tr><th>#</th><th>المشتري</th><th>البائع</th><th>المبلغ</th><th>السعر</th><th>الحالة</th></tr></thead><tbody>${trades.map(t => `
      <tr>
        <td>${t.id}</td>
        <td>${esc(t.buyer)}</td>
        <td>${esc(t.seller)}</td>
        <td>${t.amount} USDT</td>
        <td>${t.price || '—'} ₪</td>
        <td><span class="badge badge-${t.status === 'COMPLETED' ? 'success' : t.status === 'CANCELLED' ? 'error' : 'warning'}">${t.status}</span></td>
      </tr>
    `).join('')}</tbody></table></div>` : '<p style="text-align:center;color:var(--text-muted);padding:var(--sp-4);">لا توجد صفقات</p>';
}

function renderDeposits(deps) {
  document.getElementById('tab-deposits').innerHTML = deps.length ?
    `<div class="card"><table class="table"><thead><tr><th>المستخدم</th><th>المبلغ</th><th>TX Hash</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody>${deps.map(d => `
      <tr>
        <td>${esc(d.username)}</td>
        <td>${d.amount} USDT</td>
        <td class="mono" style="font-size:0.7rem;">${esc((d.tx_hash||'—').substring(0,10))}...</td>
        <td><span class="badge badge-${d.status === 'CONFIRMED' ? 'success' : d.status === 'REJECTED' ? 'error' : 'warning'}">${d.status}</span></td>
        <td>${fmtDate(d.created_at)}</td>
      </tr>
    `).join('')}</tbody></table></div>` : '<p style="text-align:center;color:var(--text-muted);padding:var(--sp-4);">لا توجد إيداعات</p>';
}

function renderWithdrawals(wds) {
  document.getElementById('tab-withdrawals').innerHTML = wds.length ?
    `<div class="card"><table class="table"><thead><tr><th>المستخدم</th><th>المبلغ</th><th>العنوان</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody>${wds.map(w => `
      <tr>
        <td>${esc(w.username)}</td>
        <td>${w.amount} USDT</td>
        <td class="mono" style="font-size:0.7rem;">${esc((w.address||'').substring(0,12))}...</td>
        <td><span class="badge badge-${w.status === 'COMPLETED' ? 'success' : w.status === 'REJECTED' ? 'error' : 'warning'}">${w.status}</span></td>
        <td>${fmtDate(w.created_at)}</td>
      </tr>
    `).join('')}</tbody></table></div>` : '<p style="text-align:center;color:var(--text-muted);padding:var(--sp-4);">لا توجد سحوبات</p>';
}

function renderDisputes(diss) {
  document.getElementById('tab-disputes').innerHTML = diss.length ?
    `<div class="card"><table class="table"><thead><tr><th>#</th><th>الصفقة</th><th>المبلغ</th><th>السبب</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody>${diss.map(d => `
      <tr>
        <td>${d.id}</td>
        <td>#${d.trade_id}</td>
        <td>${d.amount || '—'}</td>
        <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(d.reason || '—')}</td>
        <td><span class="badge badge-${d.status === 'RESOLVED' ? 'success' : d.status === 'OPEN' ? 'error' : 'warning'}">${d.status}</span></td>
        <td>${fmtDate(d.created_at)}</td>
      </tr>
    `).join('')}</tbody></table></div>` : '<p style="text-align:center;color:var(--text-muted);padding:var(--sp-4);">لا توجد نزاعات</p>';
}

function renderAudit(logs) {
  document.getElementById('tab-audit').innerHTML = logs.length ?
    `<div class="card">${logs.slice(0, 50).map(l => `
      <div class="timeline-item">
        <div class="timeline-dot" style="background:${l.type === 'admin' ? 'var(--warning)' : 'var(--primary)'}"></div>
        <div class="timeline-body">
          <div class="timeline-text">${esc(l.description || l.action || '')}</div>
          <div class="timeline-meta">${esc(l.username || '—')} · ${esc(l.type || '')} · ${fmtDate(l.created_at)}</div>
        </div>
      </div>
    `).join('')}</div>` : '<p style="text-align:center;color:var(--text-muted);padding:var(--sp-4);">لا يوجد سجل نشاط</p>';
}

window.filterUsers = function() {
  const q = document.getElementById('user-search').value.toLowerCase();
  const filtered = _allUsers.filter(u => (u.username||'').toLowerCase().includes(q) || (u.email||'').toLowerCase().includes(q));
  renderUsers(filtered);
};

window.showTab = function(name, btn) {
  document.querySelectorAll('.admin-tab').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).style.display = 'block';
  btn.classList.add('active');
};

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function fmtNum(n) { return Number(n || 0).toLocaleString('ar'); }
function fmtDate(d) { if (!d) return '—'; return new Date(d).toLocaleDateString('ar', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
</script>
<style>
  .kpi-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:var(--sp-2); margin-bottom:var(--sp-4); }
  .kpi-card { text-align:center; padding:var(--sp-3); background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm); }
  .kpi-value { font-size:1.3rem; font-weight:800; color:var(--text-primary); }
  .kpi-label { font-size:0.7rem; color:var(--text-muted); margin-top:var(--sp-1); }
  .admin-tabs { display:flex; gap:var(--sp-1); overflow-x:auto; margin-bottom:var(--sp-4); padding-bottom:var(--sp-2); -webkit-overflow-scrolling:touch; }
  .tab-btn { padding:var(--sp-2) var(--sp-3); border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-card); color:var(--text-muted); font-size:0.75rem; font-weight:600; cursor:pointer; white-space:nowrap; transition:all .15s; }
  .tab-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
  .table { width:100%; font-size:0.75rem; border-collapse:collapse; }
  .table th { text-align:right; padding:var(--sp-2) var(--sp-3); color:var(--text-muted); font-weight:600; border-bottom:2px solid var(--border); font-size:0.7rem; }
  .table td { padding:var(--sp-2) var(--sp-3); border-bottom:1px solid var(--border); }
  .table tr:hover { background:var(--bg-surface); }
  .timeline-item { display:flex; gap:var(--sp-3); padding:var(--sp-3); border-bottom:1px solid var(--border); }
  .timeline-dot { width:8px; height:8px; border-radius:50%; background:var(--primary); margin-top:6px; flex-shrink:0; }
  .timeline-body { flex:1; min-width:0; }
  .timeline-text { font-size:0.85rem; }
  .timeline-meta { font-size:0.7rem; color:var(--text-muted); margin-top:var(--sp-1); }
  .avatar-sm { width:32px; height:32px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:0.8rem; font-weight:700; flex-shrink:0; }
  .mono { font-family:monospace; direction:ltr; text-align:left; }
  @media (min-width:640px) { .kpi-grid { grid-template-columns:repeat(4,1fr); } }
</style>
</body>
</html>
