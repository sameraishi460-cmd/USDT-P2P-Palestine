<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة — USDT P2P Palestine</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<nav class="nav" id="nav"></nav>
<main class="main"><div class="container" style="max-width:800px" id="app"><div class="card"><div class="spinner"></div></div></div></main>
</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/assets/app.js"></script>
<script>
async function load() {
  if (!requireAuth()) return;
  const u = currentUser(); if (!u || !u.isAdmin) { document.getElementById('app').innerHTML = '<div class="card" style="padding:32px;text-align:center;color:var(--error)">غير مصرح</div>'; return; }
  const [analytics, timeline, users, trades, deposits, withdrawals, disputes] = await Promise.all([
    api('/v2/admin/analytics').catch(()=>({})),
    api('/v2/admin/timeline').catch(()=>({timeline:[]})),
    api('/admin/users').catch(()=>({users:[]})),
    api('/admin/trades').catch(()=>({trades:[]})),
    api('/admin/deposits').catch(()=>({deposits:[]})),
    api('/admin/withdrawals').catch(()=>({withdrawals:[]})),
    api('/admin/disputes').catch(()=>({disputes:[]})),
  ]);
  const a = analytics || {};
  document.getElementById('app').innerHTML = `
    <h1 style="font-size:1.3rem;font-weight:700;margin-bottom:16px">لوحة الإدارة</h1>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px">
      <div class="card" style="text-align:center;padding:14px"><div style="font-size:1.3rem;font-weight:800;color:var(--accent)">${a.total_users||users.users?.length||0}</div><div style="font-size:.75rem;color:var(--text-muted)">مستخدمون</div></div>
      <div class="card" style="text-align:center;padding:14px"><div style="font-size:1.3rem;font-weight:800;color:var(--accent)">${a.total_trades||trades.trades?.length||0}</div><div style="font-size:.75rem;color:var(--text-muted)">صفقات</div></div>
      <div class="card" style="text-align:center;padding:14px"><div style="font-size:1.3rem;font-weight:800;color:var(--accent)">${fmtNum(a.total_volume||0)} ₪</div><div style="font-size:.75rem;color:var(--text-muted)">حجم التداول</div></div>
    </div>
    <h3 style="margin-bottom:12px;font-size:1rem">تطورات لوحة التحكم</h3>
    <div class="card" style="padding:16px">
      ${(timeline.timeline||[]).length ? timeline.timeline.slice(0,20).map(e => `<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem">
        <div style="width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex-shrink:0"></div>
        <div><div>${esc(e.description||e.type)}</div><div style="color:var(--text-muted);font-size:.75rem">${esc(e.username||'')} · ${fmtDate(e.created_at)}</div></div>
      </div>`).join('') : '<div style="text-align:center;color:var(--text-muted);padding:16px">لا توجد أحداث</div>'}
    </div>
  </div></main></div>
<script src="/assets/app.js"></script>
</body></html>
