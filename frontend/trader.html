<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملف المتداول — USDT P2P Palestine</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<nav class="nav" id="nav"></nav>
<main class="main"><div class="container" style="max-width:640px" id="app"><div class="card"><div class="spinner"></div></div></div></main>
<div class="bottom-nav" id="bottomNav"></div>
</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/assets/app.js"></script>
<script>
async function load() {
  const params = new URLSearchParams(location.search);
  const username = params.get('u') || location.pathname.split('/trader/')[1];
  if (!username) { document.getElementById('app').innerHTML = '<div class="card"><div class="empty"><div class="empty-icon">👤</div><div class="empty-title">متداول غير موجود</div></div></div>'; return; }

  const [prof, trustResp, adsResp, reviewsResp] = await Promise.all([
    api('/v2/trust/' + username).catch(() => ({})),
    api('/v2/trust/' + username).catch(() => ({})),
    api('/market').catch(() => ({ ads: [] })),
    api('/v2/reviews/' + username).catch(() => ({ reviews: [] })),
  ]);

  const t = (trustResp?.trust) || {};
  const v = (trustResp?.vip) || {};
  const vc = v.level === 'verified' ? '💎' : v.level === 'gold' ? '🥇' : v.level === 'silver' ? '🥈' : '🥉';
  const vl = v.label || 'برونزي';
  const ads = (adsResp?.ads || []).filter(a => a.user === username).slice(0, 5);
  const reviews = (reviewsResp?.reviews || []).slice(0, 10);

  document.getElementById('app').innerHTML = `
    <div class="card" style="text-align:center;padding:24px">
      <div class="avatar avatar-xl" style="margin:0 auto 12px">${username[0].toUpperCase()}</div>
      <h1 style="font-size:1.3rem;font-weight:700;margin:0 0 4px">${esc(username)}</h1>
      <div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:8px">
        <span class="badge badge-vip">${vc} ${vl}</span>
        ${t.trust_score >= 80 ? '<span class="trust-score trust-high">🛡️ موثوق</span>' : ''}
        ${t.avg_rating ? `<span class="badge badge-info">⭐ ${fmtNum(t.avg_rating,1)}</span>` : ''}
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px">
        <div><div style="font-size:1.2rem;font-weight:800;color:var(--primary)">${t.completed_trades || 0}</div><div style="font-size:.75rem;color:var(--text-muted)">صفقة</div></div>
        <div><div style="font-size:1.2rem;font-weight:800;color:var(--success)">${t.completion_rate || 0}%</div><div style="font-size:.75rem;color:var(--text-muted)">نسبة الإتمام</div></div>
        <div><div style="font-size:1.2rem;font-weight:800;color:var(--warning)">${fmtNum(t.trust_score,0)}%</div><div style="font-size:.75rem;color:var(--text-muted)">Trust Score</div></div>
      </div>
    </div>

    ${ads.length ? `<div class="card" style="padding:16px"><div class="card-title">📢 الإعلانات النشطة</div>${ads.map(a => `
      <div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
        <div><span class="${a.type==='BUY'?'badge badge-buy':'badge badge-sell'}">${a.type==='BUY'?'شراء':'بيع'}</span> ${fmtNum(a.amount)} USDT</div>
        <div style="font-weight:700;color:var(--primary)">${fmtNum(a.price)} ₪</div>
      </div>`).join('')}</div>` : ''}

    ${reviews.length ? `<div class="card" style="padding:16px"><div class="card-title">⭐ التقييمات</div>${reviews.map(r => `
      <div style="padding:10px 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-weight:600">${esc(r.from_user)}</span>
          <span style="color:var(--warning)">${'⭐'.repeat(r.rating)}</span>
        </div>
        ${r.comment ? `<p style="font-size:.85rem;color:var(--text-secondary);margin-top:4px">${esc(r.comment)}</p>` : ''}
        <div style="font-size:.75rem;color:var(--text-muted);margin-top:2px">${fmtDate(r.created)}</div>
      </div>`).join('')}</div>` : '<div class="card"><div class="empty"><p>لا توجد تقييمات بعد</p></div></div>'}
  `;
}
load();
</script>
</body>
</html>
