<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e18">
<title>ال trader — USDT P2P Palestine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<style>
.trust-circle { width:120px; height:120px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  border:4px solid var(--primary); margin:0 auto 16px; }
.trust-circle .score { font-size:32px; font-weight:800; color:var(--primary); }
.trust-circle .label { font-size:11px; color:var(--text-dim); }
.stat-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); }
.stat-row:last-child { border-bottom:none; }
</style>
</head>
<body>
<div class="navbar">
  <a href="/" style="text-decoration:none;"><span class="logo">🇵🇸 USDT P2P</span></a>
  <div class="actions"><a href="/profile.html">👤</a></div>
</div>
<div class="container" id="content"><div class="skeleton"></div></div>
<div id="toast"></div>
<script src="assets/app.js"></script>
<script>
var params = new URLSearchParams(location.search);
var username = params.get('u');
if (!username) { location.href = '/market.html'; throw new Error('no username'); }
(async function() {
  var r = await get('/v2/trader/' + encodeURIComponent(username));
  if (!r || !r.ok) { document.getElementById('content').innerHTML = '<div class="empty"><p>المستخدم غير موجود</p></div>'; return; }
  var u = r.user, t = r.trust, v = r.vip;
  var h = '';
  h += '<div class="text-center">';
  h += '<div class="avatar avatar-lg" style="margin:0 auto 12px;">' + ((u.username||'?')[0]||'?').toUpperCase() + '</div>';
  h += '<h2 style="font-size:20px;font-weight:800;">' + escHtml(u.first_name || u.username) + '</h2>';
  h += '<div class="muted text-sm">@' + escHtml(u.username) + '</div>';
  h += '<div style="margin-top:8px;">';
  if (u.verified) h += verifiedBadge(true) + ' ';
  h += '<span class="vip-badge">' + v.badge + ' ' + v.label + '</span>';
  h += '</div></div>';

  // Trust Score Circle
  h += '<div class="card" style="text-align:center;margin-top:16px;">';
  h += '<div class="trust-circle"><div class="score">' + Math.round(t.trust_score) + '%</div><div class="label">Trust Score</div></div>';
  h += '<div class="text-sm text-dim">' + (t.trust_score >= 75 ? '🟢 موثوق' : t.trust_score >= 50 ? '🟡 مقبول' : '🔴 منخفض') + '</div>';
  h += '</div>';

  // Stats
  h += '<div class="card"><div class="card-title">📊 الإحصائيات</div>';
  h += '<div class="stat-row"><span>التقييم</span><span class="text-gold">⭐ ' + formatNum(t.avg_rating || u.rating, 1) + ' (' + (t.total_ratings||0) + ' تقييم)</span></div>';
  h += '<div class="stat-row"><span>الصفقات المكتملة</span><span class="text-primary">' + (t.completed_trades || u.trades_count || 0) + '</span></div>';
  h += '<div class="stat-row"><span>نسبة الإتمام</span><span>' + formatNum(t.completion_rate || 0, 1) + '%</span></div>';
  h += '<div class="stat-row"><span>الصفقات الملغاة</span><span class="text-danger">' + (t.cancelled_trades || 0) + '</span></div>';
  h += '<div class="stat-row"><span>النزاعات</span><span class="text-warning">' + (t.disputed_trades || 0) + '</span></div>';
  h += '<div class="stat-row"><span>عمر الحساب</span><span>' + (t.account_age_days || 0) + ' يوم</span></div>';
  h += '</div>';

  // Security note
  h += '<div class="card" style="border-color:rgba(0,201,167,.15);">';
  h += '<div class="muted text-xs">🛡️ جميع المعاملات محمية بضمان USDT Palestine. لا تتم مشاركة أي معلومات خاصة.</div>';
  h += '</div>';

  document.getElementById('content').innerHTML = h;
})();
</script>
</body>
</html>
