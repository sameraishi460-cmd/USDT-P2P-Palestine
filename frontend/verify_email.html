<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>توثيق البريد — USDT P2P Palestine</title>
  <link rel="stylesheet" href="/assets/design-system.css">
  <link rel="manifest" href="/manifest.json">
<script>(function(){var t=localStorage.getItem("usp_theme")||"dark";if(t==="auto")t=window.matchMedia("(prefers-color-scheme:light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>

<nav class="navbar" id="nav"></nav>

<main>
<div class="container container-narrow" style="padding-top:var(--sp-8);">

  <div id="loading" style="text-align:center;padding:var(--sp-8);">
    <div class="spinner" style="margin:0 auto var(--sp-3);"></div>
    <p style="color:var(--text-muted);">جاري توثيق البريد الإلكتروني...</p>
  </div>

  <div id="result" style="display:none;"></div>

</div>
</main>



<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/assets/app.js"></script>
<script>
(async function() {
  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('result').innerHTML = `
      <div style="text-align:center;padding:var(--sp-8);">
        <div style="font-size:3rem;margin-bottom:var(--sp-3);">❌</div>
        <h2 style="font-size:1.4rem;margin-bottom:var(--sp-3);">رابط غير صالح</h2>
        <p style="color:var(--text-muted);margin-bottom:var(--sp-6);">لم يتم العثور على رمز التحقق في الرابط.</p>
        <a href="/profile" class="btn btn-ghost">← العودة للحساب</a>
      </div>
    `;
    document.getElementById('result').style.display = 'block';
    return;
  }

  try {
    const r = await api('/auth/verify-email', { method: 'POST', body: { token } });
    document.getElementById('loading').style.display = 'none';

    if (r && r.ok) {
      document.getElementById('result').innerHTML = `
        <div style="text-align:center;padding:var(--sp-8);">
          <div style="font-size:3rem;margin-bottom:var(--sp-3);">✅</div>
          <h2 style="font-size:1.4rem;margin-bottom:var(--sp-3);">تم توثيق البريد الإلكتروني</h2>
          <p style="color:var(--text-muted);margin-bottom:var(--sp-6);">حسابك الآن موثق بالبريد الإلكتروني.</p>
          <a href="/profile" class="btn btn-success btn-lg">← حسابي</a>
        </div>
      `;
    } else {
      document.getElementById('result').innerHTML = `
        <div style="text-align:center;padding:var(--sp-8);">
          <div style="font-size:3rem;margin-bottom:var(--sp-3);">⚠️</div>
          <h2 style="font-size:1.4rem;margin-bottom:var(--sp-3);">فشل التوثيق</h2>
          <p style="color:var(--text-muted);margin-bottom:var(--sp-6);">${esc(r?.error || 'الرابط غير صالح أو منتهي الصلاحية.')}</p>
          <a href="/profile" class="btn btn-ghost">← العودة للحساب</a>
        </div>
      `;
    }
  } catch {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('result').innerHTML = `
      <div style="text-align:center;padding:var(--sp-8);">
        <div style="font-size:3rem;margin-bottom:var(--sp-3);">❌</div>
        <h2 style="font-size:1.4rem;margin-bottom:var(--sp-3);">خطأ في الاتصال</h2>
        <p style="color:var(--text-muted);margin-bottom:var(--sp-6);">حاول مرة أخرى لاحقاً.</p>
        <a href="/profile" class="btn btn-ghost">← العودة للحساب</a>
      </div>
    `;
  }
  document.getElementById('result').style.display = 'block';
})();
</script>
</body>
</html>
