<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>نسيت كلمة المرور — USDT P2P Palestine</title>
  <link rel="stylesheet" href="/assets/design-system.css">
  <link rel="manifest" href="/manifest.json">
<script>(function(){var t=localStorage.getItem("usp_theme")||"dark";if(t==="auto")t=window.matchMedia("(prefers-color-scheme:light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>

<nav class="navbar" id="nav"></nav>

<main>
<div class="container container-narrow" style="padding-top:var(--sp-8);">

  <!-- Step 1: Enter email -->
  <div id="step-email">
    <div style="text-align:center;margin-bottom:var(--sp-8);">
      <div style="font-size:3rem;margin-bottom:var(--sp-3);">🔑</div>
      <h1 style="font-size:1.8rem;">نسيت كلمة المرور؟</h1>
      <p style="color:var(--text-muted);font-size:0.9rem;margin-top:var(--sp-2);">أدخل بريدك الإلكتروني وسنرسل لك رابطاً لإعادة التعيين</p>
    </div>

    <div id="errBox" class="flash flash-error" style="display:none;margin-bottom:var(--sp-4);"></div>
    <div id="successBox" class="flash flash-success" style="display:none;margin-bottom:var(--sp-4);"></div>

    <form class="card" onsubmit="event.preventDefault();sendReset();">
      <div class="form-group">
        <label class="form-label">📧 البريد الإلكتروني</label>
        <input class="form-input" type="email" id="email" placeholder="email@example.com" required autocomplete="email" autofocus>
      </div>
      <button type="submit" class="btn btn-success btn-block btn-lg" id="sendBtn">📨 إرسال رابط إعادة التعيين</button>
    </form>

    <div style="text-align:center;margin-top:var(--sp-6);">
      <p style="color:var(--text-muted);font-size:0.85rem;">
        تذكرت كلمة المرور؟ <a href="/login" style="color:var(--accent-light);font-weight:600;">سجّل دخولك</a>
      </p>
    </div>
  </div>

  <!-- Step 2: Enter new password (shown if token in URL) -->
  <div id="step-reset" style="display:none;">
    <div style="text-align:center;margin-bottom:var(--sp-8);">
      <div style="font-size:3rem;margin-bottom:var(--sp-3);">🔒</div>
      <h1 style="font-size:1.8rem;">إعادة تعيين كلمة المرور</h1>
      <p style="color:var(--text-muted);font-size:0.9rem;margin-top:var(--sp-2);">أدخل كلمة المرور الجديدة</p>
    </div>

    <div id="errBox2" class="flash flash-error" style="display:none;margin-bottom:var(--sp-4);"></div>

    <form class="card" onsubmit="event.preventDefault();resetPassword();">
      <div class="form-group">
        <label class="form-label">🔒 كلمة المرور الجديدة</label>
        <input class="form-input" type="password" id="new-pw" placeholder="6 أحرف على الأقل" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label">🔒 تأكيد كلمة المرور</label>
        <input class="form-input" type="password" id="confirm-pw" placeholder="أعد إدخال كلمة المرور" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-success btn-block btn-lg" id="resetBtn">💾 حفظ كلمة المرور الجديدة</button>
    </form>
  </div>

</div>
</main>



<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/assets/app.js"></script>
<script>
// Check if there's a reset token in the URL
const urlParams = new URLSearchParams(window.location.search);
const resetToken = urlParams.get('token');

if (resetToken) {
  // Show reset form
  document.getElementById('step-email').style.display = 'none';
  document.getElementById('step-reset').style.display = 'block';
}

async function sendReset() {
  const email = document.getElementById('email').value.trim();
  const errBox = document.getElementById('errBox');
  const successBox = document.getElementById('successBox');
  const btn = document.getElementById('sendBtn');

  if (!email) { errBox.textContent = 'أدخل البريد الإلكتروني'; errBox.style.display = 'block'; return; }

  errBox.style.display = 'none';
  successBox.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'جاري الإرسال...';

  const r = await api('/auth/forgot-password', { method: 'POST', body: { email } });
  btn.disabled = false;
  btn.textContent = '📨 إرسال رابط إعادة التعيين';

  if (r && r.ok) {
    successBox.textContent = 'إذا كان البريد مسجلاً في حسابك، ستتلقى رسالة خلال دقائق.';
    successBox.style.display = 'block';
    document.getElementById('email').value = '';
  } else if (r && r.error) {
    errBox.textContent = r.error;
    errBox.style.display = 'block';
  } else {
    errBox.textContent = 'خطأ في الاتصال';
    errBox.style.display = 'block';
  }
}

async function resetPassword() {
  const newPw = document.getElementById('new-pw').value;
  const confirmPw = document.getElementById('confirm-pw').value;
  const errBox = document.getElementById('errBox2');
  const btn = document.getElementById('resetBtn');

  if (!newPw || !confirmPw) { errBox.textContent = 'أدخل كلمة المرور الجديدة'; errBox.style.display = 'block'; return; }
  if (newPw.length < 6) { errBox.textContent = '6 أحرف على الأقل'; errBox.style.display = 'block'; return; }
  if (newPw !== confirmPw) { errBox.textContent = 'كلمتا المرور غير متطابقتين'; errBox.style.display = 'block'; return; }

  errBox.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'جاري الحفظ...';

  const r = await api('/auth/reset-password', { method: 'POST', body: { token: resetToken, new_password: newPw, confirm_password: confirmPw } });
  btn.disabled = false;
  btn.textContent = '💾 حفظ كلمة المرور الجديدة';

  if (r && r.ok) {
    // Success — redirect to login
    document.getElementById('step-reset').innerHTML = `
      <div style="text-align:center;padding:var(--sp-8);">
        <div style="font-size:3rem;margin-bottom:var(--sp-3);">✅</div>
        <h2 style="font-size:1.4rem;margin-bottom:var(--sp-3);">تم إعادة التعيين بنجاح</h2>
        <p style="color:var(--text-muted);margin-bottom:var(--sp-6);">سجّل الدخول بكلمة المرور الجديدة</p>
        <a href="/login" class="btn btn-success btn-lg">🔑 تسجيل الدخول</a>
      </div>
    `;
  } else if (r && r.error) {
    errBox.textContent = r.error;
    errBox.style.display = 'block';
  } else {
    errBox.textContent = 'خطأ في الاتصال';
    errBox.style.display = 'block';
  }
}
</script>
</body>
</html>
