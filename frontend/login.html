<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>دخول — USDT P2P Palestine</title>
  <link rel="stylesheet" href="/assets/design-system.css">
</head>
<body>

<!-- ===== Navbar ===== -->
<nav class="navbar" id="nav">
  <div class="navbar-inner">
    <a href="/" class="navbar-brand">🇵🇸 <span>USDT</span> P2P</a>
    <div class="navbar-links">
      <a href="/login" class="btn-nav">دخول</a>
      <a href="/register" class="btn-nav-accent btn-nav">حساب جديد</a>
    </div>
  </div>
</nav>

<!-- ===== Content ===== -->
<main>
<div class="container container-narrow" style="padding-top:var(--sp-8);">

  <div style="text-align:center;margin-bottom:var(--sp-8);">
    <div style="font-size:3rem;margin-bottom:var(--sp-3);">🇵🇸</div>
    <h1 style="font-size:1.8rem;">مرحباً بك</h1>
    <p style="color:var(--text-muted);font-size:0.9rem;margin-top:var(--sp-2);">ادخل إلى حسابك في USDT P2P Palestine</p>
  </div>

  <!-- Telegram Login -->
  <div style="margin-bottom:var(--sp-4);">
    <button class="btn btn-block" id="tgLoginBtn" style="background:#0088cc;color:#fff;display:flex;align-items:center;justify-content:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);border-radius:var(--radius-md);font-size:0.95rem;font-weight:600;cursor:pointer;border:none;width:100%;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.95 7.47l-1.97 9.28c-.15.67-.54.83-1.09.52l-3.02-2.22-1.46 1.4c-.16.16-.3.3-.61.3l.22-3.06 5.56-5.02c.24-.22-.05-.33-.37-.14L8.85 13.3l-2.96-.93c-.64-.2-.66-.64.13-.95l11.55-4.46c.54-.2 1.01.13.83.95l-.42.06z"/></svg>
      دخول عبر Telegram
    </button>
    <div id="tgLoginMsg" style="display:none;margin-top:var(--sp-3);padding:var(--sp-3);background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-md);text-align:center;">
      <div id="tgLoginCode" style="font-size:1.5rem;font-weight:800;letter-spacing:4px;color:var(--accent);margin:var(--sp-2) 0;"></div>
      <p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:var(--sp-2);">أرسل هذا الكود للبوت:</p>
      <p style="font-size:0.85rem;color:var(--text-primary);" id="tgLoginCmd"></p>
      <button class="btn btn-ghost btn-sm" style="margin-top:var(--sp-2);" onclick="copyTgCode()">📋 نسخ الكود</button>
    </div>
  </div>

  <div style="text-align:center;margin-bottom:var(--sp-4);color:var(--text-muted);font-size:0.85rem;">— أو سجّل بالبريد الإلكتروني —</div>

  <div id="errBox" class="flash flash-error" style="display:none;margin-bottom:var(--sp-4);"></div>

  <form class="card" onsubmit="event.preventDefault();doSubmit();">
    <div class="form-group">
      <label class="form-label">👤 اسم المستخدم أو البريد</label>
      <input class="form-input" type="text" id="identifier" placeholder="أدخل اسم المستخدم أو البريد" required autocomplete="username" autofocus>
    </div>
    <div class="form-group">
      <label class="form-label">🔒 كلمة المرور</label>
      <input class="form-input" type="password" id="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-success btn-block btn-lg" id="loginBtn">🚀 دخول</button>
  </form>

  <div style="text-align:center;margin-top:var(--sp-6);">
    <p style="color:var(--text-muted);font-size:0.85rem;">
      ليس لديك حساب؟ <a href="/register" style="color:var(--accent-light);font-weight:600;">سجل الآن</a>
    </p>
  </div>

</div>
</main>

<div class="bottom-nav" id="bottomNav"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/assets/app.js"></script>
<script>
let tgCode = '';

async function startTelegramLogin() {
  const btn = document.getElementById('tgLoginBtn');
  btn.disabled = true; btn.textContent = 'جاري التجهيز...';
  const r = await api('/auth/telegram/link', { method: 'POST' });
  btn.disabled = false;
  btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.95 7.47l-1.97 9.28c-.15.67-.54.83-1.09.52l-3.02-2.22-1.46 1.4c-.16.16-.3.3-.61.3l.22-3.06 5.56-5.02c.24-.22-.05-.33-.37-.14L8.85 13.3l-2.96-.93c-.64-.2-.66-.64.13-.95l11.55-4.46c.54-.2 1.01.13.83.95l-.42.06z"/></svg> دخول عبر Telegram';
  if (r && r.ok && r.code) {
    tgCode = r.code;
    document.getElementById('tgLoginCode').textContent = r.code;
    document.getElementById('tgLoginCmd').textContent = '/link ' + r.code;
    document.getElementById('tgLoginMsg').style.display = 'block';
    showToast('تم إنشاء الكود — أرسله للبوت');
  } else { showToast(r?.error || 'خطأ', 4000); }
}
function copyTgCode() { navigator.clipboard?.writeText('/link ' + tgCode); showToast('تم نسخ الأمر'); }
document.getElementById('tgLoginBtn').addEventListener('click', startTelegramLogin);

async function doSubmit() {
  const id = document.getElementById('identifier').value.trim();
  const pw = document.getElementById('password').value;
  const errBox = document.getElementById('errBox');
  const btn = document.getElementById('loginBtn');
  if (!id || !pw) { errBox.textContent = 'أدخل جميع البيانات'; errBox.style.display = 'block'; return; }
  errBox.style.display = 'none'; btn.disabled = true; btn.textContent = 'جاري الدخول...';
  const r = await doLogin(id, pw);
  btn.disabled = false; btn.textContent = '🚀 دخول';
  if (r && r.ok) { location.href = new URLSearchParams(location.search).get('returnTo') || '/market'; }
  else if (r && r.error) { errBox.textContent = r.error; errBox.style.display = 'block'; }
  else { errBox.textContent = 'خطأ في الاتصال'; errBox.style.display = 'block'; }
}
</script>
</body>
</html>
