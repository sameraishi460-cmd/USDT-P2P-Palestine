<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e18">
<title>تسجيل الدخول — USDT P2P Palestine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="navbar">
  <a href="/" style="text-decoration:none;"><span class="logo">🇵🇸 USDT <span>P2P</span></span></a>
</div>

<div class="container" style="padding-top:32px;">
  <div class="text-center" style="margin-bottom:28px;">
    <div style="font-size:40px;margin-bottom:8px;">🇵🇸</div>
    <h1 style="font-size:22px;font-weight:800;">تسجيل الدخول</h1>
    <p class="text-secondary text-sm">ادخل إلى حسابك في USDT P2P Palestine</p>
  </div>

  <div id="errorBox" class="alert alert-error" style="display:none;"></div>

  <!-- Email/Username Login -->
  <form id="loginForm" class="card">
    <div class="form-group">
      <label>البريد الإلكتروني أو اسم المستخدم</label>
      <input id="identifier" type="text" required placeholder="email@example.com" autocomplete="username">
    </div>
    <div class="form-group">
      <label>كلمة المرور</label>
      <input id="password" type="password" required placeholder="••••••" autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary" id="loginBtn">🔐 تسجيل الدخول</button>
  </form>

  <div class="text-center mt-12 mb-12">
    <a href="/register" class="text-sm text-secondary">ليس لديك حساب؟ <b class="text-primary">سجّل الآن</b></a>
  </div>

  <!-- Telegram Login -->
  <button onclick="telegramLogin()" class="btn btn-ghost mb-12" id="tgBtn">
    <span style="font-size:18px;">✈️</span> تسجيل الدخول عبر Telegram
  </button>

  <!-- Admin Login -->
  <div class="text-center" style="margin-top:24px;">
    <a href="/admin_login" class="text-xs text-muted">🔒 دخول الإدارة</a>
  </div>
</div>

<div id="bottomNav"></div>
<div id="toast"></div>
<script src="/assets/app.js"></script>
<script>
if (window.Telegram && window.Telegram.WebApp) {
  Telegram.WebApp.ready();
  if (Telegram.WebApp.BackButton) {
    Telegram.WebApp.BackButton.show();
    Telegram.WebApp.BackButton.onClick(function() { location.href = '/'; });
  }
}

var returnTo = new URLSearchParams(location.search).get('returnTo') || '/';
// If already logged in, redirect
if (getUser()) { location.href = returnTo; }

$('#loginForm').onsubmit = async function(e) {
  e.preventDefault();
  var btn = $('#loginBtn');
  btn.disabled = true;
  btn.textContent = 'جاري الدخول...';
  $('#errorBox').style.display = 'none';

  var r = await post('/auth/login', {
    username: $('#identifier').value.trim(),
    password: $('#password').value
  });

  if (!r || !r.ok) {
    $('#errorBox').style.display = 'block';
    $('#errorBox').textContent = (r && r.error) || 'خطأ في تسجيل الدخول';
    btn.disabled = false;
    btn.textContent = '🔐 تسجيل الدخول';
    return;
  }

  setCsrf(r.csrf_token);
  // Fetch user info for sidebar
  var me = await get('/auth/me');
  if (me && me.authenticated) {
    setUser({ username: me.username, isAdmin: me.isAdmin });
  } else {
    setUser({ username: $('#identifier').value.trim() });
  }
  location.href = returnTo;
};

async function telegramLogin() {
  // Check if we're inside Telegram
  if (!window.Telegram || !window.Telegram.WebApp || !window.Telegram.WebApp.initData) {
    toast('افتح من داخل Telegram لتسجيل الدخول عبر Telegram', 4000);
    return;
  }
  $('#tgBtn').disabled = true;
  $('#tgBtn').textContent = '⏳ جاري التحقق...';
  $('#errorBox').style.display = 'none';

  var r = await post('/auth/telegram', { initData: Telegram.WebApp.initData });

  if (!r || !r.ok) {
    $('#errorBox').style.display = 'block';
    $('#errorBox').textContent = (r && r.error) || 'فشل التحقق من Telegram';
    $('#tgBtn').disabled = false;
    $('#tgBtn').textContent = '✈️ تسجيل الدخول عبر Telegram';
    return;
  }

  setCsrf(r.csrf_token);
  setUser({ username: r.username || 'telegram_user' });
  location.href = returnTo;
}
</script>
</body>
</html>
