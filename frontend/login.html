<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — USDT P2P Palestine</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<nav class="nav" id="nav"></nav>
<main class="main"><div class="container" style="max-width:420px;margin-top:48px">
  <div class="text-center" style="margin-bottom:32px">
    <div style="width:56px;height:56px;border-radius:14px;background:var(--primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:1.5rem;margin-bottom:12px">🔗</div>
    <h1 style="font-size:1.4rem;font-weight:700">تسجيل الدخول</h1>
    <p style="color:var(--text-muted);font-size:.85rem;margin-top:4px">أدخل بيانات حسابك للمتابعة</p>
  </div>
  <div id="errBox" class="alert alert-error" style="display:none;margin-bottom:16px"></div>
  <div class="card" style="padding:24px">
    <div class="form-group">
      <label>اسم المستخدم أو البريد الإلكتروني</label>
      <input type="text" class="form-input" id="identifier" placeholder="username أو email" autocomplete="username">
    </div>
    <div class="form-group">
      <label>كلمة المرور</label>
      <input type="password" class="form-input" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-block" id="loginBtn" style="margin-top:8px">تسجيل الدخول</button>
  </div>
  <div class="text-center" style="margin-top:16px;font-size:.85rem">
    <span style="color:var(--text-muted)">ليس لديك حساب؟</span> <a href="/register" style="color:var(--primary);font-weight:600;text-decoration:none">إنشاء حساب</a>
  </div>
  <div class="text-center" style="margin-top:8px;font-size:.85rem">
    <a href="/admin_login" style="color:var(--text-muted);text-decoration:none">🛡️ دخول الإدارة</a>
  </div>
</div></main>
</div>
<script src="/assets/app.js"></script>
<script>
document.getElementById('identifier').addEventListener('keydown', e => { if (e.key === 'Enter') doSubmit(); });
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') doSubmit(); });
document.getElementById('loginBtn').addEventListener('click', doSubmit);

async function doSubmit() {
  const id = document.getElementById('identifier').value.trim();
  const pw = document.getElementById('password').value;
  const errBox = document.getElementById('errBox');
  const btn = document.getElementById('loginBtn');
  if (!id || !pw) { errBox.textContent = 'أدخل جميع البيانات'; errBox.style.display = 'block'; return; }
  errBox.style.display = 'none';
  btn.disabled = true; btn.textContent = 'جاري الدخول...';
  const r = await doLogin(id, pw);
  btn.disabled = false; btn.textContent = 'تسجيل الدخول';
  if (r && r.ok) {
    const params = new URLSearchParams(location.search);
    location.href = params.get('returnTo') || '/market';
  } else if (r && r.error) {
    errBox.textContent = r.error; errBox.style.display = 'block';
  } else {
    errBox.textContent = 'خطأ في الاتصال'; errBox.style.display = 'block';
  }
}
</script>
</body>
</html>
