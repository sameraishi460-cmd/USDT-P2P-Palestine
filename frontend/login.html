<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e18">
<title>تسجيل الدخول — USDT P2P Palestine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="container" style="max-width:420px;padding-top:50px;">
  <div class="text-center" style="margin-bottom:30px;">
    <div style="font-size:48px;margin-bottom:8px;">🇵🇸</div>
    <h1 style="font-size:24px;font-weight:800;color:var(--primary);">USDT P2P Palestine</h1>
    <p class="muted" style="margin-top:4px;">تداول USDT آمن بالضمان</p>
  </div>

  <div id="errorBox" class="alert alert-error" style="display:none;"></div>

  <!-- Email/Username Login -->
  <form id="loginForm" class="card">
    <div class="form-group">
      <label>البريد الإلكتروني أو اسم المستخدم</label>
      <input id="identifier" type="text" required placeholder="email@example.com أو username" autocomplete="username">
    </div>
    <div class="form-group">
      <label>كلمة المرور</label>
      <input id="password" type="password" required placeholder="••••••" autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary" id="loginBtn">🔐 تسجيل الدخول</button>
  </form>

  <div class="text-center" style="margin:16px 0;">
    <a href="/register.html" class="text-sm text-dim">ليس لديك حساب؟ <b class="text-primary">سجّل الآن</b></a>
  </div>

  <!-- Telegram Login -->
  <button onclick="telegramLogin()" class="btn btn-ghost" id="tgBtn">
    <span style="font-size:18px;">✈️</span> تسجيل الدخول عبر Telegram
  </button>

  <!-- Admin Login -->
  <div class="text-center" style="margin-top:20px;">
    <a href="/admin_login.html" class="text-sm text-dim" style="opacity:0.5;">🔒 دخول الإدارة</a>
  </div>
</div>
<div id="toast"></div>
<script src="assets/app.js"></script>
<script>
if (window.Telegram && window.Telegram.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.BackButton.show(); Telegram.WebApp.BackButton.onClick(function() { location.href = '/'; }); }
var returnTo = new URLSearchParams(location.search).get('returnTo') || '/';

$('#loginForm').onsubmit = async function(e) {
  e.preventDefault();
  var btn = $('#loginBtn'); btn.disabled = true; btn.textContent = 'جاري الدخول...';
  var r = await post('/auth/login', { username: $('#identifier').value.trim(), password: $('#password').value });
  if (!r || !r.ok) { $('#errorBox').style.display = 'block'; $('#errorBox').textContent = (r && r.error) || 'خطأ في تسجيل الدخول'; btn.disabled = false; btn.textContent = '🔐 تسجيل الدخول'; return; }
  setCsrf(r.csrf_token); setUser({ username: $('#identifier').value.trim() }); location.href = returnTo;
};

async function telegramLogin() {
  if (!window.Telegram || !window.Telegram.WebApp || !window.Telegram.WebApp.initData) { toast('افتح من داخل Telegram'); return; }
  $('#tgBtn').disabled = true;
  var r = await post('/auth/telegram', { initData: Telegram.WebApp.initData });
  if (!r || !r.ok) { $('#errorBox').style.display = 'block'; $('#errorBox').textContent = (r && r.error) || 'فشل التحقق'; $('#tgBtn').disabled = false; return; }
  setCsrf(r.csrf_token); setUser({ username: r.username }); location.href = returnTo;
}
</script>
</body>
</html>
