<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء إعلان — USDT P2P Palestine</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<nav class="nav" id="nav"></nav>
<main class="main"><div class="container" style="max-width:480px">
  <h1 style="font-size:1.3rem;font-weight:700;margin-bottom:16px">إنشاء إعلان</h1>
  <div class="card" style="padding:20px">
    <div class="form-group">
      <label>نوع الإعلان</label>
      <div style="display:flex;gap:8px">
        <button class="btn btn-accent" id="typeBuy" onclick="setType('BUY')" style="flex:1">🛒 شراء</button>
        <button class="btn btn-outline" id="typeSell" onclick="setType('SELL')" style="flex:1">💰 بيع</button>
      </div>
      <input type="hidden" id="adType" value="BUY">
    </div>
    <div class="form-group"><label>العنوان</label><input type="text" class="form-input" id="adTitle" placeholder="مثال: شراء USDT بكاش"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="form-group"><label>السعر (₪)</label><input type="number" class="form-input" id="adPrice" step="0.01" min="0.01"></div>
      <div class="form-group"><label>الكمية (USDT)</label><input type="number" class="form-input" id="adAmount" step="0.01" min="1"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="form-group"><label>الحد الأدنى</label><input type="number" class="form-input" id="adMin" step="0.01" min="1"></div>
      <div class="form-group"><label>الحد الأقصى</label><input type="number" class="form-input" id="adMax" step="0.01"></div>
    </div>
    <div class="form-group">
      <label>طريقة الدفع</label>
      <select class="form-input" id="adPayment"><option value="cash">نقدي</option><option value="bank_transfer">تحويل بنكي</option><option value="wallet">محفظة</option></select>
    </div>
    <button class="btn btn-accent btn-block" onclick="submitAd()">نشر الإعلان</button>
  </div>
</div></main>
<div class="bottom-nav" id="bottomNav"></div>
</div>
<script src="/assets/app.js"></script>
<script>
function setType(t) { document.getElementById('adType').value = t; document.getElementById('typeBuy').className = t==='BUY'?'btn btn-accent':'btn btn-outline'; document.getElementById('typeSell').className = t==='SELL'?'btn btn-accent':'btn btn-outline'; }
async function submitAd() {
  if (!requireAuth()) return;
  const title = document.getElementById('adTitle').value.trim();
  const price = parseFloat(document.getElementById('adPrice').value);
  const amount = parseFloat(document.getElementById('adAmount').value);
  const min = parseFloat(document.getElementById('adMin').value);
  const max = parseFloat(document.getElementById('adMax').value) || null;
  const payment = document.getElementById('adPayment').value;
  const type = document.getElementById('adType').value;
  if (!title || !price || !amount || !min) { toast('أدخل جميع البيانات المطلوبة'); return; }
  const r = await api('/market/ads/create', { method: 'POST', body: { title, type, price: price, amount: amount, min_amount: min, max_amount: max, payment: payment } });
  if (r && r.ok) { toast('✅ تم نشر الإعلان'); location.href = '/market'; }
  else if (r && r.error) toast(r.error);
}
</script>
</body>
</html>
