<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>إنشاء إعلان — USDT P2P Palestine</title>
  <link rel="stylesheet" href="/assets/design-system.css">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="nav"></div>
  <div id="bottom-nav"></div>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">إنشاء إعلان جديد</h1>
    </div>

    <form id="ad-form" class="card" onsubmit="submitAd(event)">
      <div class="card-body">
        <div class="form-group">
          <label class="form-label">نوع الإعلان</label>
          <div class="type-toggle">
            <button type="button" class="type-btn active" data-type="SELL" onclick="setType(this)">بيع USDT</button>
            <button type="button" class="type-btn" data-type="BUY" onclick="setType(this)">شراء USDT</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">السعر (₪ لكل USDT)</label>
          <input type="number" step="0.01" min="0" class="form-input" id="price" placeholder="3.50" required>
        </div>

        <div class="form-group">
          <label class="form-label">المبلغ (USDT)</label>
          <input type="number" step="0.01" min="1" class="form-input" id="amount" placeholder="1000" required>
        </div>

        <div class="form-row">
          <div class="form-group" style="flex:1">
            <label class="form-label">الحد الأدنى</label>
            <input type="number" step="0.01" min="1" class="form-input" id="min_amount" placeholder="50" required>
          </div>
          <div class="form-group" style="flex:1">
            <label class="form-label">الحد الأقصى</label>
            <input type="number" step="0.01" min="1" class="form-input" id="max_amount" placeholder="500" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">طريقة الدفع</label>
          <select class="form-input" id="payment">
            <option value="bank_transfer">تحويل بنكي</option>
            <option value="paypal">PayPal</option>
            <option value="wise">Wise</option>
            <option value="cash">نقدي</option>
            <option value="crypto">عملات رقمية</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">التعليمات (اختياري)</label>
          <textarea class="form-input" id="instructions" rows="3" placeholder="تعليمات الدفع أو ملاحظات إضافية..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">نشر الإعلان</button>
      </div>
    </form>
  </main>

  <script src="/assets/app.js"></script>
  <script>
    let adType = 'SELL';
    
    function setType(btn) {
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      adType = btn.dataset.type;
    }

    async function submitAd(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'جاري النشر...';

      try {
        const res = await api('/ads', 'POST', {
          type: adType,
          price: parseFloat(document.getElementById('price').value),
          amount: parseFloat(document.getElementById('amount').value),
          min_amount: parseFloat(document.getElementById('min_amount').value),
          max_amount: parseFloat(document.getElementById('max_amount').value),
          payment: document.getElementById('payment').value,
          instructions: document.getElementById('instructions').value
        });
        
        if (res.error) {
          alert(res.error);
          btn.disabled = false;
          btn.textContent = 'نشر الإعلان';
          return;
        }
        
        alert('تم نشر الإعلان بنجاح!');
        window.location.href = '/market';
      } catch(err) {
        alert('خطأ في نشر الإعلان');
        btn.disabled = false;
        btn.textContent = 'نشر الإعلان';
      }
    }
  </script>
  <style>
    .type-toggle { display:flex; gap:.5rem; }
    .type-btn { flex:1; padding:.75rem; border:2px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-card); color:var(--text); font-size:.9rem; font-weight:600; cursor:pointer; transition:all .15s; }
    .type-btn.active { border-color:var(--primary); background:color-mix(in srgb, var(--primary) 10%, transparent); color:var(--primary); }
    .type-btn[data-type="SELL"].active { border-color:var(--error); background:color-mix(in srgb, var(--error) 10%, transparent); color:var(--error); }
    .form-group { margin-bottom:1rem; }
    .form-row { display:flex; gap:1rem; }
  </style>
</body>
</html>
