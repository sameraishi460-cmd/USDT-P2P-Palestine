<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>دخول الإدارة — USDT P2P Palestine</title>
  <link rel="stylesheet" href="/assets/design-system.css">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">🔐</div>
        <h1 class="auth-title">لوحة الإدارة</h1>
        <p class="auth-subtitle">دخول المشرفين فقط</p>
      </div>

      <form onsubmit="adminLogin(event)">
        <div class="form-group">
          <label class="form-label">اسم المستخدم</label>
          <input type="text" class="form-input" id="username" placeholder="Admin" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <input type="password" class="form-input" id="password" placeholder="••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">دخول</button>
        <p id="error" class="text-error" style="display:none;margin-top:.75rem"></p>
      </form>
    </div>
  </div>

  <script>
    async function adminLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('error');
      btn.disabled = true;
      btn.textContent = 'جاري الدخول...';
      errEl.style.display = 'none';

      try {
        const res = await fetch('/api/auth/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (data.error) {
          errEl.textContent = data.error;
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'دخول';
          return;
        }
        if (data.token) {
          localStorage.setItem('admin_token', data.token);
          window.location.href = '/admin';
        }
      } catch(err) {
        errEl.textContent = 'خطأ في الاتصال';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'دخول';
      }
    }
  </script>
</body>
</html>
