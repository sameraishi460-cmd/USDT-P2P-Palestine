<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>دخول الإدارة — USDT P2P Palestine</title>
  <link rel="stylesheet" href="/assets/design-system.css">
<link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>(function(){var t=localStorage.getItem("usp_theme")||"dark";if(t==="auto")t=window.matchMedia("(prefers-color-scheme:light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<!-- ===== Navbar ===== -->
<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-brand"><span>USDT</span> P2P</a>
    <div class="navbar-links">
      <a href="/login" class="btn-nav">دخول</a>
      <a href="/register" class="btn-nav-accent btn-nav">حساب جديد</a>
    </div>
  </div>
</nav>

<main>
<div class="container container-narrow" style="padding-top:var(--sp-8);">
  <div style="text-align:center;margin-bottom:var(--sp-6);">
    <div style="font-size:3rem;margin-bottom:var(--sp-3);">🔐</div>
    <h1 style="font-size:1.5rem;">لوحة الإدارة</h1>
    <p style="color:var(--text-muted);font-size:0.85rem;margin-top:var(--sp-2);">دخول المشرفين فقط</p>
  </div>

  <div id="errBox" class="flash flash-error" style="display:none;margin-bottom:var(--sp-4);"></div>

  <form class="card" onsubmit="event.preventDefault();doAdminLogin();">
    <div class="form-group">
      <label class="form-label">👤 اسم المستخدم</label>
      <input class="form-input" type="text" id="username" placeholder="Admin" required autocomplete="username" autofocus>
    </div>
    <div class="form-group">
      <label class="form-label">🔒 كلمة المرور</label>
      <input class="form-input" type="password" id="password" placeholder="••••••" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-success btn-block btn-lg" id="loginBtn">دخول الإدارة</button>
  </form>
</div>
</main>

<script src="/assets/app.js"></script>
<script>
async function doAdminLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errBox = document.getElementById('errBox');
  const btn = document.getElementById('loginBtn');

  if (!username || !password) {
    errBox.textContent = 'أدخل جميع البيانات';
    errBox.style.display = 'block';
    return;
  }

  errBox.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'جاري الدخول...';

  try {
    // Backend expects form body, not JSON
    const res = await fetch('/api/auth/admin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ username, password })
    });
    const data = await res.json();

    if (data.error) {
      errBox.textContent = data.error;
      errBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'دخول الإدارة';
      return;
    }

    if (data.ok) {
      // Session cookie is set by the backend — just redirect
      window.location.href = '/admin';
    }
  } catch(err) {
    errBox.textContent = 'خطأ في الاتصال';
    errBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'دخول الإدارة';
  }
}
</script>
</body>
</html>
