<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e18">
<title>دخول الإدارة — USDT P2P Palestine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="container" style="max-width:420px;padding-top:60px;">
  <div class="text-center" style="margin-bottom:30px;">
    <div style="font-size:48px;margin-bottom:8px;">🔒</div>
    <h1 style="font-size:20px;font-weight:800;color:var(--gold);">دخول الإدارة</h1>
    <p class="muted" style="margin-top:4px;">لوحة إدارة USDT P2P Palestine</p>
  </div>
  <div id="errorBox" class="alert alert-error" style="display:none;"></div>
  <form id="adminForm" class="card" style="border-color:rgba(255,215,0,.15);">
    <div class="form-group">
      <label>اسم المستخدم</label>
      <input id="username" type="text" required placeholder="admin">
    </div>
    <div class="form-group">
      <label>كلمة المرور</label>
      <input id="password" type="password" required placeholder="••••••">
    </div>
    <button type="submit" class="btn btn-warning" id="adminBtn">🔑 دخول الإدارة</button>
  </form>
  <div class="text-center" style="margin-top:16px;">
    <a href="/login.html" class="text-sm text-dim">← العودة لتسجيل الدخول</a>
  </div>
</div>
<div id="toast"></div>
<script src="assets/app.js"></script>
<script>
$('#adminForm').onsubmit = async function(e) {
  e.preventDefault();
  var btn = $('#adminBtn'); btn.disabled = true; btn.textContent = 'جاري الدخول...';
  var r = await post('/auth/admin-login', { username: $('#username').value.trim(), password: $('#password').value });
  if (!r || !r.ok) { $('#errorBox').style.display = 'block'; $('#errorBox').textContent = (r && r.error) || 'بيانات غير صحيحة'; btn.disabled = false; btn.textContent = '🔑 دخول الإدارة'; return; }
  setCsrf(r.csrf_token); setUser({ username: $('#username').value.trim(), isAdmin: true }); location.href = '/admin.html';
};
</script>
</body>
</html>
