<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <title>حساب جديد — USDT P2P Palestine</title>
  <link rel="stylesheet" href="/assets/design-system.css">
<link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>(function(){var t=localStorage.getItem("usp_theme")||"dark";if(t==="auto")t=window.matchMedia("(prefers-color-scheme:light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<nav class="navbar" id="nav"><div class="navbar-inner"><a href="/" class="navbar-brand"><span>USDT</span> P2P</a><div class="navbar-links"><a href="/login" class="btn-nav">دخول</a><a href="/register" class="btn-nav-accent btn-nav">حساب جديد</a></div></div></nav>
<main><div class="container container-narrow" style="padding-top:var(--sp-8);">
  <div style="text-align:center;margin-bottom:var(--sp-8);">
    <div style="width:56px;height:56px;border-radius:var(--radius-lg);background:var(--primary-dim);display:flex;align-items:center;justify-content:center;margin:0 auto var(--sp-4);font-size:1.5rem;color:var(--primary);font-weight:900;">◈</div>
    <h1 style="font-size:1.5rem;font-weight:800;">حساب جديد</h1>
    <p style="color:var(--text-muted);font-size:0.85rem;margin-top:var(--sp-2);">انضم إلى منصة USDT P2P Palestine</p>
  </div>
  <div id="errBox" class="flash flash-error" style="display:none;margin-bottom:var(--sp-4);"></div>
  <form class="card" onsubmit="event.preventDefault();doSubmit();">
    <div class="form-group"><label class="form-label">👤 اسم المستخدم</label><input class="form-input" type="text" id="username" placeholder="أدخل اسم المستخدم" required autocomplete="username"></div>
    <div class="form-group"><label class="form-label">📧 البريد الإلكتروني</label><input class="form-input" type="email" id="email" placeholder="email@example.com" required autocomplete="email"></div>
    <div class="form-group"><label class="form-label">🔒 كلمة المرور</label><input class="form-input" type="password" id="password" placeholder="6 أحرف على الأقل" required autocomplete="new-password"></div>
    <button type="submit" class="btn btn-primary btn-block btn-lg" id="regBtn">إنشاء حساب</button>
  </form>
  <div style="text-align:center;margin-top:var(--sp-6);"><p style="color:var(--text-muted);font-size:0.85rem;">لديك حساب بالفعل؟        <a href="/login" style="color:var(--primary);font-weight:600;">سجّل دخولك</a></p></div>
</div></main>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/assets/app.js"></script>
<script>
async function doSubmit() {
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errBox = document.getElementById('errBox');
  const btn = document.getElementById('regBtn');
  if (!username || !email || !password) { errBox.textContent = 'أدخل جميع البيانات'; errBox.style.display = 'block'; return; }
  if (password.length < 6) { errBox.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل'; errBox.style.display = 'block'; return; }
  errBox.style.display = 'none'; btn.disabled = true; btn.textContent = 'جاري الإنشاء...';
  const r = await doRegister(username, email, password);
  btn.disabled = false; btn.textContent = '🚀 إنشاء حساب';
  if (r && r.ok) { location.href = '/market'; }
  else if (r && r.error) { errBox.textContent = r.error; errBox.style.display = 'block'; }
  else { errBox.textContent = 'خطأ في الاتصال'; errBox.style.display = 'block'; }
}
</script>
</body>
</html>
