<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إنشاء حساب — USDT P2P Palestine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="container" style="max-width:420px;margin-top:40px;">
  <div style="text-align:center;margin-bottom:24px;">
    <h1 style="font-size:20px;font-weight:800;color:var(--primary);">🇵🇸 سجّل حساب جديد</h1>
    <p class="muted">اسم المستخدم يجب أن يطابق اسمك في Telegram</p>
  </div>
  <div id="errorBox" class="alert alert-error" style="display:none;"></div>
  <form id="regForm">
    <label>اسم المستخدم</label>
    <input id="username" type="text" required placeholder="اسم المستخدم">@</label>
    <label>الاسم الأول</label>
    <input id="first_name" type="text" placeholder="محمد">
    <label>رقم الهاتف</label>
    <input id="phone" type="tel" placeholder="+970 5XX XXX XXXX">
    <label>كلمة المرور</label>
    <input id="password" type="password" required minlength="6" placeholder="٦ أحرف على الأقل">
    <button type="submit" class="btn btn-primary" id="regBtn" style="margin-top:18px;">🚀 إنشاء الحساب</button>
  </form>
  <div style="text-align:center;margin:16px 0;"><a href="/login.html" style="color:var(--text-dim);font-size:14px;">لديك حساب؟ <b style="color:var(--primary);">سجّل الدخول</b></a></div>
</div>
<script src="assets/app.js"></script>
<script>
  if (window.Telegram?.WebApp) { Telegram.WebApp.ready(); }
  $('#regForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = $('#regBtn'); btn.disabled = true;
    const r = await post('/auth/register', {
      username: $('#username').value.trim(),
      password: $('#password').value,
      first_name: $('#first_name').value.trim(),
      phone: $('#phone').value.trim(),
    });
    if (!r?.ok) { $('#errorBox').style.display = 'block'; $('#errorBox').textContent = r?.error || 'خطأ'; btn.disabled = false; return; }
    setCsrf(r.csrf_token);
    setUser(r.user || { username: r.username, isAdmin: false });
    location.href = '/';
  };
</script>
</body>
</html>
