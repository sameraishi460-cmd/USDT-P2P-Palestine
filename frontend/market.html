<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <title>سوق USDT — USDT P2P Palestine</title>
  <link rel="stylesheet" href="/assets/design-system.css">
<link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<nav class="navbar" id="nav"><div class="navbar-inner"><a href="/" class="navbar-brand">🇵🇸 <span>USDT</span> P2P</a><div class="navbar-links"></div></div></nav>
<main><div class="container">
  <div class="page-header">
    <h2>💰 سوق USDT</h2>
    <p style="color:var(--text-muted);font-size:0.85rem;">السعر الحالي: <span style="color:var(--accent-light);font-weight:700;" id="livePrice">— ₪</span></p>
  </div>
  <div class="card" style="padding:var(--sp-3);margin-bottom:var(--sp-3);">
    <div style="display:flex;gap:var(--sp-2);flex-wrap:wrap;">
      <input type="text" id="searchInput" placeholder="🔍 بحث..." class="form-input" style="flex:2;min-width:150px;" oninput="filterAds()">
      <select id="typeFilter" class="form-input" style="flex:1;min-width:100px;" onchange="filterAds()">
        <option value="">الكل</option><option value="BUY">شراء</option><option value="SELL">بيع</option>
      </select>
      <select id="sortFilter" class="form-input" style="flex:1;min-width:100px;" onchange="filterAds()">
        <option value="newest">الأحدث</option><option value="price_low">أقل سعر</option><option value="price_high">أعلى سعر</option>
      </select>
    </div>
  </div>
  <div id="adsList"><div class="skeleton" style="height:120px;"></div></div>
  <div id="createAdBtn" style="display:none;margin-top:var(--sp-4);text-align:center;">
    <a href="/create_ad" class="btn btn-accent btn-block">+ إنشاء إعلان</a>
  </div>
</div></main>
<div class="bottom-nav" id="bottomNav"></div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/assets/app.js"></script>
<script>
let allAds = [];
async function load() {
  const [market, priceResp] = await Promise.all([api('/market'), api('/market/price')]);
  allAds = (market?.ads || []).filter(a => a.status === 'OPEN');
  const price = priceResp?.usdt_ils || priceResp?.price || 3.7;
  document.getElementById('livePrice').textContent = fmtNum(price, 2) + ' ₪';
  if (isLoggedIn()) document.getElementById('createAdBtn').style.display = 'block';
  filterAds();
}
function filterAds() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const type = document.getElementById('typeFilter').value;
  const sort = document.getElementById('sortFilter').value;
  let filtered = allAds;
  if (q) filtered = filtered.filter(a => (a.user||'').toLowerCase().includes(q) || (a.title||'').toLowerCase().includes(q) || (a.payment||'').toLowerCase().includes(q));
  if (type) filtered = filtered.filter(a => a.type === type);
  if (sort === 'price_low') filtered.sort((a,b) => a.price - b.price);
  else if (sort === 'price_high') filtered.sort((a,b) => b.price - a.price);
  else filtered.sort((a,b) => (b.id||0) - (a.id||0));
  const list = document.getElementById('adsList');
  if (!filtered.length) { list.innerHTML = '<div class="card" style="text-align:center;padding:var(--sp-8);"><div style="font-size:2rem;margin-bottom:var(--sp-2);">📭</div><div style="color:var(--text-muted);">لا توجد إعلانات</div></div>'; return; }
  list.innerHTML = filtered.map(a => `
    <div class="ad-card" style="cursor:pointer;" onclick="location.href='/trade?ad=${a.id}'">
      <div class="ad-card-seller">
        <div class="avatar avatar-sm">${(a.user||'?')[0].toUpperCase()}</div>
        <div style="flex:1;"><div style="font-weight:700;font-size:0.9rem;">${esc(a.user)}</div><div style="font-size:0.7rem;color:var(--text-muted);">${esc(a.payment || '')}</div></div>
        <span class="badge ${a.type==='BUY'?'badge-success':'badge-primary'}">${a.type==='BUY'?'شراء':'بيع'}</span>
      </div>
      <div style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:var(--sp-3);">📝 ${esc(a.title || a.type + ' USDT')}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-bottom:var(--sp-3);">
        <div style="background:var(--bg-input);border-radius:var(--radius-sm);padding:var(--sp-3);text-align:center;"><div style="font-size:0.7rem;color:var(--text-muted);">💰 الكمية</div><div style="font-weight:700;color:var(--accent-light);">${fmtNum(a.amount)} USDT</div></div>
        <div style="background:var(--bg-input);border-radius:var(--radius-sm);padding:var(--sp-3);text-align:center;"><div style="font-size:0.7rem;color:var(--text-muted);">💲 السعر</div><div style="font-weight:700;color:var(--text-primary);font-size:1.1rem;">${fmtNum(a.price)} ₪</div></div>
      </div>
      <div style="display:flex;gap:var(--sp-2);">
        <a href="/trade?ad=${a.id}" class="btn ${a.type==='BUY'?'btn-success':'btn-primary'} btn-block" onclick="event.stopPropagation();haptic('success')">${a.type==='BUY'?'🛒 شراء':'💰 بيع'} ${fmtNum(a.amount)} USDT</a>
      </div>
    </div>`).join('');
}
load();
</script>
</body>
</html>
