<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>السوق — USDT P2P Palestine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="navbar">
  <span class="logo">🛒 السوق</span>
  <div class="actions"><a href="/" style="font-size:22px;">🏠</a></div>
</div>
<div class="container">
  <!-- Filters -->
  <div class="card" style="display:flex;gap:8px;flex-wrap:wrap;">
    <select id="filterType" style="flex:1;min-width:100px;min-height:40px;">
      <option value="">الكل</option>
      <option value="SELL">بيع USDT (شراء)</option>
      <option value="BUY">شراء USDT (بيع)</option>
    </select>
    <input id="filterPayment" type="text" placeholder="طريقة الدفع" style="flex:1;min-width:100px;min-height:40px;">
    <input id="filterMin" type="number" placeholder="الحد الأدنى" style="width:80px;min-height:40px;">
    <input id="filterMax" type="number" placeholder="الحد الأقصى" style="width:80px;min-height:40px;">
    <button onclick="loadAds()" class="btn btn-primary" style="flex:0;min-width:80px;min-height:40px;font-size:13px;">بحث</button>
  </div>

  <div id="adsList" class="empty"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>

  <!-- Create Ad -->
  <a href="/create_ad.html" id="createAdBtn" class="btn btn-primary" style="display:none;margin-top:14px;">➕ إنشاء إعلان جديد</a>
</div>
<div class="bottom-nav">
  <a href="/"><span class="icon">🏠</span>الرئيسية</a>
  <a href="/market.html" id="nav-market" class="active"><span class="icon">🛒</span>السوق</a>
  <a href="/trades.html"><span class="icon">📄</span>الصفقات</a>
  <a href="/wallet.html"><span class="icon">💰</span>المحفظة</a>
  <a href="/profile.html"><span class="icon">👤</span>حسابي</a>
</div>
<div id="toast"></div>
<script src="assets/app.js"></script>
<script>
  highlightNav('nav-market');
  const params = new URLSearchParams(location.search);
  if (params.get('filter')) $('#filterType').value = params.get('filter');
  if (getUser()) $('#createAdBtn').style.display = 'flex';

  async function loadAds() {
    const type = $('#filterType').value;
    const payment = $('#filterPayment').value.trim();
    const min = $('#filterMin').value;
    const max = $('#filterMax').value;
    let q = '/market?limit=50';
    if (type) q += '&type=' + type;
    if (payment) q += '&payment=' + encodeURIComponent(payment);
    if (min) q += '&min_price=' + min;
    if (max) q += '&max_price=' + max;
    const r = await get(q);
    if (r?.ok && r.ads?.length) {
      $('#adsList').innerHTML = r.ads.map(a => `
        <a href="/trade.html?ad_id=${a.id}" class="row-item" style="text-decoration:none;">
          ${profileAvatar(a.user)}
          <div class="row-main">
            <div class="row-title">${escHtml(a.user)} ${a.user_verified ? '<span class="badge badge-verified" style="font-size:10px;">✓</span>' : ''}</div>
            <div class="row-sub">${escHtml(a.title || '')} · ${escHtml(a.payment_method || 'USDT')}<br>${Number(a.min_amount||0).toFixed(1)}-${Number(a.max_amount||0).toFixed(1)} USDT</div>
          </div>
          <div class="price">${Number(a.price).toFixed(2)}<br><span style="font-size:11px;color:var(--text-dim);">ILS</span></div>
        </a>
      `).join('');
    } else {
      $('#adsList').innerHTML = '<div class="empty"><div class="icon">📭</div>لا توجد إعلانات مطابقة</div>';
    }
  }
  loadAds();
</script>
</body>
</html>
