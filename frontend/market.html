<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e18">
<title>السوق — USDT P2P Palestine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="navbar">
  <a href="/" style="text-decoration:none;"><span class="logo">🇵🇸 USDT <span>P2P</span></span></a>
  <div class="actions">
    <span id="priceTag" class="price-tag" style="font-size:12px;">—</span>
  </div>
</div>

<div class="container">
  <h2 style="margin:16px 0 12px;">🛒 السوق</h2>

  <!-- Filters -->
  <div class="filter-bar" id="filters">
    <span class="filter-chip active" data-filter="all">الكل</span>
    <span class="filter-chip" data-filter="BUY">شراء</span>
    <span class="filter-chip" data-filter="SELL">بيع</span>
    <span class="filter-chip" data-filter="CASH">نقدي</span>
  </div>

  <!-- Sort -->
  <div class="flex-between mb-8">
    <span class="text-xs text-muted" id="countLabel">—</span>
    <select id="sortSelect" style="width:auto;padding:6px 30px 6px 12px;font-size:12px;">
      <option value="price">أفضل سعر</option>
      <option value="rating">أعلى تقييم</option>
      <option value="trades">أكثر صفقات</option>
    </select>
  </div>

  <!-- Ads -->
  <div id="adsList">
    <div class="spinner"></div>
  </div>

  <!-- Empty state -->
  <div id="emptyState" class="empty" style="display:none;">
    <div class="icon">🔍</div>
    <p>لا توجد إعلانات حالياً</p>
    <a href="/create_ad" class="btn btn-primary btn-sm mt-12" style="width:auto;display:inline-flex;">إنشاء إعلان</a>
  </div>
</div>

<div class="bottom-nav" id="bottomNav"></div>
<div id="toast"></div>
<script src="/assets/app.js"></script>
<script>
let currentFilter = 'all';
let allAds = [];

async function loadAds() {
  const list = $('#adsList');
  showLoading(list);

  const sort = $('#sortSelect').value;
  let url = '/market?sort=' + sort + '&limit=100';
  if (currentFilter === 'BUY') url += '&type=BUY';
  else if (currentFilter === 'SELL') url += '&type=SELL';

  const r = await get(url);
  if (!r || !r.ok) {
    showEmpty(list, '❌', 'خطأ في تحميل الإعلانات');
    return;
  }

  allAds = r.ads || [];
  renderAds();
}

function renderAds() {
  const list = $('#adsList');
  let filtered = allAds;

  if (currentFilter === 'CASH') {
    filtered = allAds.filter(function(a) { return (a.payment || '').toUpperCase().indexOf('CASH') >= 0; });
  }

  $('#countLabel').textContent = filtered.length + ' إعلان';

  if (filtered.length === 0) {
    list.innerHTML = '';
    $('#emptyState').style.display = '';
    return;
  }
  $('#emptyState').style.display = 'none';

  let html = '';
  filtered.forEach(function(ad) {
    const isBuy = ad.type === 'BUY';
    html += '<div class="ad-card">';
    html += '<div class="ad-card-header">';
    html += '<div>' + typeBadge(ad.type) + ' <span style="font-size:13px;color:var(--text-muted);">' + escHtml(ad.title) + '</span></div>';
    html += '</div>';
    html += '<div class="ad-card-price">' + formatNum(ad.price) + ' ILS</div>';
    html += '<div class="ad-card-info"><dl>';
    html += '<dt>المتاح</dt><dd>' + formatNum(ad.amount) + ' USDT</dd>';
    html += '<dt>الحد الأدنى</dt><dd>' + formatNum(ad.min_amount || 0) + '</dd>';
    html += '<dt>طريقة الدفع</dt><dd>' + escHtml(ad.payment || '—') + '</dd>';
    html += '<dt>الحد الأقصى</dt><dd>' + formatNum(ad.max_amount || ad.amount) + '</dd>';
    html += '</dl></div>';
    html += '<div class="ad-card-trader">';
    html += profileAvatar(ad.user);
    html += '<div><div class="font-bold text-sm">' + escHtml(ad.user) + '</div>';
    html += '<div class="text-xs text-muted">⭐ ' + formatNum(ad.rating || 5) + ' · ' + (ad.trades_count || 0) + ' صفقة</div></div>';
    html += '<div style="margin-right:auto;">' + verifiedBadge(ad.verified) + '</div>';
    html += '</div>';
    html += '<div class="ad-card-actions">';
    html += '<a href="/trade/create?ad=' + ad.id + '" class="btn ' + (isBuy ? 'btn-danger' : 'btn-success') + ' btn-sm">';
    html += isBuy ? '💰 بيع USDT' : '🛒 شراء USDT</a>';
    html += '</div>';
    html += '</div>';
  });

  list.innerHTML = html;
}

// Filter clicks
$$('#filters .filter-chip').forEach(function(chip) {
  chip.onclick = function() {
    $$('#filters .filter-chip').forEach(function(c) { c.classList.remove('active'); });
    chip.classList.add('active');
    currentFilter = chip.dataset.filter;
    renderAds();
  };
});

$('#sortSelect').onchange = loadAds;

// Init
buildNav('/market');
updateAuthUI();
getMarketPrice().then(function(p) {
  if (p) $('#priceTag').textContent = '1 USDT ≈ ' + formatNum(p.usdt_ils || 3.7);
});

// Check URL params for filter
const urlFilter = new URLSearchParams(location.search).get('type');
if (urlFilter === 'BUY' || urlFilter === 'SELL') {
  currentFilter = urlFilter;
  $$('#filters .filter-chip').forEach(function(c) {
    c.classList.toggle('active', c.dataset.filter === urlFilter);
  });
}

loadAds();
</script>
</body>
</html>
