<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السوق — USDT P2P Palestine</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<nav class="nav" id="nav"></nav>
<main class="main"><div class="container" style="max-width:640px">
  <div class="page-header" style="margin-bottom:16px">
    <h1 class="page-title">السوق</h1>
    <div id="priceInfo" class="page-subtitle" style="font-weight:600;color:var(--accent)"></div>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
    <select class="form-input" id="filterType" style="width:auto;flex:1;min-width:100px">
      <option value="">الكل</option><option value="BUY">شراء</option><option value="SELL">بيع</option>
    </select>
    <input type="text" class="form-input" id="filterSearch" placeholder="بحث..." style="flex:2;min-width:120px">
    <a href="/create_ad" class="btn btn-accent btn-sm" style="white-space:nowrap">+ إعلان</a>
  </div>
  <div id="adsList"><div class="card"><div class="spinner"></div></div></div>
</div></main>
<div class="bottom-nav" id="bottomNav"></div>
</div>
<script src="/assets/app.js"></script>
<script>
let allAds = [];
async function loadAds() {
  const r = await api('/market');
  if (!r || !r.ok) { document.getElementById('adsList').innerHTML = '<div class="card text-center" style="padding:32px;color:var(--text-muted)">تعذر تحميل الإعلانات</div>'; return; }
  allAds = r.ads || [];
  document.getElementById('priceInfo').textContent = r.price ? fmtNum(r.price.usdt_ils) + ' ₪ / USDT' : '';
  filterAds();
}
function filterAds() {
  const type = document.getElementById('filterType').value;
  const q = document.getElementById('filterSearch').value.trim().toLowerCase();
  let filtered = allAds;
  if (type) filtered = filtered.filter(a => a.type === type);
  if (q) filtered = filtered.filter(a => (a.user||'').toLowerCase().includes(q) || (a.title||'').toLowerCase().includes(q));
  const el = document.getElementById('adsList');
  if (!filtered.length) { el.innerHTML = '<div class="card text-center" style="padding:32px;color:var(--text-muted)">لا توجد إعلانات</div>'; return; }
  el.innerHTML = filtered.map(a => `
    <div class="card" style="margin-bottom:12px;padding:16px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
        <div>
          ${typeBadge(a.type)}
          <span style="font-size:.8rem;color:var(--text-muted);margin-right:8px">${esc(a.title||'')}</span>
        </div>
        <div style="text-align:left">
          <div style="font-size:1.3rem;font-weight:800;color:var(--accent)">${fmtNum(a.price)} ₪</div>
          <div style="font-size:.75rem;color:var(--text-muted)">لكل USDT</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:.8rem;color:var(--text-secondary);margin:8px 0;padding:8px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)">
        <div><span style="color:var(--text-muted)">الكمية</span><br><strong>${fmtNum(a.amount)}</strong></div>
        <div><span style="color:var(--text-muted)">الحد الأدنى</span><br><strong>${fmtNum(a.min_amount)}</strong></div>
        <div><span style="color:var(--text-muted)">طريقة الدفع</span><br><strong>${esc(a.payment||'')}</strong></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="display:flex;align-items:center;gap:6px">
          ${profileAvatar(a.user, '')}
          <div>
            <div style="font-size:.85rem;font-weight:600">${esc(a.user)}</div>
            <div style="font-size:.7rem;color:var(--text-muted)">⭐ ${fmtNum(a.rating,1)} · ${a.trades_count||0} صفقة</div>
          </div>
          ${a.verified ? verifiedBadge(1) : ''}
        </div>
        <a href="/market?buy=${a.id}" class="btn btn-${a.type==='BUY'?'accent':'outline'} btn-sm">${a.type==='BUY'?'شراء':'بيع'} USDT</a>
      </div>
    </div>`).join('');
}
document.getElementById('filterType').addEventListener('change', filterAds);
document.getElementById('filterSearch').addEventListener('input', filterAds);
loadAds();
</script>
</body>
</html>
