<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>USDT P2P Palestine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="navbar">
  <span class="logo">🇵🇸 USDT P2P</span>
  <div class="actions">
    <span id="notifBell" style="cursor:pointer;" onclick="location.href='/notifications.html'">🔔<span id="notifCount" style="display:none;background:var(--danger);border-radius:50%;padding:1px 5px;font-size:10px;color:#fff;position:relative;top:-6px;right:4px;"></span></span>
    <a href="/profile.html" style="font-size:22px;">👤</a>
  </div>
</div>
<div class="container">
  <!-- Price Card -->
  <div class="card" style="background:linear-gradient(135deg,#0b2b21,#0b1a14);text-align:center;">
    <div class="muted" style="margin-bottom:4px;">سعر USDT اليوم</div>
    <div class="big-num" id="priceValue" style="color:var(--primary);">—</div>
    <div class="muted">ILS / 1 USDT</div>
  </div>

  <!-- Quick Actions -->
  <div class="grid-2">
    <a href="/market.html?filter=SELL" class="btn btn-primary" style="background:linear-gradient(135deg,#059669,#047857);">🛒 شراء USDT</a>
    <a href="/market.html?filter=BUY" class="btn btn-outline" style="border-color:var(--info);color:var(--info);">💰 بيع USDT</a>
  </div>

  <!-- Balance Card (auth only) -->
  <div id="balanceCard" class="card" style="display:none;margin-top:14px;">
    <div class="grid-2">
      <div><div class="kpi-label">رصيد المتاح</div><div class="big-num" id="balAvail" style="font-size:20px;">0</div></div>
      <div><div class="kpi-label">رصيد مقفل</div><div class="big-num" id="balLocked" style="font-size:20px;color:var(--warning);">0</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <a href="/wallet.html" class="btn btn-outline" style="flex:1;min-height:40px;font-size:13px;">💰 المحفظة</a>
      <a href="/wallet.html#deposit" class="btn btn-primary" style="flex:1;min-height:40px;font-size:13px;">📥 إيداع</a>
      <a href="/wallet.html#withdraw" class="btn btn-outline" style="flex:1;min-height:40px;font-size:13px;border-color:var(--warning);color:var(--warning);">📤 سحب</a>
    </div>
  </div>

  <!-- Open Ads -->
  <div class="section">
    <div class="card-title">🛒 أحدث الإعلانات</div>
    <div id="adsList" class="empty"><div class="icon">🔍</div>جاري تحميل الإعلانات...</div>
  </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <a href="/" id="nav-home" class="active"><span class="icon">🏠</span>الرئيسية</a>
  <a href="/market.html" id="nav-market"><span class="icon">🛒</span>السوق</a>
  <a href="/trades.html" id="nav-trades"><span class="icon">📄</span>الصفقات</a>
  <a href="/wallet.html" id="nav-wallet"><span class="icon">💰</span>المحفظة</a>
  <a href="/profile.html" id="nav-profile"><span class="icon">👤</span>حسابي</a>
</div>
<div id="toast"></div>
<script src="assets/app.js"></script>
<script>
  (async function() {
    highlightNav('nav-home');
    // Load price
    const price = await getMarketPrice();
    if (price) $('#priceValue').textContent = Number(price.usdt_ils).toFixed(2);

    // Balance (auth only)
    const user = getUser();
    if (user) {
      $('#balanceCard').style.display = 'block';
      const w = await get('/wallet');
      if (w?.ok) { $('#balAvail').textContent = w.balance.toFixed(2); $('#balLocked').textContent = w.locked.toFixed(2); }
      const n = await get('/notifications');
      if (n?.ok && n.unread > 0) { $('#notifCount').style.display = 'inline'; $('#notifCount').textContent = n.unread; }
    }

    // Ads
    const ads = await get('/market?type=SELL&limit=20');
    if (ads?.ok && ads.ads?.length) {
      $('#adsList').innerHTML = ads.ads.map(a => `
        <a href="/trade.html?ad_id=${a.id}" class="row-item" style="text-decoration:none;">
          ${profileAvatar(a.user)}
          <div class="row-main">
            <div class="row-title">${escHtml(a.user)} ${a.user_verified ? '<span class="badge badge-verified" style="font-size:10px;">✓</span>' : ''}</div>
            <div class="row-sub">${escHtml(a.payment_method || 'USDT')} · ${Number(a.min_amount||0).toFixed(1)}-${Number(a.max_amount||0).toFixed(1)} USDT</div>
          </div>
          <div class="price">${Number(a.price).toFixed(2)} ILS</div>
        </a>
      `).join('');
    } else {
      $('#adsList').innerHTML = '<div class="empty"><div class="icon">📭</div>لا توجد إعلانات مفتوحة حالياً</div>';
    }
  })();
</script>
</body>
</html>
