<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإشعارات — USDT P2P Palestine</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<nav class="nav" id="nav"></nav>
<main class="main"><div class="container" style="max-width:640px" id="app">
  <div class="flex-between" style="margin-bottom:16px">
    <h1 style="font-size:1.3rem;font-weight:800">🔔 الإشعارات</h1>
    <button class="btn btn-ghost btn-sm" id="markAllBtn" onclick="markAllRead()" style="display:none">تحديد الكل كمقروء</button>
  </div>
  <div id="notifList"><div class="spinner"></div></div>
</div></main>
<div class="bottom-nav" id="bottomNav"></div>
</div>
<script src="/assets/app.js"></script>
<script>
async function load() {
  if (!requireAuth()) return;
  const resp = await api('/notifications');
  const notifs = resp?.notifications || [];
  const unread = resp?.unread || 0;
  if (unread > 0) document.getElementById('markAllBtn').style.display = 'block';
  const list = document.getElementById('notifList');
  if (!notifs.length) { list.innerHTML = '<div class="card"><div class="empty"><div class="empty-icon">🔔</div><div class="empty-title">لا توجد إشعارات</div></div></div>'; return; }
  list.innerHTML = notifs.map(n => `
    <div class="notif-item ${n.seen ? '' : 'unread'}" style="padding:12px 0;border-bottom:1px solid var(--border)">
      <div style="font-weight:600;font-size:.9rem;margin-bottom:2px">${esc(n.title)}</div>
      <div style="font-size:.8rem;color:var(--text-secondary)">${esc(n.message)}</div>
      <div style="font-size:.7rem;color:var(--text-muted);margin-top:4px">${fmtDate(n.created)}</div>
    </div>`).join('');
}
async function markAllRead() {
  await api('/notifications/mark-read', { method: 'POST' });
  toast('تم تحديد الكل كمقروء');
  load();
}
load();
</script>
</body>
</html>
