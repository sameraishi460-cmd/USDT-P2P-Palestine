<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e18">
<title>الإشعارات — USDT P2P Palestine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="navbar">
  <span class="logo">🔔 الإشعارات</span>
  <div class="actions">
    <button onclick="markAllRead()" class="btn btn-ghost btn-sm" style="min-height:32px;">✓ قراءة الكل</button>
    <a href="/" style="font-size:20px;">🏠</a>
  </div>
</div>
<div class="container">
  <div id="notifList"><div class="skeleton"></div><div class="skeleton"></div></div>
</div>
<div id="toast"></div>
<script src="assets/app.js"></script>
<script>
if (!requireAuth('/notifications.html')) throw new Error('auth');
(async function() {
  const r = await get('/notifications');
  if (r?.ok && r.notifications?.length) {
    $('#notifList').innerHTML = r.notifications.map(n => `
      <div class="list-item" style="opacity:${n.seen ? '.6' : '1'};cursor:default;">
        <div style="font-size:22px;">${n.seen ? '📩' : '🔔'}</div>
        <div class="list-main">
          <div class="list-title">${escHtml(n.title)}</div>
          <div class="list-sub">${escHtml(n.message)}</div>
          <div class="text-xs text-dim" style="margin-top:4px;">${formatDate(n.created)}</div>
        </div>
      </div>
    `).join('');
  } else {
    showEmpty($('#notifList'), '🔔', 'لا إشعارات جديدة');
  }
})();
async function markAllRead() { await post('/notifications/mark-read'); toast('✅'); location.reload(); }
</script>
</body>
</html>
