<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07090D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>الإشعارات — USDT P2P Palestine</title>
  <link rel="stylesheet" href="/assets/design-system.css">
  <link rel="manifest" href="/manifest.json">
  <script>(function(){var t=localStorage.getItem("usp_theme")||"dark";if(t==="auto")t=window.matchMedia("(prefers-color-scheme:light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t);})();</script>
  <style>
    .notif-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:var(--sp-3);margin-bottom:var(--sp-2);display:flex;gap:var(--sp-3);transition:background 0.15s;}
    .notif-card:hover{background:var(--bg-card-hover);}
    .notif-card.unread{border-right:3px solid var(--primary);}
    .notif-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
    .notif-icon.trade{background:rgba(108,99,255,0.10);color:var(--purple);}
    .notif-icon.price{background:var(--primary-dim);color:var(--primary);}
    .notif-icon.security{background:rgba(255,92,108,0.10);color:var(--danger);}
    .notif-icon.kyc{background:var(--warning-dim);color:var(--warning);}
    .notif-icon.system{background:rgba(91,141,239,0.10);color:#5B8DEF;}
    .notif-content{flex:1;min-width:0;}
    .notif-title{font-size:0.85rem;font-weight:700;color:var(--text-primary);}
    .notif-message{font-size:0.75rem;color:var(--text-secondary);margin-top:3px;line-height:1.4;}
    .notif-time{font-size:0.65rem;color:var(--text-muted);margin-top:4px;}
  </style>
</head>
<body>
  <nav class="navbar" id="nav"></nav>
  <main>
    <div class="container page-pad">
      <div class="flex-between mb-4">
        <h2 style="font-size:1.1rem;font-weight:800;">الإشعارات</h2>
        <button class="btn btn-ghost btn-sm text-xs" onclick="markAllRead()" id="markAllBtn" style="display:none;">تعيين الكل كمقروء</button>
      </div>

      <div id="notifList">
        <div class="card-section"><div class="spinner"></div></div>
      </div>

      <div id="emptyState" style="display:none;">
        <div class="empty-state">
          <div class="empty-state-icon">🔔</div>
          <div class="empty-state-text">لا توجد إشعارات</div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/assets/app.js"></script>
  <script>
  (async function() {
    const user = await requireAuth();
    if (!user) return;

    let notifications = [];
    try {
      const res = await api('/notifications');
      notifications = res?.notifications || [];
    } catch {}

    function getNotifIcon(title) {
      if (!title) return 'system';
      if (title.includes('صفقة') || title.includes('trade')) return 'trade';
      if (title.includes('سعر') || title.includes('price') || title.includes('تنبيه')) return 'price';
      if (title.includes('أمان') || title.includes('security') || title.includes('جلس')) return 'security';
      if (title.includes('KYC') || title.includes('تحقق')) return 'kyc';
      return 'system';
    }

    function getNotifEmoji(title) {
      if (!title) return '🔔';
      if (title.includes('صفقة')) return '🤝';
      if (title.includes('سعر') || title.includes('تنبيه')) return '📈';
      if (title.includes('أمان') || title.includes('جلس')) return '🔐';
      if (title.includes('KYC') || title.includes('تحقق')) return '🪪';
      if (title.includes('إيداع')) return '💵';
      if (title.includes('سحب')) return '💸';
      return '🔔';
    }

    function render() {
      const list = document.getElementById('notifList');
      const empty = document.getElementById('emptyState');
      const markBtn = document.getElementById('markAllBtn');

      if (!notifications.length) {
        list.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      const hasUnread = notifications.some(n => !n.seen);
      if (hasUnread) markBtn.style.display = 'inline-flex';

      list.innerHTML = notifications.map(n => `
        <div class="notif-card ${n.seen ? '' : 'unread'}" onclick="markRead(${n.id}, this)">
          <div class="notif-icon ${getNotifIcon(n.title)}">${getNotifEmoji(n.title)}</div>
          <div class="notif-content">
            <div class="notif-title">${esc(n.title || 'إشعار')}</div>
            <div class="notif-message">${esc(n.message || '')}</div>
            <div class="notif-time">${n.created || ''}</div>
          </div>
        </div>
      `).join('');
    }

    window.markRead = async function(id, el) {
      el.classList.remove('unread');
      try { await api('/notifications/' + id + '/read', 'POST'); } catch {}
    };

    window.markAllRead = async function() {
      document.querySelectorAll('.notif-card.unread').forEach(c => c.classList.remove('unread'));
      try { await api('/notifications/read-all', 'POST'); } catch {}
      document.getElementById('markAllBtn').style.display = 'none';
    };

    render();
  })();
  </script>
</body>
</html>
