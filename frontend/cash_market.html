<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e18">
<title>سوق الكاش — USDT P2P Palestine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>(function(){var t=localStorage.getItem("usp_theme")||"dark";if(t==="auto")t=window.matchMedia("(prefers-color-scheme:light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<div class="navbar">
  <span class="logo">💵 سوق الكاش</span>
  <div class="actions">
    <a href="/create_cash_ad.html" class="btn btn-primary btn-sm" style="min-height:34px;">➕</a>
    <a href="/" style="font-size:20px;">🏠</a>
  </div>
</div>
<div class="container">
  <div class="trust-banner" style="margin-bottom:14px;font-size:12px;">
    💵 صفقات كاش شخصية — التقاء في مكان عام · ا겄َ م.safe
  </div>
  <div id="adsList"><div class="skeleton"></div><div class="skeleton"></div></div>
</div>
<div class="bottom-nav">
  <a href="/"><span class="icon">🏠</span>الرئيسية</a>
  <a href="/market.html"><span class="icon">🛒</span>USDT</a>
  <a href="/cash_market.html" class="active"><span class="icon">💵</span>كاش</a>
  <a href="/wallet.html"><span class="icon">💰</span>المحفظة</a>
  <a href="/profile.html"><span class="icon">👤</span>حسابي</a>
</div>
<div id="toast"></div>
<script src="assets/app.js"></script>
<script>
(async function() {
  const r = await get('/cash/market');
  if (r?.ok && r.ads?.length) {
    $('#adsList').innerHTML = r.ads.map(a => `
      <a href="/cash_ad.html?id=${a.id}" class="list-item" style="text-decoration:none;">
        ${profileAvatar(a.user)}
        <div class="list-main">
          <div class="list-title">${escHtml(a.user)} ${verifiedBadge(a.verified)} ${statusBadge(a.status)}</div>
          <div class="list-sub">${escHtml(a.city || '')} · ${escHtml(a.payment_method || 'كاش')}<br>${formatNum(a.amount, 1)} USDT · ${formatNum(a.price)} ILS</div>
        </div>
        <div class="list-right">
          <div class="price-big">${formatNum(a.price)} ILS</div>
          <div class="text-xs text-dim">${a.type === 'SELL' ? 'بيع' : 'شراء'}</div>
        </div>
      </a>
    `).join('');
  } else {
    showEmpty($('#adsList'), '💵', 'لا توجد صفقات كاش حالياً');
  }
})();
</script>
</body>
</html>
