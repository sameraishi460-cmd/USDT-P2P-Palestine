<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفقة — USDT P2P Palestine</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<nav class="nav" id="nav"></nav>
<main class="main"><div class="container" style="max-width:640px" id="app"><div class="card" style="padding:32px;text-align:center"><div class="spinner"></div></div></div></main>
<div class="bottom-nav" id="bottomNav"></div>
</div>
<script src="/assets/app.js"></script>
<script>
const tid = new URLSearchParams(location.search).get('id');
let trade = null, msgs = [], me = null;

async function load() {
  if (!requireAuth()) return;
  me = currentUser();
  const r = await api('/trades/' + tid);
  if (!r || !r.ok) { document.getElementById('app').innerHTML = '<div class="card" style="padding:32px;text-align:center;color:var(--text-muted)">الصفقة غير موجودة</div>'; return; }
  trade = r.trade; msgs = r.messages || [];
  render();
}

function render() {
  const t = trade; if (!t) return;
  const isBuyer = t.buyer === me.username;
  const isSeller = t.seller === me.username;
  const other = isBuyer ? t.seller : t.buyer;
  const role = isBuyer ? 'المشتري' : 'البائع';
  const canPay = isBuyer && t.status === 'PENDING';
  const canRelease = isSeller && t.status === 'PAYMENT_SENT';
  const canCancel = ['PENDING','PAYMENT_SENT'].includes(t.status);
  const canDispute = ['PENDING','PAYMENT_SENT'].includes(t.status);

  document.getElementById('app').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h1 style="font-size:1.1rem;font-weight:700">الصفقة #${t.id}</h1>
      ${statusBadge(t.status)}
    </div>
    <div class="card" style="padding:16px;margin-bottom:12px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:.85rem">
        <div><span style="color:var(--text-muted)">المبلغ</span><br><strong>${fmtNum(t.amount)} USDT</strong></div>
        <div><span style="color:var(--text-muted)">السعر</span><br><strong>${fmtNum(t.price)} ₪</strong></div>
        <div><span style="color:var(--text-muted)">الإجمالي</span><br><strong>${fmtNum(t.amount * t.price)} ₪</strong></div>
        <div><span style="color:var(--text-muted)">الطرف الآخر</span><br><strong>${esc(other)} (${isBuyer?'بائع':'مشتري'})</strong></div>
      </div>
    </div>
    ${t.status === 'COMPLETED' ? `<div class="card" style="padding:16px;margin-bottom:12px;background:rgba(34,197,94,.1)">
      <div style="text-align:center;font-weight:600;color:var(--accent)">✅ الصفقة مكتملة</div>
      <div style="text-align:center;margin-top:8px"><a href="/reviews.html?trade=${t.id}" class="btn btn-accent btn-sm">تقييم الطرف الآخر</a></div>
    </div>` : ''}
    <div class="card" style="padding:0;margin-bottom:12px;overflow:hidden">
      <div style="padding:12px 16px;background:var(--bg-elevated);font-weight:600;font-size:.9rem;border-bottom:1px solid var(--border)">💬 المحادثة</div>
      <div id="chatBox" style="max-height:300px;overflow-y:auto;padding:12px">
        ${msgs.length ? msgs.map(m => `<div style="margin-bottom:8px;max-width:80%;${m.sender===me.username?'margin-right:auto;text-align:right':'margin-left:auto'}">
          <div style="font-size:.7rem;color:var(--text-muted)">${esc(m.sender)} · ${fmtDate(m.created)}</div>
          <div style="padding:8px 12px;border-radius:12px;font-size:.85rem;background:${m.sender===me.username?'var(--accent);color:#fff':'var(--bg-elevated)'}">${esc(m.text)}</div>
        </div>`).join('') : '<div style="text-align:center;color:var(--text-muted);padding:16px">لا توجد رسائل بعد</div>'}
      </div>
      <div style="padding:8px 12px;border-top:1px solid var(--border);display:flex;gap:8px">
        <input type="text" class="form-input" id="msgInput" placeholder="اكتب رسالة..." style="flex:1">
        <button class="btn btn-accent btn-sm" onclick="sendMsg()">إرسال</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${canPay ? '<button class="btn btn-accent" onclick="confirmPayment()">💳 تم الدفع</button>' : ''}
      ${canRelease ? '<button class="btn btn-accent" onclick="releaseFunds()">🔓 تحرير USDT</button>' : ''}
      ${canDispute ? '<button class="btn btn-outline" style="color:var(--error);border-color:var(--error)" onclick="openDispute()">⚠️ فتح نزاع</button>' : ''}
      ${canCancel ? '<button class="btn btn-outline" style="color:var(--text-muted)" onclick="cancelTrade()">إلغاء</button>' : ''}
    </div>`;
  document.getElementById('chatBox').scrollTop = 9999;
}

async function sendMsg() {
  const inp = document.getElementById('msgInput');
  const text = inp.value.trim(); if (!text) return;
  inp.value = '';
  const r = await api('/trades/' + tid + '/message', { method: 'POST', body: { text } });
  if (r && r.ok) { msgs.push({ sender: me.username, text, created: new Date().toISOString() }); render(); }
  else if (r && r.error) toast(r.error);
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && document.activeElement?.id === 'msgInput') sendMsg(); });

async function confirmPayment() {
  if (!confirm('هل أنت متأكد من تأكيد الدفع؟')) return;
  const r = await api('/trades/' + tid + '/confirm-payment', { method: 'POST' });
  if (r && r.ok) { toast('✅ تم تأكيد الدفع'); load(); } else if (r && r.error) toast(r.error);
}
async function releaseFunds() {
  if (!confirm('هل أنت متأكد من تحرير USDT؟')) return;
  const r = await api('/trades/' + tid + '/seller-confirm', { method: 'POST' });
  if (r && r.ok) { toast('✅ تم تحرير USDT'); load(); } else if (r && r.error) toast(r.error);
}
async function cancelTrade() {
  if (!confirm('هل تريد إلغاء الصفقة؟')) return;
  const r = await api('/trades/' + tid + '/cancel', { method: 'POST' });
  if (r && r.ok) { toast('تم إلغاء الصفقة'); load(); } else if (r && r.error) toast(r.error);
}
async function openDispute() {
  const reason = prompt('سبب النزاع (10 أحرف على الأقل):');
  if (!reason || reason.length < 10) { toast('سبب النزاع مطلوب'); return; }
  const r = await api('/trades/' + tid + '/dispute', { method: 'POST', body: { reason } });
  if (r && r.ok) { toast('⚠️ تم فتح النزاع'); load(); } else if (r && r.error) toast(r.error);
}
load();
</script>
</body>
</html>
