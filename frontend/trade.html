<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تفاصيل الصفقة — USDT P2P Palestine</title>
  <link rel="stylesheet" href="/assets/design-system.css">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <div id="nav"></div>
  <div id="bottom-nav"></div>

  <main class="main-content">
    <div id="loading" class="loading-spinner">
      <div class="spinner"></div>
      <p>جاري التحميل...</p>
    </div>
    <div id="trade-content" style="display:none">
      <div id="trade-header"></div>
      <div id="trade-timeline"></div>
      <div id="trade-info"></div>
      <div id="trade-actions"></div>
      <div id="trade-chat" class="trade-chat-section"></div>
    </div>
  </main>

  <script src="/assets/app.js"></script>
  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const tradeId = params.get('id');
      if (!tradeId) { window.location.href = '/trades'; return; }
      
      const user = await requireAuth();
      if (!user) return;
      const me = user.username;
      
      try {
        const res = await api(`/trades/${tradeId}`);
        if (res.error) { window.location.href = '/trades'; return; }
        const t = res.trade;
        const isBuyer = t.buyer === me;
        const isSeller = t.seller === me;
        if (!isBuyer && !isSeller && me !== 'admin') { window.location.href = '/trades'; return; }

        const statusLabels = {
          'OPEN': 'الصفقة مفتوحة', 'PAYMENT_SENT': 'تم إرسال الدفع', 'PAYMENT_CONFIRMED': 'تم تأكيد الدفع',
          'RELEASE_PENDING': 'بانتظار التحرير', 'COMPLETED': 'مكتملة', 'CANCELLED': 'ملغاة', 'DISPUTED': 'نزاع'
        };
        const statusColors = {
          'OPEN': 'badge-neutral', 'PAYMENT_SENT': 'badge-warning', 'PAYMENT_CONFIRMED': 'badge-success',
          'RELEASE_PENDING': 'badge-info', 'COMPLETED': 'badge-success', 'CANCELLED': 'badge-error', 'DISPUTED': 'badge-error'
        };
        const steps = ['OPEN','PAYMENT_SENT','PAYMENT_CONFIRMED','RELEASE_PENDING','COMPLETED'];
        const stepLabels = ['إنشاء الصفقة','الدفع','تأكيد الدفع','تحرير USDT','مكتملة'];
        const currentStep = steps.indexOf(t.status);

        document.getElementById('trade-header').innerHTML = `
          <div class="page-header">
            <h1 class="page-title">الصفقة #${t.id}</h1>
            <span class="badge ${statusColors[t.status] || 'badge-neutral'}">${statusLabels[t.status] || t.status}</span>
          </div>`;

        document.getElementById('trade-timeline').innerHTML = `
          <div class="timeline">
            ${steps.map((s, i) => `
              <div class="timeline-step ${i <= currentStep ? 'active' : ''} ${i < currentStep ? 'completed' : ''}">
                <div class="timeline-dot">${i < currentStep ? '✓' : i+1}</div>
                <div class="timeline-label">${stepLabels[i]}</div>
              </div>
            `).join('')}
          </div>`;

        const counterparty = isBuyer ? t.seller : t.buyer;
        const total = (parseFloat(t.amount) * parseFloat(t.price)).toFixed(2);

        document.getElementById('trade-info').innerHTML = `
          <div class="card">
            <div class="card-header"><h3>تفاصيل الصفقة</h3></div>
            <div class="detail-grid">
              <div class="detail-item"><span class="detail-label">المبلغ</span><span class="detail-value">${t.amount} USDT</span></div>
              <div class="detail-item"><span class="detail-label">السعر</span><span class="detail-value">${t.price} ₪</span></div>
              <div class="detail-item"><span class="detail-label">الإجمالي</span><span class="detail-value">${total} ₪</span></div>
              <div class="detail-item"><span class="detail-label">طريقة الدفع</span><span class="detail-value">${t.payment_method || '—'}</span></div>
              <div class="detail-item"><span class="detail-label">${isBuyer ? 'البائع' : 'المشتري'}</span><span class="detail-value"><a href="/trader?u=${counterparty}">${counterparty}</a></span></div>
              <div class="detail-item"><span class="detail-label">دورك</span><span class="detail-value">${isBuyer ? 'مشتري 🟦' : 'بائع 🟩'}</span></div>
            </div>
          </div>`;

        let actionsHtml = '';
        if (t.status === 'OPEN' && isSeller) {
          actionsHtml += `<button class="btn btn-error" onclick="cancelTrade()">إلغاء الصفقة</button>`;
        }
        if (t.status === 'OPEN' && isBuyer) {
          actionsHtml += `<button class="btn btn-primary" onclick="confirmPayment()">✅ تم الدفع</button>`;
          actionsHtml += `<button class="btn btn-error" onclick="cancelTrade()">إلغاء</button>`;
        }
        if (t.status === 'PAYMENT_SENT' && isSeller) {
          actionsHtml += `<button class="btn btn-success" onclick="sellerConfirm()">💰 تأكيد الدفع وتحرير USDT</button>`;
          actionsHtml += `<button class="btn btn-warning" onclick="openDispute()">⚠️ نزاع</button>`;
        }
        if (t.status === 'PAYMENT_CONFIRMED' && isSeller) {
          actionsHtml += `<button class="btn btn-success" onclick="sellerConfirm()">💰 تحرير USDT</button>`;
        }
        if (t.status === 'COMPLETED' && !t.reviewed_by_buyer && isBuyer) {
          actionsHtml += renderReviewForm('buyer');
        }
        if (t.status === 'COMPLETED' && !t.reviewed_by_seller && isSeller) {
          actionsHtml += renderReviewForm('seller');
        }
        document.getElementById('trade-actions').innerHTML = actionsHtml ? `<div class="card"><div class="card-body flex gap-sm">${actionsHtml}</div></div>` : '';

        function renderReviewForm(role) {
          return `<div class="card" id="review-form">
            <div class="card-header"><h3>تقييم ${role === 'buyer' ? 'البائع' : 'المشتري'}</h3></div>
            <div class="card-body">
              <div class="star-rating" id="stars">
                ${[1,2,3,4,5].map(n => `<span class="star" onclick="setRating(${n})" data-value="${n}">★</span>`).join('')}
              </div>
              <textarea class="form-textarea" id="review-comment" placeholder="اكتب تجربتك..."></textarea>
              <button class="btn btn-primary" onclick="submitReview('${role}')">إرسال التقييم</button>
            </div>
          </div>`;
        }

        window._rating = 5;
        window.setRating = function(n) { window._rating = n; document.querySelectorAll('.star').forEach(s => s.classList.toggle('active', parseInt(s.dataset.value) <= n)); };
        window.submitReview = async function(role) {
          const comment = document.getElementById('review-comment')?.value || '';
          await api('/trades/' + tradeId + '/review', 'POST', { rating: window._rating, comment });
          location.reload();
        };
        window.confirmPayment = async function() {
          if (!confirm('هل أنت متأكد من تأكيد الدفع؟')) return;
          await api('/trades/' + tradeId + '/confirm-payment', 'POST');
          location.reload();
        };
        window.sellerConfirm = async function() {
          if (!confirm('هل تريد تأكيد استلام الدفع وتحرير USDT؟')) return;
          await api('/trades/' + tradeId + '/seller-confirm', 'POST');
          location.reload();
        };
        window.cancelTrade = async function() {
          if (!confirm('هل تريد إلغاء الصفقة؟')) return;
          await api('/trades/' + tradeId + '/cancel', 'POST');
          location.reload();
        };
        window.openDispute = async function() {
          const reason = prompt('سبب النزاع:');
          if (!reason) return;
          await api('/trades/' + tradeId + '/dispute', 'POST', { reason });
          location.reload();
        };

        // Chat
        loadChat(t, me);

      } catch(e) {
        document.getElementById('loading').innerHTML = '<p class="text-error">خطأ في تحميل الصفقة</p>';
      }
    })();

    async function loadChat(t, me) {
      const container = document.getElementById('trade-chat');
      container.innerHTML = `<div class="card"><div class="card-header"><h3>💬 المحادثة</h3></div>
        <div id="messages" class="chat-messages" style="max-height:300px;overflow-y:auto;padding:1rem"></div>
        <div class="chat-input-bar">
          <input type="text" id="msg-input" class="form-input" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter')sendMsg()">
          <button class="btn btn-primary" onclick="sendMsg()">إرسال</button>
        </div></div>`;

      async function refreshMessages() {
        try {
          const data = await api(`/trades/${t.id}/messages`);
          const msgs = data.messages || [];
          const el = document.getElementById('messages');
          el.innerHTML = msgs.length ? msgs.map(m => `
            <div class="chat-bubble ${m.sender === me ? 'mine' : 'theirs'}">
              <div class="bubble-text">${escHtml(m.text)}</div>
              <div class="bubble-time">${new Date(m.created_at).toLocaleTimeString('ar')}</div>
            </div>
          `).join('') : '<p class="text-muted" style="text-align:center">لا توجد رسائل بعد</p>';
          el.scrollTop = el.scrollHeight;
        } catch(e) {}
      }
      await refreshMessages();
      setInterval(refreshMessages, 5000);
    }

    window.sendMsg = async function() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      const params = new URLSearchParams(window.location.search);
      await api(`/trades/${params.get('id')}/messages`, 'POST', { text });
      // trigger refresh
      document.querySelector('.chat-messages') && loadChat({id: params.get('id')}, window._me || '');
    };

    function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  </script>
  <style>
    .timeline { display:flex; gap:0; margin:1.5rem 0; padding:0 1rem; }
    .timeline-step { flex:1; text-align:center; position:relative; }
    .timeline-step:not(:last-child)::after { content:''; position:absolute; top:12px; right:0; left:0; height:2px; background:var(--border); z-index:0; }
    .timeline-step.active:not(:last-child)::after { background:var(--primary); }
    .timeline-dot { width:24px; height:24px; border-radius:50%; background:var(--border); color:var(--text-muted); display:inline-flex; align-items:center; justify-content:center; font-size:.75rem; font-weight:600; position:relative; z-index:1; }
    .timeline-step.active .timeline-dot { background:var(--primary); color:#fff; }
    .timeline-step.completed .timeline-dot { background:var(--success); color:#fff; }
    .timeline-label { font-size:.7rem; color:var(--text-muted); margin-top:.35rem; }
    .timeline-step.active .timeline-label { color:var(--primary); font-weight:600; }
    .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; padding:1rem; }
    .detail-item { display:flex; flex-direction:column; gap:.25rem; }
    .detail-label { font-size:.75rem; color:var(--text-muted); }
    .detail-value { font-size:.9rem; font-weight:600; color:var(--text); }
    .chat-messages { display:flex; flex-direction:column; gap:.5rem; }
    .chat-bubble { max-width:80%; padding:.6rem .8rem; border-radius:12px; font-size:.85rem; }
    .chat-bubble.mine { align-self:flex-start; background:var(--primary); color:#fff; border-bottom-right-radius:4px; }
    .chat-bubble.theirs { align-self:flex-end; background:var(--bg-secondary); color:var(--text); border-bottom-left-radius:4px; }
    .bubble-time { font-size:.65rem; opacity:.7; margin-top:.25rem; }
    .chat-input-bar { display:flex; gap:.5rem; padding:.75rem 1rem; border-top:1px solid var(--border); }
    .chat-input-bar .form-input { flex:1; }
    .star-rating { display:flex; gap:.25rem; margin-bottom:.75rem; }
    .star { font-size:1.5rem; color:var(--border); cursor:pointer; transition:color .15s; }
    .star.active, .star:hover { color:#f59e0b; }
  </style>
</body>
</html>
