<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفقة — USDT P2P Palestine</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<nav class="nav" id="nav"></nav>
<main class="main"><div class="container" style="max-width:640px" id="app"><div class="card"><div class="spinner"></div></div></div></main>
<div class="bottom-nav" id="bottomNav"></div>
</div>
<script src="/assets/app.js"></script>
<script>
let _trade = null;
let _msgs = [];
let _chatInterval = null;

const STEPS = ['PENDING','PAYMENT_SENT','PAYMENT_CONFIRMED','COMPLETED'];
const STEP_LABELS = ['إنشاء الصفقة','انتظار الدفع','تأكيد الدفع','مكتملة'];

async function load() {
  if (!requireAuth()) return;
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || params.get('trade');
  if (!id) { document.getElementById('app').innerHTML = '<div class="card"><div class="empty"><div class="empty-icon">📄</div><div class="empty-title">صفقة غير موجودة</div></div></div>'; return; }

  const [tradesResp, me] = await Promise.all([api('/trades'), api('/auth/me')]);
  const trades = tradesResp?.trades || [];
  _trade = trades.find(t => String(t.id) === String(id));
  if (!_trade) { document.getElementById('app').innerHTML = '<div class="card"><div class="empty"><div class="empty-icon">📄</div><div class="empty-title">صفقة غير موجودة</div></div></div>'; return; }

  const u = currentUser();
  const isBuyer = _trade.buyer === u.username;
  const isSeller = _trade.seller === u.username;
  const stepIdx = STEPS.indexOf(_trade.status);
  const stepPct = stepIdx >= 0 ? ((stepIdx + 1) / STEPS.length * 100) : 0;

  let actions = '';
  if (_trade.status === 'PENDING' && isBuyer) {
    actions = `<button class="btn btn-primary" onclick="confirmPayment()">💳 تم الدفع</button>`;
  } else if (_trade.status === 'PAYMENT_SENT' && isSeller) {
    actions = `<button class="btn btn-success" onclick="releaseFunds()">✅ تأكيد وتحرير USDT</button>`;
  }
  if (['PENDING','PAYMENT_SENT'].includes(_trade.status)) {
    actions += `<button class="btn btn-ghost" style="border-color:var(--danger);color:var(--danger)" onclick="cancelTrade()">❌ إلغاء</button>`;
  }

  document.getElementById('app').innerHTML = `
    <div class="card" style="padding:16px">
      <div class="flex-between" style="margin-bottom:12px">
        <h2 style="font-size:1.1rem;font-weight:700">الصفقة #${_trade.id}</h2>
        ${statusBadge(_trade.status)}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.85rem;color:var(--text-secondary)">
        <div>المشتري: <b style="color:var(--text)">${esc(_trade.buyer)}</b></div>
        <div>البائع: <b style="color:var(--text)">${esc(_trade.seller)}</b></div>
        <div>الكمية: <b style="color:var(--text)">${fmtNum(_trade.amount)} USDT</b></div>
        <div>السعر: <b style="color:var(--primary)">${fmtNum(_trade.price)} ₪</b></div>
        <div>المبلغ: <b style="color:var(--text)">${fmtNum(_trade.amount * _trade.price)} ₪</b></div>
        <div>الرسوم: <b>${fmtNum(_trade.platform_fee || _trade.fee || 0)}</b></div>
      </div>
    </div>

    <!-- Progress -->
    <div class="card" style="padding:16px">
      <div style="font-weight:600;margin-bottom:12px">📋 مراحل الصفقة</div>
      <div class="steps">${STEP_LABELS.map((label, i) => `<div class="step ${i <= stepIdx ? 'done' : ''} ${i === stepIdx ? 'active' : ''}">${label}</div>`).join('')}</div>
      ${_trade.created ? `<div style="font-size:.75rem;color:var(--text-muted);margin-top:8px;text-align:center">📅 ${fmtDate(_trade.created)}</div>` : ''}
    </div>

    <!-- Actions -->
    ${actions ? `<div class="card" style="padding:16px">${actions}</div>` : ''}

    <!-- Chat -->
    <div class="card" style="padding:16px">
      <div style="font-weight:600;margin-bottom:12px">💬 المحادثة</div>
      <div id="chatBox" style="max-height:300px;overflow-y:auto;margin-bottom:12px;padding:8px;background:var(--bg-input);border-radius:var(--radius-sm)">
        <div style="text-align:center;color:var(--text-muted);font-size:.85rem;padding:16px">جاري تحميل الرسائل...</div>
      </div>
      <div style="display:flex;gap:8px">
        <input type="text" id="chatInput" placeholder="اكتب رسالة..." style="flex:1;padding:10px 14px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px" onkeydown="if(event.key==='Enter')sendMsg()">
        <button class="btn btn-primary btn-sm" style="width:auto" onclick="sendMsg()">إرسال</button>
      </div>
    </div>
  `;

  loadChat();
  _chatInterval = setInterval(loadChat, 5000);
}

async function loadChat() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || params.get('trade');
  const resp = await api(`/trades/${id}/messages`);
  const msgs = resp?.messages || [];
  if (JSON.stringify(msgs) === JSON.stringify(_msgs)) return;
  _msgs = msgs;
  const u = currentUser();
  const box = document.getElementById('chatBox');
  if (!box) return;
  if (!msgs.length) { box.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:.85rem;padding:16px">لا توجد رسائل بعد</div>'; return; }
  box.innerHTML = msgs.map(m => {
    const sent = m.sender === u.username;
    return `<div class="chat-msg ${sent ? 'sent' : 'received'}"><div style="font-size:.7rem;opacity:.7;margin-bottom:2px">${esc(m.sender)}</div>${esc(m.text)}<span class="time">${fmtDate(m.created)}</span></div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

async function sendMsg() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || params.get('trade');
  await api(`/trades/${id}/messages`, { method: 'POST', body: { text } });
  loadChat();
}

async function confirmPayment() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || params.get('trade');
  const r = await api(`/trades/${id}/confirm-payment`, { method: 'POST' });
  if (r?.ok) { toast('✅ تم تأكيد الدفع'); load(); } else { toast(r?.error || 'خطأ', 4000); }
}

async function releaseFunds() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || params.get('trade');
  const r = await api(`/trades/${id}/seller-confirm`, { method: 'POST' });
  if (r?.ok) { toast('✅ تم تحرير USDT'); load(); } else { toast(r?.error || 'خطأ', 4000); }
}

async function cancelTrade() {
  if (!confirm('هل أنت متأكد من إلغاء الصفقة؟')) return;
  const params = new URLSearchParams(location.search);
  const id = params.get('id') || params.get('trade');
  const r = await api(`/trades/${id}/cancel`, { method: 'POST' });
  if (r?.ok) { toast('تم إلغاء الصفقة'); load(); } else { toast(r?.error || 'خطأ', 4000); }
}

load();
</script>
</body>
</html>
