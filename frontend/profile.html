<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي — USDT P2P Palestine</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<nav class="nav" id="nav"></nav>
<main class="main"><div class="container" style="max-width:640px" id="app"><div class="card"><div class="spinner"></div></div></div></main>
<div class="bottom-nav" id="bottomNav"></div>
</div>
<script src="/assets/app.js"></script>
<script>
let _tgLinkCode = '';

async function load() {
  if (!requireAuth()) return;
  const u = currentUser();
  const [me, prof, wallet] = await Promise.all([api('/auth/me'), api('/profile'), api('/wallet')]);
  const p = prof?.profile || {}; const w = wallet || {};
  const stats = prof?.stats || {};
  let trustResp = {};
  try { trustResp = (await api('/v2/trust/' + u.username)) || {}; } catch { trustResp = {}; }
  const t = trustResp.trust || {}; const v = trustResp.vip || {};
  const vc = v.level === 'verified' ? '💎' : v.level === 'gold' ? '🥇' : v.level === 'silver' ? '🥈' : '🥉';
  const vl = v.label || 'برونزي';
  const tg = u.telegram_id ? '🟢 مرتبط' : '⚪ غير مرتبط';
  const emailStatus = u.email_verified ? '🟢 موثق' : (u.email ? '🟡 غير موثق' : '🔴 بدون بريد');
  const themeLabel = getTheme() === 'dark' ? '🌙 الليلي' : getTheme() === 'light' ? '☀️ الفاتح' : '⚙️ تلقائي';

  document.getElementById('app').innerHTML = `
    <div style="text-align:center;padding:24px 0">
      <div class="avatar avatar-xl" style="margin:0 auto 12px">${(u.username||'?')[0].toUpperCase()}</div>
      <h1 style="font-size:1.3rem;font-weight:700;margin:0 0 4px">${esc(u.username)}</h1>
      <div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:8px">
        ${u.verified ? '<span class="badge badge-verified">✓ موثق</span>' : '<span class="badge" style="background:rgba(245,158,11,0.15);color:#f59e0b">غير موثق</span>'}
        <span class="badge badge-vip">${vc} ${vl}</span>
        ${t.trust_score ? `<span class="trust-score trust-high">🟢 ${fmtNum(t.trust_score,0)}% موثوق</span>` : ''}
        ${t.avg_rating ? `<span class="badge badge-info">⭐ ${fmtNum(t.avg_rating,1)}</span>` : ''}
      </div>
      <div style="font-size:.8rem;color:var(--text-muted)">${p.email || 'لا يوجد بريد'} · منذ ${fmtDate(u.created_at).split(',')[0]}</div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      <div class="card" style="text-align:center;padding:14px"><div style="font-size:1.3rem;font-weight:800;color:var(--primary)">${stats.total||0}</div><div style="font-size:.75rem;color:var(--text-muted)">صفقة</div></div>
      <div class="card" style="text-align:center;padding:14px"><div style="font-size:1.3rem;font-weight:800;color:var(--success)">${stats.completed||0}</div><div style="font-size:.75rem;color:var(--text-muted)">مكتملة</div></div>
    </div>

    <!-- Quick Actions -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      <a href="/wallet" class="card" style="padding:14px;text-align:center;text-decoration:none"><div style="font-size:1.5rem">💰</div><div style="font-size:.85rem;font-weight:600;margin-top:4px">المحفظة</div><div style="font-size:.75rem;color:var(--text-muted)">${fmtNum(w.balance)} USDT</div></a>
      <a href="/trades" class="card" style="padding:14px;text-align:center;text-decoration:none"><div style="font-size:1.5rem">📄</div><div style="font-size:.85rem;font-weight:600;margin-top:4px">الصفقات</div><div style="font-size:.75rem;color:var(--text-muted)">${stats.total||0} صفقة</div></a>
      <a href="/notifications" class="card" style="padding:14px;text-align:center;text-decoration:none"><div style="font-size:1.5rem">🔔</div><div style="font-size:.85rem;font-weight:600;margin-top:4px">الإشعارات</div></a>
      <a href="/create_ad" class="card" style="padding:14px;text-align:center;text-decoration:none"><div style="font-size:1.5rem">➕</div><div style="font-size:.85rem;font-weight:600;margin-top:4px">إعلان جديد</div></a>
    </div>

    <!-- Telegram -->
    <div class="card" style="padding:16px;margin-bottom:10px" id="tgSection">
      <div class="flex-between">
        <div class="flex" style="gap:12px;align-items:center">
          <span style="font-size:1.3rem">📱</span>
          <div><div style="font-weight:600">Telegram</div><div style="font-size:.8rem;color:var(--text-muted)" id="tgStatus">${tg}</div></div>
        </div>
        ${u.telegram_id
          ? '<span class="badge badge-verified">متصل ✓</span>'
          : '<button class="btn btn-ghost btn-sm" onclick="startTelegramLink()">ربط</button>'}
      </div>
      <div id="tgLinkBox" style="display:none;margin-top:12px;padding:12px;background:var(--bg-input);border-radius:var(--radius-sm)">
        <p style="font-size:.85rem;color:var(--text);margin-bottom:8px">1. افتح البوت في Telegram</p>
        <p style="font-size:.85rem;color:var(--text);margin-bottom:8px">2. أرسل الأمر التالي:</p>
        <div style="background:var(--bg);padding:10px;border-radius:8px;text-align:center;margin-bottom:8px">
          <span style="font-size:1.1rem;font-weight:800;letter-spacing:2px;color:var(--primary)" id="tgLinkCode">---</span>
        </div>
        <button class="btn btn-sm btn-ghost" onclick="copyLinkCode()" style="margin-bottom:4px">📋 نسخ الأمر</button>
        <p style="font-size:.75rem;color:var(--text-muted)">⏰ صالح لمدة 10 دقائق</p>
        <a href="https://t.me/usdtp2ppalestine" target="_blank" class="btn btn-sm" style="background:#0088cc;color:#fff;margin-top:8px">📱 فتح البوت</a>
      </div>
    </div>

    <!-- Appearance -->
    <div class="card" style="padding:16px;margin-bottom:10px">
      <div style="font-weight:600;margin-bottom:12px">🎨 المظهر</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-sm ${getTheme()==='dark'?'btn-primary':'btn-ghost'}" onclick="setTheme('dark');load()">🌙 الليلي</button>
        <button class="btn btn-sm ${getTheme()==='light'?'btn-primary':'btn-ghost'}" onclick="setTheme('light');load()">☀️ الفاتح</button>
        <button class="btn btn-sm ${getTheme()==='auto'?'btn-primary':'btn-ghost'}" onclick="setTheme('auto');load()">⚙️ تلقائي</button>
      </div>
    </div>

    <!-- Notification Preferences -->
    <div class="card" style="padding:16px;margin-bottom:10px">
      <div style="font-weight:600;margin-bottom:12px">🔔 إعدادات الإشعارات</div>
      <label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.85rem;cursor:pointer">
        <input type="checkbox" checked onchange="savePref('trades', this.checked)"> إشعارات الصفقات
      </label>
      <label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.85rem;cursor:pointer">
        <input type="checkbox" checked onchange="savePref('payments', this.checked)"> إشعارات الدفع
      </label>
      <label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.85rem;cursor:pointer">
        <input type="checkbox" checked onchange="savePref('disputes', this.checked)"> إشعارات النزاعات
      </label>
    </div>

    <!-- Security -->
    <div class="card" style="padding:16px;margin-bottom:10px">
      <div style="font-weight:600;margin-bottom:12px">🔒 الأمان</div>
      <div style="font-size:.85rem;color:var(--text-secondary);margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)">
          <span>البريد الإلكتروني</span><span>${emailStatus}</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)">
          <span>Telegram</span><span>${tg}</span>
        </div>
        <div style="display:flex;justify-content:space-between;padding:6px 0">
          <span>التحقق من الهوية</span><span>${u.verified ? '🟢 موثق' : '🔴 غير موثق'}</span>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm btn-block" onclick="toast('قريباً — تغيير كلمة المرور')">🔑 تغيير كلمة المرور</button>
    </div>

    <button class="btn btn-ghost btn-block" style="margin-top:8px;border-color:var(--danger);color:var(--danger)" onclick="doLogout()">تسجيل الخروج</button>`;
}

async function startTelegramLink() {
  const r = await api('/auth/telegram/link', { method: 'POST' });
  if (r && r.ok && r.code) {
    _tgLinkCode = r.code;
    document.getElementById('tgLinkCode').textContent = '/link ' + r.code;
    document.getElementById('tgLinkBox').style.display = 'block';
    toast('تم إنشاء الكود — أرسله للبوت');
  } else {
    toast(r?.error || 'خطأ في إنشاء الكود', 4000);
  }
}

function copyLinkCode() {
  navigator.clipboard?.writeText('/link ' + _tgLinkCode);
  toast('تم نسخ الأمر');
}

async function savePref(type, enabled) {
  await api('/telegram/prefs', { method: 'POST', body: { [type]: enabled } });
}

load();
</script>
</body>
</html>
