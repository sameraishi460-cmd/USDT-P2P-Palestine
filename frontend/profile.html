<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي — USDT P2P Palestine</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<nav class="nav" id="nav"></nav>
<main class="main">
<div class="container" id="app">
<div class="loading-skeleton">
<div class="sk sk-card"></div>
</div>
</div>
</main>
<div class="bottom-nav" id="bottomNav"></div>
</div>
<script src="/assets/app.js"></script>
<script>
(function(){
  const app=document.getElementById('app');
  async function load(){
    if(!Auth.isLoggedIn()){location.href='/login';return;}
    const user=Auth.user();
    let trust=null,wallet=null;
    try{trust=await API.get('/api/v2/trust/'+user.username);}catch(e){}
    try{wallet=await API.get('/api/wallet');}catch(e){}

    const vipBadge=trust?.vip_level==='verified'?'💎':trust?.vip_level==='gold'?'🥇':trust?.vip_level==='silver'?'🥈':'🥉';
    const vipLabel=trust?.vip_level==='verified'?'متداول موثق':trust?.vip_level==='gold'?'ذهبي':trust?.vip_level==='silver'?'فضي':'برونزي';

    app.innerHTML=`
      <div class="page-header" style="text-align:center;padding-top:var(--space-xl)">
        <div style="width:80px;height:80px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto var(--space-sm);font-weight:700">${(user.username||'U')[0].toUpperCase()}</div>
        <h1 class="page-title" style="margin-bottom:4px">${user.username||'مستخدم'}</h1>
        ${user.email?`<div class="text-muted text-sm">${user.email}</div>`:''}
        <div style="display:flex;justify-content:center;gap:var(--space-sm);margin-top:var(--space-sm);flex-wrap:wrap">
          ${trust?`<span class="badge badge-success"> Trust Score: ${trust.trust_score}%</span>`:''}
          <span class="badge badge-info">${vipBadge} ${vipLabel}</span>
          ${trust?.avg_rating?`<span class="badge badge-info">⭐ ${Number(trust.avg_rating).toFixed(1)}</span>`:''}
        </div>
      </div>

      <div class="grid grid-2" style="margin-bottom:var(--space-lg)">
        <div class="card text-center">
          <div class="stat-value">${trust?.completed_trades||0}</div>
          <div class="stat-label">صفقة مكتملة</div>
        </div>
        <div class="card text-center">
          <div class="stat-value">${trust?.completion_rate!=null?Number(trust.completion_rate).toFixed(0)+'%':'—'}</div>
          <div class="stat-label">نسبة الإتمام</div>
        </div>
      </div>

      <div class="card" style="margin-bottom:var(--space-md)">
        <h3 style="margin-bottom:var(--space-md)">المحفظة</h3>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-md)">
          <div>
            <div class="text-muted text-sm">الرصيد المتاح</div>
            <div class="stat-value" style="font-size:1.5rem">${fmtNum(wallet?.balance||0)} USDT</div>
          </div>
          <div style="display:flex;gap:var(--space-sm)">
            <a href="/wallet" class="btn btn-primary btn-sm">إيداع</a>
            <a href="/wallet" class="btn btn-outline btn-sm">سحب</a>
          </div>
        </div>
      </div>

      <div class="card" style="margin-bottom:var(--space-md)">
        <h3 style="margin-bottom:var(--space-md)">الإحالات</h3>
        <p class="text-muted text-sm" style="margin-bottom:var(--space-sm)">ادعُ أصدقاءك واحصل على مكافآت</p>
        <div class="form-group" style="margin-bottom:var(--space-sm)">
          <input type="text" class="form-input" value="${user.referral_code||'REF-'+(user.username||'YOU').toUpperCase()}" readonly id="refCode">
        </div>
        <button class="btn btn-outline btn-block btn-sm" onclick="navigator.clipboard.writeText(document.getElementById('refCode').value);toast.show('تم النسخ','success')">نسخ رابط الإحالة</button>
      </div>

      <div class="card" style="margin-bottom:var(--space-md)">
        <h3 style="margin-bottom:var(--space-md)">الأمان</h3>
        <div class="flex-col gap-sm">
          <div class="flex-between" style="padding:var(--space-sm) 0;border-bottom:1px solid var(--border)">
            <div>
              <div style="font-weight:500">Telegram</div>
              <div class="text-muted text-sm">${user.telegram_id?'متصل ✓':'غير متصل'}</div>
            </div>
            ${user.telegram_id?'<span class="badge badge-success">متصل</span>':'<button class="btn btn-outline btn-sm" onclick="loginWithTelegram()">ربط</button>'}
          </div>
          <div class="flex-between" style="padding:var(--space-sm) 0;border-bottom:1px solid var(--border)">
            <div>
              <div style="font-weight:500">البريد الإلكتروني</div>
              <div class="text-muted text-sm">${user.email||'لم يُحدد'}</div>
            </div>
            <span class="badge badge-info">${user.email?'مفعل':'غير مفعل'}</span>
          </div>
          <div class="flex-between" style="padding:var(--space-sm) 0">
            <div>
              <div style="font-weight:500">تاريخ الإنشاء</div>
              <div class="text-muted text-sm">${fmtDate(user.created_at)}</div>
            </div>
          </div>
        </div>
      </div>

      <button class="btn btn-error btn-block" onclick="Auth.logout();location.href='/'" style="margin-bottom:var(--space-xl)">تسجيل الخروج</button>
    `;
  }

  window.loginWithTelegram=function(){
    const botUsername=window.TELEGRAM_BOT_USERNAME||'USDT_P2P_Palestine_Bot';
    const payload=JSON.stringify({platform:'usdt-p2p',ts:Date.now()});
    location.href='https://oauth.telegram.org/auth?bot_id='+botUsername+'&origin='+encodeURIComponent(location.origin)+'&embed=1&request_access=write';
  };

  load();
})();
</script>
</body>
</html>
