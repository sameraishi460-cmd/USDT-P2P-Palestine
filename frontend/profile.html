<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e18">
<title>ملفي — USDT P2P Palestine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="navbar">
  <span class="logo">👤 حسابي</span>
  <div class="actions"><a href="/" style="font-size:20px;">🏠</a></div>
</div>
<div class="container">
  <!-- Profile Card -->
  <div class="card" id="profileCard" style="text-align:center;">
    <div class="skeleton" style="height:120px;"></div>
  </div>

  <!-- Edit -->
  <div class="card">
    <div class="card-title">📝 تعديل المعلومات</div>
    <form id="editForm">
      <div class="form-group"><label>الاسم الأول</label><input id="eName" type="text"></div>
      <div class="form-group"><label>رقم الهاتف</label><input id="ePhone" type="tel"></div>
      <div class="form-group"><label>البنك</label><input id="eBank" type="text"></div>
      <div class="form-group"><label>IBAN</label><input id="eIban" type="text"></div>
      <div class="form-group"><label>طريقة الدفع</label><input id="ePay" type="text" placeholder="تحويل بنكي / فودافون كاش"></div>
      <button type="submit" class="btn btn-primary">💾 حفظ</button>
    </form>
  </div>

  <!-- Admin Link -->
  <div id="adminLink" style="display:none;" class="text-center">
    <a href="/admin.html" class="btn btn-ghost" style="margin-top:10px;border-color:var(--gold);color:var(--gold);">⚙️ لوحة التحكم</a>
  </div>

  <!-- Logout -->
  <button onclick="logout()" class="btn btn-danger" style="margin-top:10px;">🚪 تسجيل الخروج</button>
</div>
<div class="bottom-nav">
  <a href="/"><span class="icon">🏠</span>الرئيسية</a>
  <a href="/market.html"><span class="icon">🛒</span>السوق</a>
  <a href="/trades.html"><span class="icon">📄</span>الصفقات</a>
  <a href="/wallet.html"><span class="icon">💰</span>المحفظة</a>
  <a href="/profile.html" class="active"><span class="icon">👤</span>حسابي</a>
</div>
<div id="toast"></div>
<script src="assets/app.js"></script>
<script>
if (!requireAuth('/profile.html')) throw new Error('auth');
(async function() {
  const r = await get('/profile');
  if (!r?.ok) return;
  const p = r.profile;
  const s = r.stats || {};
  $('#profileCard').innerHTML = `
    ${profileAvatar(p.username, true)}
    <h2 style="margin-top:10px;">${escHtml(p.username)} ${p.verified ? verifiedBadge(true) : ''}</h2>
    ${p.first_name ? `<div class="muted">${escHtml(p.first_name)}</div>` : ''}
    <div class="grid-3" style="margin-top:16px;">
      <div class="kpi"><div class="kpi-label">صفقات</div><div class="kpi-value">${s.total || 0}</div></div>
      <div class="kpi"><div class="kpi-label">مكتملة</div><div class="kpi-value text-primary">${s.completed || 0}</div></div>
      <div class="kpi"><div class="kpi-label">نزاعات</div><div class="kpi-value text-warning">${s.disputed || 0}</div></div>
    </div>
    <div class="muted text-xs" style="margin-top:10px;">عضو منذ: ${formatDate(p.created_at)}</div>`;
  $('#eName').value = p.first_name || '';
  $('#ePhone').value = p.phone || '';
  $('#eBank').value = p.bank || '';
  $('#eIban').value = p.iban || '';
  $('#ePay').value = p.payment_method || '';
  if (getUser()?.isAdmin) $('#adminLink').style.display = 'block';
})();
$('#editForm').onsubmit = async (e) => {
  e.preventDefault();
  const r = await post('/profile/edit', { first_name: $('#eName').value.trim(), phone: $('#ePhone').value.trim(), bank: $('#eBank').value.trim(), iban: $('#eIban').value.trim(), payment_method: $('#ePay').value.trim() });
  if (r?.ok) { toast('✅ تم الحفظ'); location.reload(); }
};
function logout() { post('/auth/logout').finally(() => { clearAuth(); location.href = '/'; }); }
</script>
</body>
</html>
