<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>حسابي — USDT P2P Palestine</title>
  <link rel="stylesheet" href="/assets/design-system.css">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <div id="nav"></div>
  <div id="bottom-nav"></div>

  <main class="main-content">
    <div id="loading" class="loading-spinner">
      <div class="spinner"></div>
      <p>جاري التحميل...</p>
    </div>
    <div id="profile-content" style="display:none"></div>
  </main>

  <script src="/assets/app.js"></script>
  <script>
    (async function() {
      const user = await requireAuth();
      if (!user) return;

      const trustRes = await api('/v2/trust/' + user.username).catch(() => ({}));
      const trust = trustRes.trust || {};

      document.getElementById('profile-content').innerHTML = `
        <div class="page-header">
          <h1 class="page-title">حسابي</h1>
        </div>

        <div class="card profile-card">
          <div class="profile-header">
            <div class="avatar-lg">${(user.username||'?')[0].toUpperCase()}</div>
            <div class="profile-info">
              <h2 class="profile-name">${escH(user.username)}</h2>
              <p class="profile-email">${escH(user.email || '—')}</p>
              <div class="profile-badges">
                ${trust.is_verified ? '<span class="badge badge-success">✓ موثق</span>' : '<span class="badge badge-neutral">غير موثق</span>'}
                <span class="badge badge-info">⭐ ${trust.trust_score || 0}</span>
                ${user.role === 'admin' ? '<span class="badge badge-warning">👑 Admin</span>' : ''}
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3>📊 الإحصائيات</h3></div>
          <div class="stats-grid">
            <div class="stat-item"><span class="stat-value">${trust.completed_trades || 0}</span><span class="stat-label">صفقات مكتملة</span></div>
            <div class="stat-item"><span class="stat-value">${trust.rating ? Number(trust.rating).toFixed(1) : '—'}</span><span class="stat-label">التقييم</span></div>
            <div class="stat-item"><span class="stat-value">${trust.success_rate || 0}%</span><span class="stat-label">نسبة النجاح</span></div>
            <div class="stat-item"><span class="stat-value">${trust.trust_score || 0}</span><span class="stat-label">نقطة ثقة</span></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3>🔗 ربط Telegram</h3></div>
          <div class="card-body">
            <p id="tg-status">جاري التحقق...</p>
            <div id="tg-link-section" style="display:none">
              <button class="btn btn-primary btn-block" onclick="linkTelegram()">🔗 ربط حساب Telegram</button>
              <p class="text-muted text-sm" style="margin-top:.5rem">سيتم إرسال كود للبوت. أرسله عبر /link لربط الحساب.</p>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3>⚙️ المظهر</h3></div>
          <div class="card-body">
            <div class="setting-row" onclick="setTheme('light')">
              <span>☀️ الوضع الفاتح</span>
              <span class="setting-check" id="theme-light">✓</span>
            </div>
            <div class="setting-row" onclick="setTheme('dark')">
              <span>🌙 الوضع الليلي</span>
              <span class="setting-check" id="theme-dark">✓</span>
            </div>
            <div class="setting-row" onclick="setTheme('auto')">
              <span>⚙️ تلقائي حسب الجهاز</span>
              <span class="setting-check" id="theme-auto">✓</span>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3>🔔 إعدادات الإشعارات</h3></div>
          <div class="card-body">
            <label class="setting-toggle"><input type="checkbox" id="pref-trades" onchange="savePrefs()"> إشعارات الصفقات</label>
            <label class="setting-toggle"><input type="checkbox" id="pref-payments" onchange="savePrefs()"> إشعارات الدفع</label>
            <label class="setting-toggle"><input type="checkbox" id="pref-disputes" onchange="savePrefs()"> إشعارات النزاعات</label>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3>💳 المحافظة</h3></div>
          <div class="card-body">
            <button class="btn btn-primary btn-block" onclick="window.location.href='/wallet'">فتح المحفظة</button>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3>🔗 الإحالات</h3></div>
          <div class="card-body">
            <p class="text-muted" style="margin-bottom:.5rem">شارك كود الإحالة الخاص بك:</p>
            <div class="referral-box">
              <code id="ref-code">${user.referral_code || '—'}</code>
              <button class="btn btn-sm" onclick="copyReferral()">📋 نسخ</button>
            </div>
          </div>
        </div>

        <button class="btn btn-error btn-block" style="margin:1rem 0" onclick="doLogout()">🚪 تسجيل الخروج</button>
      `;

      document.getElementById('loading').style.display = 'none';
      document.getElementById('profile-content').style.display = 'block';

      // Check Telegram
      try {
        const tgRes = await api('/telegram/prefs');
        document.getElementById('tg-status').innerHTML = '🟢 Telegram مرتبط';
      } catch(e) {
        document.getElementById('tg-status').innerHTML = '⚪ Telegram غير مرتبط';
        document.getElementById('tg-link-section').style.display = 'block';
      }

      // Theme
      const savedTheme = localStorage.getItem(THEME_KEY) || 'auto';
      ['light','dark','auto'].forEach(t => {
        const el = document.getElementById('theme-' + t);
        if (el) el.style.display = t === savedTheme ? 'inline' : 'none';
      });

      // Prefs
      try {
        const prefsRes = await api('/telegram/prefs');
        const prefs = prefsRes.prefs || {};
        document.getElementById('pref-trades').checked = prefs.trades !== false;
        document.getElementById('pref-payments').checked = prefs.payments !== false;
        document.getElementById('pref-disputes').checked = prefs.disputes !== false;
      } catch(e) {}
    })();

    window.linkTelegram = async function() {
      try {
        const res = await api('/auth/telegram/link', 'POST');
        const code = res.code;
        if (code) {
          alert('أرسل هذا البوت مع الكود:\n\n/link ' + code + '\n\nأو اضغط الزر أدناه.');
          window.open('https://t.me/usdt_p2p_palestine_bot?start=link_' + code, '_blank');
        }
      } catch(e) {
        alert('خطأ في إنشاء كود الربط');
      }
    };

    window.copyReferral = function() {
      const code = document.getElementById('ref-code').textContent;
      if (code && code !== '—') {
        navigator.clipboard.writeText(window.location.origin + '/register?ref=' + code);
        alert('تم نسخ رابط الإحالة!');
      }
    };

    window.doLogout = function() {
      if (confirm('هل تريد تسجيل الخروج؟')) {
        localStorage.removeItem(AUTH_KEY);
        window.location.href = '/login';
      }
    };

    window.savePrefs = async function() {
      await api('/telegram/prefs', 'POST', {
        trades: document.getElementById('pref-trades').checked,
        payments: document.getElementById('pref-payments').checked,
        disputes: document.getElementById('pref-disputes').checked
      });
    };

    function escH(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  </script>
  <style>
    .profile-card { padding: 1.5rem; }
    .profile-header { display:flex; align-items:center; gap:1rem; margin-bottom:1rem; }
    .avatar-lg { width:56px; height:56px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:700; flex-shrink:0; }
    .profile-info { flex:1; }
    .profile-name { font-size:1.1rem; font-weight:700; margin:0; }
    .profile-email { font-size:.8rem; color:var(--text-muted); margin:0; }
    .profile-badges { display:flex; gap:.5rem; margin-top:.5rem; flex-wrap:wrap; }
    .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; padding:1rem; }
    .stat-item { text-align:center; padding:.75rem; background:var(--bg-secondary); border-radius:var(--radius-sm); }
    .stat-value { display:block; font-size:1.2rem; font-weight:700; color:var(--text); }
    .stat-label { display:block; font-size:.7rem; color:var(--text-muted); margin-top:.2rem; }
    .setting-row { display:flex; justify-content:space-between; align-items:center; padding:.75rem 0; border-bottom:1px solid var(--border); cursor:pointer; }
    .setting-row:last-child { border-bottom:none; }
    .setting-check { color:var(--primary); font-weight:700; }
    .setting-toggle { display:flex; align-items:center; justify-content:space-between; padding:.6rem 0; border-bottom:1px solid var(--border); cursor:pointer; }
    .setting-toggle:last-child { border-bottom:none; }
    .referral-box { display:flex; align-items:center; gap:.5rem; background:var(--bg-secondary); padding:.75rem; border-radius:var(--radius-sm); }
    .referral-box code { flex:1; font-size:.85rem; direction:ltr; text-align:left; }
  </style>
</body>
</html>
