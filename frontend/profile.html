<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07090D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>الملف الشخصي — USDT P2P Palestine</title>
  <link rel="stylesheet" href="/assets/design-system.css">
  <link rel="manifest" href="/manifest.json">
  <script>(function(){var t=localStorage.getItem("usp_theme")||"dark";if(t==="auto")t=window.matchMedia("(prefers-color-scheme:light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t);})();</script>
  <style>
    .profile-hero{text-align:center;padding:var(--sp-5) var(--sp-4);background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:var(--sp-4);position:relative;overflow:hidden;}
    .profile-hero::before{content:'';position:absolute;top:-40px;right:-30px;width:150px;height:150px;background:radial-gradient(circle,rgba(0,214,160,0.06),transparent 70%);pointer-events:none;}
    .profile-avatar{width:64px;height:64px;border-radius:50%;background:var(--primary-dim);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;color:var(--primary);margin:0 auto var(--sp-3);border:2px solid var(--primary);}
    .profile-name{font-size:1.1rem;font-weight:800;color:var(--text-primary);margin-bottom:var(--sp-1);}
    .profile-badge{font-size:0.7rem;padding:3px 10px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
    .profile-badge.verified{background:var(--success-dim);color:var(--success);}
    .profile-badge.pending{background:var(--warning-dim);color:var(--warning);}
    .profile-badge.unverified{background:var(--danger-dim);color:var(--danger);}
    .profile-menu{margin-bottom:var(--sp-3);}
    .profile-menu-item{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:var(--sp-2);text-decoration:none;color:var(--text-primary);transition:background 0.15s;}
    .profile-menu-item:hover{background:var(--bg-card-hover);}
    .profile-menu-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
    .profile-menu-icon.security{background:rgba(255,92,108,0.10);color:var(--danger);}
    .profile-menu-icon.kyc{background:var(--warning-dim);color:var(--warning);}
    .profile-menu-icon.email{background:rgba(91,141,239,0.10);color:#5B8DEF;}
    .profile-menu-icon.password{background:var(--primary-dim);color:var(--primary);}
    .profile-menu-icon.sessions{background:rgba(108,99,255,0.10);color:var(--purple);}
    .profile-menu-icon.logout{background:var(--danger-dim);color:var(--danger);}
    .profile-menu-label{flex:1;font-size:0.85rem;font-weight:600;}
    .profile-menu-arrow{color:var(--text-muted);font-size:0.8rem;}
    .profile-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--sp-2);margin-bottom:var(--sp-4);}
  </style>
</head>
<body>
  <nav class="navbar" id="nav"></nav>
  <main>
    <div class="container page-pad">
      <div id="loading" class="text-center py-3">
        <div class="spinner"></div>
      </div>
      <div id="profile-content" style="display:none;"></div>
    </div>
  </main>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/assets/app.js"></script>
  <script>
  (async function() {
    const user = await requireAuth();
    if (!user) return;

    let me = {};
    try { me = await api('/auth/me') || {}; } catch {}
    let wallet = {};
    try { wallet = await api('/wallet') || {}; } catch {}

    const username = me.username || user.username || '—';
    const email = me.email || '';
    const verified = me.email_verified || me.verified;
    const isAdmin = me.role === 'ADMIN' || me.isAdmin;

    document.getElementById('profile-content').innerHTML = `
      <!-- Profile Hero -->
      <div class="profile-hero">
        <div class="profile-avatar">${username[0].toUpperCase()}</div>
        <div class="profile-name">${esc(username)}</div>
        ${verified ? '<div class="profile-badge verified">✓ موثق</div>' : '<div class="profile-badge unverified">غير موثق</div>'}
        ${isAdmin ? '<div style="margin-top:var(--sp-2);"><span class="badge badge-primary" style="font-size:0.65rem;">Admin</span></div>' : ''}
      </div>

      <!-- Stats -->
      <div class="profile-stats">
        <div class="stat-card">
          <div class="stat-label">الرصيد</div>
          <div class="stat-value success">${fmtNum(wallet.balance || 0)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">المقفل</div>
          <div class="stat-value warning">${fmtNum(wallet.locked || 0)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">التقييم</div>
          <div class="stat-value">${me.rating ? fmtNum(me.rating, 1) : '—'}</div>
        </div>
      </div>

      <!-- Email -->
      ${email ? `<div class="card-section mb-3"><div class="flex-between"><span class="text-sm text-secondary">📧 ${esc(email)}</span>${verified ? '<span class="profile-badge verified" style="font-size:0.6rem;">✓ موثق</span>' : '<span class="profile-badge pending" style="font-size:0.6rem;">غير موثق</span>'}</div></div>` : ''}

      <!-- Menu -->
      <div class="profile-menu">
        ${isAdmin ? '<a href="/admin" class="profile-menu-item"><div class="profile-menu-icon security">⚙</div><div class="profile-menu-label">لوحة الإدارة</div><div class="profile-menu-arrow">←</div></a>' : ''}
        <a href="/profile?section=security" class="profile-menu-item">
          <div class="profile-menu-icon security">🔐</div>
          <div class="profile-menu-label">مركز الأمان</div>
          <div class="profile-menu-arrow">←</div>
        </a>
        <a href="/profile?section=kyc" class="profile-menu-item">
          <div class="profile-menu-icon kyc">🪪</div>
          <div class="profile-menu-label">التحقق من الهوية</div>
          <div class="profile-menu-arrow">←</div>
        </a>
        <a href="/profile?section=sessions" class="profile-menu-item">
          <div class="profile-menu-icon sessions">📱</div>
          <div class="profile-menu-label">الجلسات النشطة</div>
          <div class="profile-menu-arrow">←</div>
        </a>
        <a href="/forgot_password" class="profile-menu-item">
          <div class="profile-menu-icon password">🔑</div>
          <div class="profile-menu-label">تغيير كلمة المرور</div>
          <div class="profile-menu-arrow">←</div>
        </a>
        <button class="profile-menu-item" onclick="doLogout()" style="width:100%;cursor:pointer;border:none;background:none;text-align:right;">
          <div class="profile-menu-icon logout">🚪</div>
          <div class="profile-menu-label" style="color:var(--danger);">تسجيل الخروج</div>
        </button>
      </div>
    `;

    document.getElementById('loading').style.display = 'none';
    document.getElementById('profile-content').style.display = 'block';
  })();
  </script>
</body>
</html>
