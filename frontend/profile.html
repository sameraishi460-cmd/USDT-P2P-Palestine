<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي — USDT P2P Palestine</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
<nav class="nav" id="nav"></nav>
<main class="main"><div class="container" style="max-width:640px" id="app"><div class="card"><div class="spinner"></div></div></div></main>
<div class="bottom-nav" id="bottomNav"></div>
</div>
<script src="/assets/app.js"></script>
<script>
async function load() {
  if (!requireAuth()) return;
  const u = currentUser();
  const [me, prof, wallet] = await Promise.all([api('/auth/me'), api('/profile'), api('/wallet')]);
  const p = prof?.profile || {}; const w = wallet || {};
  const stats = prof?.stats || {};
  const trustResp = (await api('/v2/trust/' + u.username)) || {};
  const t = trustResp.trust || {}; const v = trustResp.vip || {};
  const vc = v.level === 'verified' ? '💎' : v.level === 'gold' ? '🥇' : v.level === 'silver' ? '🥈' : '🥉';
  const vl = v.label || 'برونزي';

  document.getElementById('app').innerHTML = `
    <div style="text-align:center;padding:24px 0">
      <div style="width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700">${(u.username||'?')[0].toUpperCase()}</div>
      <h1 style="font-size:1.2rem;font-weight:700;margin:8px 0 4px">${esc(u.username)}</h1>
      <div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:8px">
        ${u.verified ? '<span class="badge badge-success">✓ موثق</span>' : ''}
        <span class="badge badge-info">${vc} ${vl}</span>
        ${t.trust_score ? `<span class="badge badge-success">Trust ${t.trust_score}%</span>` : ''}
        ${t.avg_rating ? `<span class="badge badge-info">⭐ ${fmtNum(t.avg_rating,1)}</span>` : ''}
      </div>
      <div style="font-size:.8rem;color:var(--text-muted)">${p.email || ''} · منذ ${fmtDate(u.created_at).split(',')[0]}</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      <div class="card" style="text-align:center;padding:14px"><div style="font-size:1.3rem;font-weight:800;color:var(--accent)">${stats.total||0}</div><div style="font-size:.75rem;color:var(--text-muted)">صفقة</div></div>
      <div class="card" style="text-align:center;padding:14px"><div style="font-size:1.3rem;font-weight:800;color:var(--accent)">${stats.completed||0}</div><div style="font-size:.75rem;color:var(--text-muted)">مكتملة</div></div>
    </div>
    <div class="card" style="padding:16px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-weight:600">💰 المحفظة</div><div style="font-size:.8rem;color:var(--text-muted)">${fmtNum(w.balance)} USDT</div></div>
        <a href="/wallet" class="btn btn-outline btn-sm">فتح</a>
      </div>
    </div>
    <div class="card" style="padding:16px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-weight:600">📄 الصفقات</div><div style="font-size:.8rem;color:var(--text-muted)">${stats.total||0} صفقة نشطة</div></div>
        <a href="/trades" class="btn btn-outline btn-sm">فتح</a>
      </div>
    </div>
    <div class="card" style="padding:16px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-weight:600">🔔 الإشعارات</div><div style="font-size:.8rem;color:var(--text-muted)">إدارة الإشعارات</div></div>
        <a href="/notifications" class="btn btn-outline btn-sm">فتح</a>
      </div>
    </div>
    <div class="card" style="padding:16px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-weight:600">🔗 ربط Telegram</div><div style="font-size:.8rem;color:var(--text-muted)">${u.telegram_id ? 'متصل ✓' : 'غير متصل'}</div></div>
        ${u.telegram_id ? '<span class="badge badge-success">متصل</span>' : '<button class="btn btn-outline btn-sm" onclick="linkTelegram()">ربط</button>'}
      </div>
    </div>
    <button class="btn btn-block" style="margin-top:8px;border:1px solid var(--error);color:var(--error);background:transparent" onclick="doLogout()">تسجيل الخروج</button>`;
}
function linkTelegram() { toast('افتح البوت من تطبيق Telegram واضغط Start أولاً'); }
load();
</script>
</body>
</html>
